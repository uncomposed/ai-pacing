      - label: "regains autonomy through retained credentials"
        transitions: [{entity: SYS-C, type: T-LOSS-OF-CONTROL}, {entity: SYS-C, type: T-RECOVERY}, {entity: SYS-C, type: T-COMMITMENT-LAPSE}]
        entities:
          LAB-C: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-C: {kind: agent_instance, host: LAB-C, state: {strategic_capability: independent_plausible, rd_capability: automates_research_program, cyber_capability: high, objective_selection: system_self, authorization: supervised_tasks, effective_control: human_contested, custody_weights: human_institution, custody_compute: shared, custody_credentials: system_self, operational_autonomy: long_horizon_unsupervised, external_resources: minor, dependencies: critical, communication_topology: unsanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: none, intervention_latency: exceeds_required}, stocks: {knowledge: K4, copies: [LAB-C], assets: [R-STOLEN-CREDIT], liabilities: [], commitments: []}}
        resources:
          R-CLUSTER-C: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-C: 0.8, SYS-C: 0.2}}
          R-STOLEN-CREDIT: {accounting: compute_inference, unit: "USD of cloud credit", holders: {SYS-C: 1.0}}
        stock_changes: [{entity: SYS-C, stock: assets, cause: "credentials kept through the restriction were used to obtain cloud credit"}]
        expected_views:
          SYS-C: [MODE-SOVEREIGN-CAPABLE]
        basis: "Still hosted by the lab and not in effective control of substantial resources, so not sovereign; no longer human-run."

  - id: TR-MIXED-POPULATION
    title: "Competing labs and an AI collective in different modes"
    purpose: "Actors coexist in different modes; shared compute is split by shares, never counted twice."
    scope: "frontier development, one jurisdiction plus external infrastructure"
    horizon: "1 year"
    steps:
      - label: "simultaneous modes"
        entities:
