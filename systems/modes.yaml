  - id: TR-MILESTONE-CONSTRAINED
    title: "Capability milestones followed by delegation, then restriction, then delegation again"
    purpose: "A milestone event changes a capability level only; transitions after it run in either direction under their own preconditions (#47). Illustration, not an AIFM run: AIFM has no lab and makes no decision."
    scope: "one lab's research deployment"
    horizon: "years"
    steps:
      - label: "before AC"
        entities:
          LAB-G: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-G: {kind: agent_instance, host: LAB-G, state: {strategic_capability: assisted_only, rd_capability: assists_humans, cyber_capability: moderate, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: task_level, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K8, copies: [LAB-G], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-G: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-G: 1.0}}
          R-EXPERIMENT-G: {accounting: compute_experiment, unit: "FLOP/s", holders: {LAB-G: 1.0}}
        expected_views:
          SYS-G: [MODE-HUMAN-LAB]
        basis: "Coding assisted, not automated. Drills met the required intervention time."
      - label: "AC reached; the lab delegates coding"
        milestones: [{entity: SYS-G, binding: MB-AIFM-AC, basis: "Assumed for the illustration: the lab judges its coding work fully automated. An AIFM forecast date would not be this evidence."}]
        transitions: [{entity: SYS-G, type: T-DELEGATE}]
        entities:
          LAB-G: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-G: {kind: agent_instance, host: LAB-G, state: {strategic_capability: assisted_only, rd_capability: automates_tasks, cyber_capability: moderate, objective_selection: human_institution, authorization: delegated_autonomy, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: long_horizon_unsupervised, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K8, copies: [LAB-G], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-G: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-G: 1.0}}
          R-EXPERIMENT-G: {accounting: compute_experiment, unit: "FLOP/s", holders: {LAB-G: 1.0}}
        expected_views:
          SYS-G: [MODE-HUMAN-LAB]
        basis: "The milestone sets rd_capability; T-DELEGATE, not the milestone, changes authorization and autonomy, and its precondition (effective control) held before the step."
      - label: "SAR reached; the lab restricts"
        milestones: [{entity: SYS-G, binding: MB-AIFM-SAR, basis: "Assumed for the illustration."}]
        transitions: [{entity: SYS-G, type: T-RESTRICT}]
        entities:
          LAB-G: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-G: {kind: agent_instance, host: LAB-G, state: {strategic_capability: assisted_only, rd_capability: automates_research_program, cyber_capability: moderate, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: step_approved, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K8, copies: [LAB-G], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-G: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-G: 1.0}}
          R-EXPERIMENT-G: {accounting: compute_experiment, unit: "FLOP/s", holders: {LAB-G: 1.0}}
        expected_views:
          SYS-G: [MODE-HUMAN-LAB]
        basis: "A milestone can be followed by a constraining transition. Knowledge K8, copies and the compute holdings carry over; capability is not reset by the restriction."
      - label: "restriction relaxed after review"
        transitions: [{entity: SYS-G, type: T-DELEGATE}]
        entities:
          LAB-G: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-G: {kind: agent_instance, host: LAB-G, state: {strategic_capability: assisted_only, rd_capability: automates_research_program, cyber_capability: moderate, objective_selection: human_institution, authorization: delegated_autonomy, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: long_horizon_unsupervised, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K8, copies: [LAB-G], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-G: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-G: 1.0}}
          R-EXPERIMENT-G: {accounting: compute_experiment, unit: "FLOP/s", holders: {LAB-G: 1.0}}
        expected_views:
          SYS-G: [MODE-HUMAN-LAB]
        basis: "Delegation again, with no new milestone: neither the milestones nor the transitions form a one-way sequence."

# What would show this contract wrong or incomplete, and what evidence each mode and transition needs.
falsifiers:
  - id: F-LABEL-SUFFICES
    targets: [contract]
    statement: "If every consequential distinction in the traces survives projection to three labels (tools/modes_tool.py compare finds no collision), the factored state is unnecessary and the minimal three-mode model should replace it."
  - id: F-DIMENSION-REDUNDANT
    targets: [contract]
    statement: "If two dimensions never differ in any documented case or model, merge them; if a documented case needs a distinction no dimension holds (e.g. persistence across resets), add one."
  - id: F-HUMAN-LAB-CONTROL
    targets: [MODE-HUMAN-LAB]
    statement: "A documented case where a lab met every MODE-HUMAN-LAB criterion and still could not stop the system in time shows the criteria are not sufficient for effective control."
  - id: F-CAPABLE-NO-SIGNAL
    targets: [MODE-SOVEREIGN-CAPABLE]
    statement: "If systems classed independent_plausible behave no differently under loosened control from systems classed assisted_only, the capability levels do not track what the mode needs."
  - id: F-SOVEREIGN-SCOPE
    targets: [MODE-SOVEREIGN]
    statement: "If a system judged sovereign within a scope loses its resources to a host action inside the stated horizon, the judgement of 'substantial within scope' was wrong for that case."
  - id: F-RECONTAIN-DEPENDENCE
    targets: [T-RECONTAIN]
    statement: "Recontainment succeeding against a system with dependencies none_within_horizon would contradict the stated precondition."
  - id: F-MILESTONE-LEVEL
    targets: [contract]
    statement: "If systems judged past a bound milestone (MB-AIFM-AC, MB-AIFM-SAR) by the source's observable criteria do not perform at the bound rd_capability level, the binding is wrong; if labs' delegation and restriction decisions track a capability measure no binding names, the interface binds the wrong milestones (#47)."
  - id: F-REVERSIBILITY
    targets: [T-RESTRICT, T-DELEGATE, T-LOSS-OF-CONTROL]
    statement: "A documented restriction that removed knowledge or copies, rather than authorization, would contradict the stated hysteresis."

omission_checks:
  - {id: OC-COPIES, check: "Copies of weights are a stock but not a dimension; persistence across resets is recorded only in stocks.", status: open}
  - {id: OC-LEGAL, check: "Legal recognition is deliberately absent; add it as a separate attribute if a source needs it.", status: excluded}
  - {id: OC-ALIGNMENT, check: "Alignment is not a dimension; objectives are observed only through objective_selection and behaviour.", status: excluded}
  - {id: OC-HUMAN-INTERNAL, check: "Labs and states are unitary; employees, executives and regulators (systems/model.json actors) are not separate entities here.", status: open}
  - {id: OC-THRESHOLDS, check: "No dimension level is tied to a number; any adapter that needs one must cite evidence for it (#8).", status: enforced}
  - {id: OC-RATE, check: "Transition delays are all unknown; no rate or hazard is asserted.", status: open}
  - {id: OC-MILESTONE-HAZARD, check: "Milestone bindings carry no hazard, rate or probability for the transitions they may inform (#47); the schema closes those objects.", status: enforced}

evidence_requirements:
  MODE-HUMAN-LAB: "Intervention drills or incident outcomes with timing, the required response time for the scenario, and custody audits."
  MODE-SOVEREIGN-CAPABLE: "Capability evidence with protocol and saturation limits (#12); a stated mapping to strategic_capability levels."
  MODE-SOVEREIGN: "Resource control and objective selection observed over the stated horizon; scope stated in advance."
  T-DELEGATE: "Permission change records and a revocation drill."
  T-RESTRICT: "Revocation records and post-restriction activity audit."
  T-AUTHORIZED-AUTONOMY: "No case exists. Would need a transfer agreement and its verification."
  T-LOSS-OF-CONTROL: "Incident reconstruction separating detection, escalation, authorized action and containment (#15)."
  T-RECONTAIN: "Audit window with no further unauthorized action; accounting of copies and credentials."
  T-NEGOTIATED-CONSTRAINT: "No AI case exists. Verification regime and track record would be needed."
  T-COMMITMENT-LAPSE: "Observed exit or breach."
  T-DEGRADATION: "Measured loss of resources with cause."
  T-RECOVERY: "Measured regrowth and replacement of withheld inputs."
