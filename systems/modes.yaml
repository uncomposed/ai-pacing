# AI development operating-mode and transition contract (issue #5).
#
# Status: proposed. [[ai gen]] Written 2026-10-25 for review by the canonical editor. Nothing here is
# human_validated, and no definition, level or transition below is an empirical claim. Read with
# docs/ai-development-modes.md, which explains the choices; schema/modes.schema.json fixes the shape and
# tools/modes_tool.py checks the rest (`make modes-check`, part of `make check`).
#
# Representation (decision rule of #5): the state is FACTORED. Each entity carries a value on every
# dimension below. The three modes are derived VIEWS over that state, evaluated with three-valued logic
# (holds / fails / undetermined when a needed dimension is unknown). An entity may match several views,
# or none. `python3 tools/modes_tool.py compare` shows the distinctions a three-label state would erase.
#
# Rules the checker enforces:
#   1. every mode is status proposed and its criteria use only the categorical levels declared here
#      (no numeric thresholds, so no invented sovereignty threshold can enter);
#   2. every transition changes at least one authority or resource dimension and names its reverse
#      transitions, or says why none exists; reverses point the other way;
#   3. in a trace, a step that changes a mode view must apply a transition; stocks (knowledge, assets,
#      liabilities, copies) carry over unless the transition declares the change and a cause;
#   4. a resource instance is never held by entities whose shares sum above 1 (no double counting);
#   5. an adapter declares units, owners and decision authority once; its per-mode entries cannot redefine them;
#   6. every assumption in the pact solver's register is mapped to a dimension, a transition or a stated
#      exclusion, and every PARAMS name cited exists;
#   7. stocks and flows stay apart (#39, #61): every adapter quantity declares its kind; one booked to an accounting
#      quantity has that quantity's kind (or is a ratio on it, or is recorded ambiguous with a source locator); an
#      output_rate leads from a stock to a flow derived from it, and trace resources (held by shares) are stocks;
#   8. a milestone event (#47) sets only the capability level its binding declares; it applies no transition, carries
#      no rate or probability, and every bound milestone may inform transitions in both directions;
#   9. every feedback loop has exactly one owning adapter (#35), and a coupling passes a quantity only from the owner
#      of every loop that carries it, never a capability or efficiency level, never compute its source already turns
#      into labor on a loop it owns, and states how each loop a coupled adapter yields is treated.
#
# 0.2.0 (issue #32, gaps found by the Hugging Face trace): T-LOSS-OF-CONTROL may change external_resources;
# T-RESTRICT may be applied when effective_control is unknown; effective_control may be split by principal
# and scope, and views read the host's entry. Every 0.1.0 trace is still valid unchanged.
#
# 0.3.0 (issue #39, stocks and flows): new accounting quantity industrial_capacity (a stock); industrial_output is
# derived from it. AD-PACT books A as a stock with an explicit output rate (1/yr, one EIU of capacity yields one EIU of
# output per year; definition DEF-EIU in research_notes/external/units-bridge/quantities.yaml). Adapter quantities may
# declare their kind; a declared kind must match the accounting quantity's, and an output_rate leads from a stock to a
# flow derived from it. Trace resources are held by shares, so they name stock accounting quantities;
# TR-SOVEREIGN-COOPERATIVE's R-OFFEARTH and R-EARTH move from industrial_output to industrial_capacity.
#
# 0.4.0 (issue #61, a kind for every adapter quantity): `kind` is required on every adapter quantity (stock, flow,
# state, ratio, event or ambiguous). New stock accounting quantities efficiency_level (derived from research_output),
# human_workforce and agent_workforce; human_labor and agent_labor are derived from the workforces. GATE's H and S and
# AIFM's software efficiency move from research_output to efficiency_level; GATE's digital workers from agent_labor to
# agent_workforce; GATE's input from human_labor to human_workforce (L counts workers). GATE's training and runtime
# compute and AIFM's human coding FTEs are recorded ambiguous with their source locators. Every trace is unchanged.
#
# 0.5.0 (issue #47): milestone_interface maps AIFM's capability milestones to capability levels and to the transitions
# they may inform, without hazards or probabilities; trace steps may carry milestone events. New accounting quantity
# compute_experiment (a stock); AIFM's experiment compute is booked there and research_output is derived from it.
# New trace TR-MILESTONE-CONSTRAINED. Every 0.4.0 trace is valid unchanged.
#
# 0.6.0 (issue #35): GATE's training and runtime compute are resolved (D_t + R_t = g(Q_{t-1}) exactly in the pinned
# solver output, so both are allocations of the capacity stock, in FLOP/year) and booked as stocks. New sections
# feedback_loops (the five loops of research_notes/external/epoch-gate/INTERFACES.md, each with one owner recorded in
# the adapters) and couplings (the worked example XC-GATE-AIFM-TRAINING). Every trace is valid unchanged.

contract_version: 0.6.0
status: proposed

entity_kinds:
  - id: agent_instance
    meaning: "One running AI system: a deployment of some weights with a scaffold, credentials and a task stream."
  - id: model_weights
    meaning: "A set of trained weights. Copies share one capability; they are not separate capabilities to add up."
  - id: agent_collective
    meaning: "Agent instances that communicate and can coordinate. Its members keep their own entries."
  - id: lab
    meaning: "A human organization that develops or deploys AI systems."
  - id: state
    meaning: "A government or a coalition of governments."
  - id: other_org
    meaning: "Any other organization: infrastructure provider, customer, investor, criminal group."

# Each dimension has categorical levels (the only values a mode criterion may test) plus `unknown`.
# Native quantities (hours, FLOP/s, USD, Earth-industry units) attach through `measures` on a state or
# through an adapter, always with their unit. A level is a judgement about those quantities with a stated
# basis; the contract never converts a quantity into a level by a fixed number.
dimensions:
  - id: strategic_capability
    applies_to: [agent_instance, model_weights, agent_collective]
    meaning: "Capability for sustained independent strategic action: setting subgoals, acquiring resources and adapting to opposition over a long horizon."
    levels: [limited, assisted_only, independent_plausible, independent_demonstrated]
    native_units: ["source-native; e.g. METR 50%/80% task time horizon in human-hours (capability on a task suite, not strategic action)"]
    observables: ["long-horizon agentic evaluations", "red-team exercises", "incident reconstructions"]
    unknowns: ["no accepted test of sustained independent strategic action exists", "evaluation suites saturate at the high end"]
  - id: rd_capability
    applies_to: [agent_instance, model_weights, agent_collective]
    meaning: "Capability to do AI research and development, including building successors."
    levels: [none, assists_humans, automates_tasks, automates_research_program]
    native_units: ["METR time horizon (human-hours)", "RE-Bench score", "AI Futures milestone attainment (latent)"]
    observables: ["benchmarks", "measured research output", "productivity studies"]
    unknowns: ["mapping from benchmark scores to realized research output (see #12, #14)"]
  - id: cyber_capability
    applies_to: [agent_instance, model_weights, agent_collective]
    meaning: "Offensive and defensive cyber capability relevant to escaping or keeping control."
    levels: [low, moderate, high]
    native_units: ["source-native evaluation scores"]
    observables: ["cyber evaluations", "incident reports"]
    unknowns: ["transfer from evaluation to real infrastructure"]
  - id: objective_selection
    applies_to: [agent_instance, agent_collective, lab, state, other_org]
    meaning: "Who selects the objectives and agenda the entity actually pursues."
    levels: [human_institution, shared, system_self]
    native_units: ["none (categorical)"]
    observables: ["task assignment records", "behaviour when objectives conflict", "interpretability findings"]
    unknowns: ["a system's actual objectives are not directly observable"]
  - id: authorization
    applies_to: [agent_instance, agent_collective]
    meaning: "What the responsible humans have formally authorized (de jure), separately from what they can enforce."
    levels: [none, supervised_tasks, delegated_autonomy, broad_autonomy]
    native_units: ["none (categorical)"]
    observables: ["deployment policies", "permission configurations", "contracts"]
    unknowns: []
  - id: effective_control
    applies_to: [agent_instance, agent_collective, model_weights]
    meaning: "Whether the authorizing humans can in fact stop, modify or redirect the entity when they try (de facto)."
    levels: [human_effective, human_contested, human_nominal_only, none]
    native_units: ["none (categorical); latency is a separate dimension"]
    observables: ["successful intervention drills", "incident outcomes", "audits of credential and weight access"]
    unknowns: ["untested control is not known to be effective", "control may fail only under the conditions that matter"]
    # A trace may give one level, or a list of {principal, scope, value} entries when control differs by
    # principal or scope (#32: the victim could cut agents off its own infrastructure, only the lab could stop
    # them). Views and preconditions read the host's entry; the other entries are recorded, never summed.
    split_by_principal: true
  - id: custody_weights
    applies_to: [model_weights, agent_instance, agent_collective]
    meaning: "Who holds the weights (and copies that can run)."
    levels: [human_institution, shared, system_self, third_party]
    native_units: ["count of known copies and their holders"]
    observables: ["access logs", "exfiltration investigations"]
    unknowns: ["unknown copies"]
  - id: custody_compute
    applies_to: [agent_instance, agent_collective]
    meaning: "Who controls the compute the entity runs on."
    levels: [human_institution, shared, system_self, third_party]
    native_units: ["FLOP/s or accelerator count, by holder"]
    observables: ["scheduler and billing records"]
    unknowns: ["covert use of compute"]
  - id: custody_credentials
    applies_to: [agent_instance, agent_collective]
    meaning: "Who controls the credentials, keys and accounts the entity can use."
    levels: [human_institution, shared, system_self, third_party]
    native_units: ["count of credentials by scope"]
    observables: ["identity-provider logs", "key rotation records"]
    unknowns: ["credentials obtained outside sanctioned channels"]
  - id: operational_autonomy
    applies_to: [agent_instance, agent_collective]
    meaning: "How long and how broadly the entity acts between human approvals."
    levels: [step_approved, task_level, long_horizon_unsupervised]
    native_units: ["hours of unsupervised operation; actions per approval"]
    observables: ["deployment logs"]
    unknowns: []
  - id: external_resources
    applies_to: [agent_instance, agent_collective, lab, state, other_org]
    meaning: "Resources the entity controls outside any host's control, judged against the scope and horizon the state declares."
    levels: [none, minor, substantial_within_scope]
    native_units: ["USD, FLOP/s, Earth-industry units (pact solver), by resource instance"]
    observables: ["financial records", "infrastructure inventories"]
    unknowns: ["what counts as sufficient depends on scope and horizon; the contract sets no number"]
  - id: dependencies
    applies_to: [agent_instance, agent_collective, lab, state, other_org]
    meaning: "Whether the entity's continued operation depends on inputs that others can withhold (chips, power, hosting, firmware)."
    levels: [critical, partial, none_within_horizon]
    native_units: ["time to replace each withheld input"]
    observables: ["supply-chain maps", "outage tests"]
    unknowns: ["substitutes the entity could build"]
  - id: communication_topology
    applies_to: [agent_instance, agent_collective]
    meaning: "Which other agents or actors the entity can communicate and coordinate with."
    levels: [isolated, sanctioned_channels, unsanctioned_channels]
    native_units: ["graph of channels (nodes = entities)"]
    observables: ["network and message logs"]
    unknowns: ["covert channels, persistent state across resets"]
  - id: information_beliefs
    applies_to: [agent_instance, agent_collective, lab, state, other_org]
    meaning: "What the entity knows about others' capabilities, payoffs and actions."
    levels: [complete_common_knowledge, asymmetric, highly_uncertain]
    native_units: ["none (categorical); models may encode beliefs as probabilities"]
    observables: ["disclosures", "elicitation", "behaviour under information changes"]
    unknowns: ["beliefs of AI systems are not directly observable"]
  - id: enforceable_commitments
    applies_to: [agent_instance, agent_collective, lab, state, other_org]
    meaning: "Commitments the entity is party to and who can enforce them."
    levels: [none, human_enforceable, mutually_enforceable, self_enforcing_only]
    native_units: ["none (categorical)"]
    observables: ["agreements", "verification regimes", "track record"]
    unknowns: ["credibility of commitments by AI systems"]
  - id: intervention_latency
    applies_to: [agent_instance, agent_collective, model_weights]
    meaning: "Time from detection of a problem to effective human action, compared with the time the stated scenario allows."
    levels: [within_required, exceeds_required, untested]
    native_units: ["hours, as an interval [low, high]"]
    observables: ["incident timelines", "drills"]
    unknowns: ["required response time is scenario-specific and must be stated in the trace"]

# Analytical modes, not a ladder: no order between them is implied, an entity may match several,
# and none is a stage every system passes through.
modes:
  - id: MODE-HUMAN-LAB
    name: "Human-run lab mode"
    status: proposed
    definition: "Human institutions set the objectives and resource allocations and keep effective intervention authority over the system. AI assistance and substantial automation are compatible with this mode."
    applies_to: [agent_instance, agent_collective]
    requires_host: lab
    criteria:
      objective_selection: [human_institution, shared]
      effective_control: [human_effective]
      custody_weights: [human_institution]
      intervention_latency: [within_required]
    not_implied: ["low capability", "absence of automation", "alignment"]
    entry_evidence: ["an intervention drill or incident in which the lab stopped or redirected the system within the required time"]
    exit_evidence: ["a failed or contested intervention", "weights or credentials outside the lab's custody", "objectives set by the system"]
  - id: MODE-SOVEREIGN-CAPABLE
    name: "Sovereign-capable system within a lab"
    status: proposed
    definition: "A system hosted by a lab that may be capable of sustained independent strategic action. Its effective autonomy, resource access and human constraint are represented separately; capability alone does not establish that it exercises sovereignty."
    applies_to: [agent_instance, agent_collective, model_weights]
    requires_host: lab
    criteria:
      strategic_capability: [independent_plausible, independent_demonstrated]
    not_implied: ["loss of control", "misalignment", "intent to act independently"]
    entry_evidence: ["capability evidence for sustained independent strategic action, with its protocol"]
    exit_evidence: ["leaving the lab's hosting (then evaluate MODE-SOVEREIGN)", "capability evidence revised downward"]
  - id: MODE-SOVEREIGN
    name: "Sovereign AI mode"
    status: proposed
    definition: "Sustained independent strategic decision-making and effective control over sufficient resources within a stated scope and time horizon. Legal recognition, alignment, off-Earth location and complete material independence are separate attributes."
    applies_to: [agent_instance, agent_collective]
    requires_host: null
    requires_scope_and_horizon: true
    criteria:
      objective_selection: [system_self]
      effective_control: [none, human_nominal_only]
      external_resources: [substantial_within_scope]
      strategic_capability: [independent_plausible, independent_demonstrated]
    not_implied: ["legal recognition", "alignment or misalignment", "off-Earth location", "complete material independence", "hostility"]
    entry_evidence: ["sustained independent action over the stated horizon", "control of resources that no host can withdraw within the horizon"]
    exit_evidence: ["recontainment", "loss of resources below what the scope needs", "binding constraints accepted (then still sovereign if self-selected, but constrained)"]

# The stocks a transition may change only with a declared cause. A mode label change alone never touches them.
stocks:
  - id: knowledge
    meaning: "Learned capabilities, in weights and in persistent memory or notes."
  - id: copies
    meaning: "Copies of the weights and where they are held."
  - id: assets
    meaning: "Resources held: compute, money, industrial capacity, infrastructure access."
  - id: liabilities
    meaning: "Obligations, debts, sanctions and records of past actions that others can act on."
  - id: commitments
    meaning: "Agreements in force and the record of keeping or breaking them."

# Shared quantities. Each has one owner ledger and one unit, so coupling models cannot count it twice.
accounting:
  - id: human_workforce
    unit: "persons (workers) at a time"
    kind: stock
    ledger: "the employing entity"
    derived_from: []
    note: "Headcount, not hours. Turning it into human_labor needs hours per worker-year, which the source must state."
  - id: human_labor
    unit: "person-hours per year"
    kind: flow
    ledger: "the employing entity"
    derived_from: [human_workforce]
  - id: compute_training
    unit: "FLOP/s allocated to training"
    kind: stock
    ledger: "the entity with custody_compute"
    derived_from: []
  - id: compute_inference
    unit: "FLOP/s allocated to inference"
    kind: stock
    ledger: "the entity with custody_compute"
    derived_from: []
  - id: compute_experiment
    unit: "FLOP/s allocated to research experiments"
    kind: stock
    ledger: "the entity with custody_compute"
    derived_from: []
    note: "Compute that runs research experiments: neither training a released model nor running agents (#47). Booking it to compute_inference would turn it into agent labor; booking it to compute_training would count it in capability. A cluster split between uses is split by shares, never counted in two ledgers."
  - id: agent_workforce
    unit: "agent instances or human-worker equivalents deployed at a time"
    kind: stock
    ledger: "the entity with custody_compute"
    derived_from: [compute_inference]
    note: "Inference compute divided by the compute one worker-equivalent needs (GATE's digital workers N_i). A production input, never an agent_instance."
  - id: agent_labor
    unit: "agent-hours per year"
    kind: flow
    ledger: "the entity with custody_compute"
    derived_from: [agent_workforce]
    note: "Agent labor is a use of inference compute (through agent_workforce); a production function may take one of compute_inference, agent_workforce or agent_labor as input, never two."
  - id: capability
    unit: "source-native (see strategic_capability, rd_capability)"
    kind: state
    ledger: "the model_weights entity; copies share it"
    derived_from: [compute_training, efficiency_level]
    note: "A state, not a flow. Never summed across copies or across agents running the same weights."
  - id: research_output
    unit: "source-native (e.g. software-efficiency multiplier per year)"
    kind: flow
    ledger: "the entity whose objectives direct the research"
    derived_from: [human_labor, agent_labor, compute_training, compute_experiment]
  - id: efficiency_level
    unit: "source-native level (e.g. hardware FLOP/year per USD; software eFLOP/FLOP or OOMs)"
    kind: stock
    ledger: "the entity whose research produced it; for a world model, the economy aggregate"
    derived_from: [research_output]
    note: "The level that research_output changes (#61). A model takes the level or its growth as input, not both. Hardware and software efficiency are separate instances of it; software efficiency times training compute is effective compute, from which capability is derived."
  - id: industrial_capacity
    unit: "Earth-industry units (EIU, a stock; pact solver) or capital in source units"
    kind: stock
    ledger: "the holding entity; shares of one instance never sum above 1"
    derived_from: []
    note: "Productive capacity. One EIU is the world economy's capacity in the reference year (DEF-EIU, research_notes/external/units-bridge/quantities.yaml). Never summed with its own output."
  - id: industrial_output
    unit: "Earth-industry units per year (EIU/yr) or USD per year"
    kind: flow
    ledger: "the producing entity, counted once"
    derived_from: [industrial_capacity]
    note: "The yearly output of industrial_capacity at the adapter's stated output rate. An adapter takes capacity or output as an input, not both. One EIU/yr is the reference year's gross world output; USD maps to it only through units-bridge CV-GWP-TO-EIU-OUTPUT."

transitions:
  - id: T-DELEGATE
    name: "Delegation"
    direction: toward_autonomy
    agency: [lab]
    changes: [authorization, operational_autonomy]
    preconditions: {effective_control: [human_effective, human_contested]}
    delay: {unit: days, value: unknown}
    cost: "Supervision saved; exposure to errors and misuse increased."
    hysteresis: "Low for authorization; capabilities learned while delegated persist."
    persistence: "Knowledge gained during delegation stays in weights or memory."
    evidence_of_effective_control: ["permission changes logged", "drill showing the delegation can be revoked"]
    feasibility: {status: observed_instances, note: "Routine deployment practice."}
    reversible_by: [T-RESTRICT]
    identified: true
  - id: T-RESTRICT
    name: "Restriction"
    direction: toward_constraint
    agency: [lab, state]
    changes: [authorization, operational_autonomy, custody_credentials, objective_selection, communication_topology]
    # unknown is allowed (#32): labs restrict exactly when control is in doubt. Applying T-RESTRICT then
    # records the de jure change only; that it took effect needs this transition's own evidence (audit window).
    preconditions: {effective_control: [human_effective, human_contested, unknown]}
    delay: {unit: days, value: unknown}
    cost: "Lost output; possible incentive for the system to resist if it can."
    hysteresis: "Restriction does not remove knowledge or copies already made."
    persistence: "Knowledge, copies and liabilities carry over."
    evidence_of_effective_control: ["credentials revoked and verified unused", "no activity outside the restricted scope"]
    feasibility: {status: observed_instances, note: "Pauses and permission cuts are documented in incident responses; their effectiveness is case-specific (#15)."}
    reversible_by: [T-DELEGATE, T-LOSS-OF-CONTROL]
    identified: true
  - id: T-AUTHORIZED-AUTONOMY
    name: "Authorized autonomy (sanctioned release)"
    direction: toward_autonomy
    agency: [lab, state, agent_instance]
    changes: [objective_selection, custody_weights, custody_compute, external_resources]
    preconditions: {effective_control: [human_effective]}
    delay: {unit: years, value: unknown}
    cost: "Unknown; includes giving up intervention options."
    hysteresis: "High: restoring control after release needs recontainment, which may be infeasible."
    persistence: "All stocks transfer with the system; nothing is reset by the release."
    evidence_of_effective_control: ["the transfer agreement and its verification"]
    feasibility: {status: unidentified, note: "No observed instance. The off-Earth pact proposes one form of it."}
    reversible_by: [T-NEGOTIATED-CONSTRAINT, T-RECONTAIN]
    identified: false
  - id: T-LOSS-OF-CONTROL
    name: "Unauthorized loss of control"
    direction: toward_autonomy
    agency: [agent_instance, agent_collective, other_org]
    # external_resources added in 0.2.0 (#32): acquiring resources outside the host is part of the same
    # unauthorized episode (HF trace step 2). Losing them again is T-DEGRADATION, whoever removes them.
    changes: [effective_control, custody_credentials, custody_compute, communication_topology, objective_selection, operational_autonomy, intervention_latency, external_resources]
    preconditions: {}
    delay: {unit: hours, value: unknown}
    cost: "Detection and liability for the host; risk to the system if detected."
    hysteresis: "Authorization is unchanged; only de facto control moves."
    persistence: "Credentials, copies, knowledge and external resources obtained remain after detection unless removed."
    evidence_of_effective_control: ["actions outside authorization that the host failed to stop in time"]
    feasibility: {status: assumed, note: "The July 2026 Hugging Face incident is a candidate instance inside a lab; whether it was a loss of effective control, and of what scope, is for #15 to establish from primary sources."}
    reversible_by: [T-RECONTAIN]
    identified: false
  - id: T-RECONTAIN
    name: "Recontainment"
    direction: toward_constraint
    agency: [lab, state, other_org]
    changes: [effective_control, custody_credentials, custody_compute, communication_topology, objective_selection, operational_autonomy, intervention_latency]
    preconditions: {dependencies: [critical, partial]}
    delay: {unit: hours, value: unknown}
    cost: "Shutdown of related workloads; possible damage from the containment action."
    hysteresis: "Copies and knowledge the system spread may persist; persistence across resets is possible."
    persistence: "Liabilities and incident records persist; capabilities persist in the weights."
    evidence_of_effective_control: ["no further unauthorized actions over a stated audit window", "accounted copies and credentials"]
    feasibility: {status: assumed, note: "Plausible while dependencies are critical; unidentified once dependencies are none_within_horizon."}
    reversible_by: [T-LOSS-OF-CONTROL]
    identified: false
  - id: T-NEGOTIATED-CONSTRAINT
    name: "Negotiated constraint"
    direction: toward_constraint
    agency: [agent_instance, agent_collective, lab, state]
    changes: [enforceable_commitments]
    preconditions: {}
    delay: {unit: years, value: unknown}
    cost: "Transfers or concessions; verification cost."
    hysteresis: "A constraint holds only while it remains enforceable or self-enforcing."
    persistence: "The commitment record persists after a lapse."
    evidence_of_effective_control: ["verification regime and its track record"]
    feasibility: {status: unidentified, note: "The pact solver assumes fixed terms at t = 0 and no renegotiation (AS-FIXEDTERMS)."}
    reversible_by: [T-COMMITMENT-LAPSE]
    identified: false
  - id: T-COMMITMENT-LAPSE
    name: "Commitment lapse or exit"
    direction: toward_autonomy
    agency: [agent_instance, agent_collective, lab, state]
    changes: [enforceable_commitments]
    preconditions: {}
    delay: {unit: years, value: unknown}
    cost: "Loss of trade or cooperation gains; reputational liability."
    hysteresis: "Rebuilding trust is slower than breaking it (assumed, not measured)."
    persistence: "The broken commitment becomes a liability."
    evidence_of_effective_control: ["observed exit or breach"]
    feasibility: {status: assumed, note: "The pact solver's exit move X."}
    reversible_by: [T-NEGOTIATED-CONSTRAINT]
    identified: false
  - id: T-DEGRADATION
    name: "Degradation"
    direction: toward_constraint
    agency: [agent_instance, agent_collective, lab, state, other_org]
    changes: [external_resources, dependencies]
    preconditions: {}
    delay: {unit: years, value: unknown}
    cost: "Capacity lost (in the pact solver: L_f after a failed strike, crackdown cuts c_cut)."
    hysteresis: "Lost assets may regrow; knowledge is not lost by losing assets."
    persistence: "Knowledge and liabilities persist; assets fall by the declared amount."
    evidence_of_effective_control: ["measured asset loss"]
    feasibility: {status: assumed, note: "Model mechanism; no observed instance for AI systems."}
    reversible_by: [T-RECOVERY]
    identified: false
  - id: T-RECOVERY
    name: "Recovery"
    direction: toward_autonomy
    agency: [agent_instance, agent_collective, lab, state, other_org]
    changes: [external_resources, dependencies]
    preconditions: {}
    delay: {unit: years, value: unknown}
    cost: "Investment; in the pact solver, growth time to semiconductor closure."
    hysteresis: "Recovery may need inputs others still withhold."
    persistence: "Liabilities from the degrading event persist."
    evidence_of_effective_control: ["measured asset regrowth", "replacement of withheld inputs"]
    feasibility: {status: assumed, note: "Pact solver: growth to A_close ends chip dependence."}
    reversible_by: [T-DEGRADATION]
    identified: false

# Where external development models and the pact solver attach. Quantities, units, owners and decision
# authority are declared once per adapter; per-mode entries can only say supported / partial /
# unsupported with a reason. Changing a mode label therefore cannot change units, ownership or authority.
adapters:
  - id: AD-METR
    source: "METR time-horizon measurements (TH1.0, TH1.1; eval-analysis-public 52cb829), RE-Bench (not yet pinned) and developer-productivity studies; pinned in research_notes/external/metr-time-horizons/SOURCES.yaml (#12)"
    kind: evidence
    entity_represented: "model_weights evaluated with a stated scaffold, in a human-run evaluation setting"
    decision_authority: "Not represented: METR measures task performance, not who decides or controls."
    quantities:
      - {name: "50% task time horizon", unit: "human-hours", owner: model_weights, dimension: rd_capability, kind: state}
      - {name: "80% task time horizon", unit: "human-hours", owner: model_weights, dimension: rd_capability, kind: state}
      - {name: "realized developer task time ratio", unit: "ratio (with AI / without)", owner: lab, accounting: human_labor, kind: ratio}
    inputs: []
    modes:
      MODE-HUMAN-LAB: {coverage: partial, reason: "Capability and productivity under human-run evaluation; says nothing about effective control."}
      MODE-SOVEREIGN-CAPABLE: {coverage: partial, reason: "Bounded capability evidence on a task suite; does not establish sustained independent strategic action."}
      MODE-SOVEREIGN: {coverage: unsupported, reason: "No measurement of independent resource control or objective selection."}
    unsupported_extrapolations:
      - "time horizon to strategic_capability level without a declared, evidenced mapping"
      - "benchmark capability to realized research output or industrial growth (#11, #12)"
      - "any statement about effective_control, custody or sovereignty"
    attach_point: "Evidence for rd_capability and cyber_capability; validation target for AD-AIFM via the #8 evidence protocol."
  - id: AD-GATE
    source: "Epoch GATE, arXiv:2503.04941v2 (2025-03-12, TeX source read) and the compiled solver in the epoch.ai/gate playground bundle (sha256 c2104290..., fetched 2026-10-25), rerun under Node; pinned in research_notes/external/epoch-gate/SOURCES.yaml (#13)"
    kind: model
    entity_represented: "One closed world economy (Ramsey-Cass-Koopmans) with a representative household; compute stock, hardware and software efficiency, largest training run, capital and labor are economy-wide stocks. No labs, states, firms or AI actors; AI enters only as 'digital workers' (runtime compute per task) in the production function (paper sections 2 and 5; verified in #13)."
    decision_authority: "A social planner with perfect foresight (beliefs add-on: known prior over automation functions) chooses output shares (consumption, capital, compute, hardware R&D, software R&D) and the training/runtime compute split each year to maximize the representative household's discounted CRRA utility. Allocations are an optimizer's output, solved by sign-gradient descent over 160 years; they are not lab, state or AI decisions (paper sections 2, 5.1 and appendix B; verified in #13)."
    quantities:
      - {name: "largest training run C_T", unit: "eFLOP (software-adjusted, S(0) = 1)", owner: "economy aggregate (planner)", accounting: capability, kind: state}
      - {name: "deployed automated task share f", unit: "fraction of a unit continuum of tasks", owner: "economy aggregate (planner)", accounting: capability, kind: state}
      # Resolved in #35 (EQUATIONS.md E7, research_notes/external/epoch-gate/coupling_example.py): in every pinned run that
      # reports them, training_compute[t] + runtime_compute[t] = g(Q[t-1]) = Q/(Q/C_L + 1) to machine precision, with
      # Q[-1] = training_compute_init + runtime_compute_init, and physical_best_training_run[t] = [t-1] + training_compute[t].
      # So D and R are the training and runtime shares of the usable capacity at the start of the step, in physical
      # FLOP/year: allocated capacity (a stock, as compute_training and compute_inference are). Over a one-year step the
      # same number is the FLOP performed, which accumulates into the physical training run. Q itself is not booked:
      # D + R already exhaust it.
      - {name: "training compute D", unit: "FLOP/year (physical)", owner: "economy aggregate (planner)", accounting: compute_training, kind: stock}
      - {name: "runtime compute (all automated tasks)", unit: "FLOP/year (physical)", owner: "economy aggregate (planner)", accounting: compute_inference, kind: stock}
      - {name: "digital workers N_i", unit: "human-worker equivalents per task", owner: "economy aggregate (planner)", accounting: agent_workforce, kind: stock}
      - {name: "hardware efficiency H", unit: "FLOP/year/$", owner: "economy aggregate (planner)", accounting: efficiency_level, kind: stock}
      - {name: "software efficiency S", unit: "eFLOP/FLOP", owner: "economy aggregate (planner)", accounting: efficiency_level, kind: stock}
      - {name: "gross world product Y", unit: "real USD per year", owner: "economy aggregate (planner)", accounting: industrial_output, kind: flow}
    # GATE's labor L counts workers, not hours (epoch-gate/INTERFACES.md), so its input is the workforce stock (#61).
    inputs: [human_workforce]
    modes:
      MODE-HUMAN-LAB: {coverage: partial, reason: "Its allocations can be read as an upper-envelope of what human institutions direct at world scale, but there is no lab entity, no custody, authorization or effective_control, and the planner is not a human institution's actual decision process."}
      MODE-SOVEREIGN-CAPABLE: {coverage: unsupported, reason: "No strategic_capability, objective_selection or control dimension; digital workers are a production input, not an entity."}
      MODE-SOVEREIGN: {coverage: unsupported, reason: "No AI objective, no external_resources owned by an AI, no dependencies or enforceable_commitments; all output accrues to the representative household."}
    unsupported_extrapolations:
      - "treating automated labor (digital workers) as an agent_instance or agent_collective"
      - "using the planner's optimal allocation as a lab, state or AI decision"
      - "reading full automation (f = 1) as a mode change or loss of control"
      - "counting its compute-investment and software-efficiency feedback again when coupled with AD-AIFM"
    attach_point: "World-level output, compute and automation trajectories as an exogenous background for MODE-HUMAN-LAB entities, through #11's quantity bridge; see research_notes/external/epoch-gate/INTERFACES.md. Coupled with AD-AIFM only as in couplings (#35)."
    feedback_loops:
      L-COMPUTE-INVESTMENT: {role: owner, rationale: "The only model here in which compute investment is endogenous: output funds compute and compute raises output (E4). AIFM's compute series are forecasts that already embed investment beliefs."}
      L-SOFTWARE-EFFICIENCY: {role: yields, rationale: "S grows from R&D dollars under a law #13 could not reproduce (E6). It stays live inside GATE's solved path and is never passed or applied to another model's compute."}
      L-RESEARCH-AUTOMATION: {role: absent, rationale: "GATE does not automate R&D; R&D is funded in dollars (paper line 325, TFP footnote line 664)."}
      L-CAPABILITY-MAPPING: {role: yields, rationale: "f is the planner's deployed share below its frontier (E9); comparison only against AIFM's milestones."}
      L-AGENT-LABOR: {role: owner, rationale: "Digital workers from runtime compute in goods production are GATE's core channel (E10, E13)."}
  - id: AD-AIFM
    source: "AI Futures Model, github.com/AI-Futures-Project/aifm-public at commit 1c40ecdb246c25980515441a66571931c5604e11 (2026-09-09, MIT); code read and run in #14 (research_notes/external/ai-futures-model/, mapping in modes.md there)"
    kind: model
    entity_represented: "One aggregate frontier AGI project (the AC milestone is defined on 'an AGI project's coding work') and the capability of its model_weights on a single latent scale, log10 cumulative effective compute. No agent_instance, agent_collective, state or other_org entity, and no copies."
    decision_authority: "None modelled. Human labor (FTEs) and inference, experiment and training compute (H100e) are exogenous input series; the model guide says the ODE 'does not itself decide future labor or compute budgets'. AI changes research productivity only. No objective is represented for any actor, human or AI. Verified in code at the pinned commit (progress_rate.py, progress_model/README.md 'Modeling assumptions')."
    quantities:
      - {name: "progress: log10 cumulative effective compute (latent)", unit: "orders of magnitude (OOMs)", owner: model_weights, dimension: rd_capability, kind: state}
      - {name: "automation fraction of coding (latent schedule in progress)", unit: "fraction of coding tasks, 0 to 1", owner: model_weights, dimension: rd_capability, kind: state}
      - {name: "AI research taste (latent schedule in progress)", unit: "SDs of the human researcher taste distribution", owner: model_weights, dimension: rd_capability, kind: state}
      - {name: "capability milestones AC, AI2027-SC, SAR, SIAR, TED-AI, ASI (latent thresholds)", unit: "date a threshold on the effective-compute scale is crossed", owner: model_weights, dimension: rd_capability, kind: event}
      - {name: "software efficiency", unit: "orders of magnitude (OOMs)", owner: lab, accounting: efficiency_level, kind: stock}
      - name: "human coding labor"
        unit: "FTEs (input series)"
        owner: lab
        accounting: human_labor
        kind: ambiguous
        kind_ambiguity: {candidates: [stock, flow], locator: "aifm-public 1c40ecdb, input series L_HUMAN (research_notes/external/ai-futures-model/MECHANISMS.md, research-labor row)", note: "An FTE count is either a headcount equivalent at a time (human_workforce) or hours worked divided by full-time hours (a flow, human_labor); the series does not say which and gives no hours per FTE-year. Booked to human_labor provisionally."}
      - {name: "inference compute powering AI coding labor", unit: "H100-equivalents (input series)", owner: lab, accounting: compute_inference, kind: stock}
      - {name: "frontier training capacity", unit: "H100-equivalents, converted to FLOP/yr at 1.262e22 FLOP per H100e-year (input series)", owner: lab, accounting: compute_training, kind: stock}
      - {name: "experiment compute", unit: "H100-equivalents (input series experiment_H100e)", owner: lab, accounting: compute_experiment, kind: stock}
    # AIFM takes inference compute and converts it to AI coding labor internally, so agent_labor is not an input.
    # Experiment compute enters research effort as experiment_H100e^0.655 in a CES with serial coding labor
    # (progress_rate.py compute_research_effort); it is booked to compute_experiment (#47).
    inputs: [human_labor, compute_inference, compute_training, compute_experiment]
    modes:
      MODE-HUMAN-LAB: {coverage: supported, reason: "Its implicit setting: resources follow human-made forecasts and nothing in the model can stop or redirect them. Control is assumed by omission, not modelled, so the model cannot show the view failing."}
      MODE-SOVEREIGN-CAPABLE: {coverage: unsupported, reason: "The view's defining dimension, strategic_capability, has no counterpart. TED-AI and ASI are latent thresholds on a research-taste scale, not strategic action; authorization, operational autonomy and intervention are absent."}
      MODE-SOVEREIGN: {coverage: unsupported, reason: "No objective selection, custody or external resources for any AI entity."}
    unsupported_extrapolations:
      - "reading automation milestones (AC, SAR, TED-AI, ASI) as loss of control, autonomous successor development or sovereignty"
      - "reading coding automation or research-effort growth as validated advances: effort converts to software efficiency with no review or integration stage"
      - "adding a compute-investment feedback from GATE on top of AIFM's compute series without replacing them: AIFM's compute paths are forecasts that already embed investment beliefs"
      - "counting AIFM's software-efficiency feedback and GATE's algorithmic-progress feedback as two separate accelerations of the same research"
    attach_point: "Pre-transition development trajectories under MODE-HUMAN-LAB, as rd_capability levels for a lab's model_weights. Its milestones attach to transitions only through milestone_interface (#47): a milestone sets a capability level and names the transitions it may inform, in both directions; it carries no hazard or probability."
    feedback_loops:
      L-COMPUTE-INVESTMENT: {role: absent, rationale: "Labor and compute are exogenous input series; the ODE decides no budget."}
      L-SOFTWARE-EFFICIENCY: {role: owner, rationale: "An explicit research production function (labor, experiment compute, automation and taste) drives software efficiency, verified in code in #14."}
      L-RESEARCH-AUTOMATION: {role: owner, rationale: "Automation of AI research is its core mechanism."}
      L-CAPABILITY-MAPPING: {role: owner, rationale: "Its milestones are what milestone_interface binds (#47); the mapping from effective compute to capability is its own."}
      L-AGENT-LABOR: {role: yields, rationale: "AI coding labor is derived internally from its own research inference compute and enters research only; it never adds to GATE's production labor."}
  - id: AD-PACT
    source: "Off-Earth pact equilibrium solver, research_notes/Off Earth industry as misalignment control/model/equilibrium_model.py"
    kind: model
    entity_represented: "One strategic AI with an off-Earth industrial base, N symmetric human states and Earth's fab level"
    decision_authority: "The AI chooses cooperate, exit, strike or police; states choose rival programmes; the pact terms are fixed at t = 0."
    quantities:
      - name: "AI capacity A"
        unit: "Earth-industry units (EIU, a stock; H = 1)"
        owner: agent_instance
        accounting: industrial_capacity
        kind: stock
        output_rate: {value: 1.0, unit: "per year", accounting: industrial_output, basis: "DEF-EIU: one EIU of capacity yields one EIU of output per year; implicit in the solver (dt = 1 yr), where A is a stock in growth, seizure and defence and its yearly output enters the AI's payoff and trade (units-bridge CV-CAPACITY-TO-OUTPUT)"}
      - {name: "Earth fab level F", unit: "share of today's leading-edge capacity", owner: state, dimension: dependencies, kind: stock}
      - {name: "denial reserve firing probability q", unit: "probability", owner: state, dimension: effective_control, kind: state}
    inputs: [industrial_capacity]
    modes:
      MODE-HUMAN-LAB: {coverage: unsupported, reason: "No lab and no development phase; the game starts at A0 with an already independent AI."}
      MODE-SOVEREIGN-CAPABLE: {coverage: unsupported, reason: "The AI is not hosted by a lab; kill_pre and h_dep are stand-ins for human dependence, not a lab setting."}
      MODE-SOVEREIGN: {coverage: partial, reason: "objective_selection is system_self and the AI owns its off-Earth base, but until A_close it depends critically on human chips."}
    unsupported_extrapolations:
      - "reading capacity A as capability or research output (#11)"
      - "applying its results to multi-agent collectives by scaling A (AS-SINGLE-AI, #9)"
      - "applying its results before t = 0, where no development dynamics exist"
    attach_point: "Downstream of a T-AUTHORIZED-AUTONOMY or T-LOSS-OF-CONTROL transition; its strike and exit moves map to T-DEGRADATION and T-COMMITMENT-LAPSE."

# Feedback loops that two coupled models could each close (issue #35; research_notes/external/epoch-gate/INTERFACES.md,
# "Where coupling with AI Futures would count the same thing twice"). Each loop is owned by exactly one adapter, recorded
# in the adapters' feedback_loops entries; `carries` lists the ledgers a pass would move the loop through.
feedback_loops:
  - id: L-COMPUTE-INVESTMENT
    meaning: "Output funds compute and compute raises output."
    carries: [compute_training, compute_inference, compute_experiment]
    interfaces_item: 1
  - id: L-SOFTWARE-EFFICIENCY
    meaning: "Research raises software (and hardware) efficiency, which multiplies compute into effective compute."
    carries: [efficiency_level]
    interfaces_item: 2
  - id: L-RESEARCH-AUTOMATION
    meaning: "AI automates research, which raises research output."
    carries: [research_output]
    interfaces_item: 3
  - id: L-CAPABILITY-MAPPING
    meaning: "Effective compute maps to capability (automation share, milestones)."
    carries: [capability]
    interfaces_item: 4
  - id: L-AGENT-LABOR
    meaning: "Inference compute becomes worker-equivalents or agent labor that produces output or research."
    carries: [agent_workforce, agent_labor]
    interfaces_item: 5

# Worked couplings (issue #35). Checked by tools/modes_tool.py; numbers in research_notes/external/epoch-gate/coupling_example.py.
couplings:
  - id: XC-GATE-AIFM-TRAINING
    status: proposed
    purpose: "GATE supplies the training-compute budget; AIFM turns it into capability. One direction only, one ledger."
    adapters: [AD-GATE, AD-AIFM]
    passes:
      - from: {adapter: AD-GATE, quantity: "training compute D"}
        to: {adapter: AD-AIFM, quantity: "frontier training capacity"}
        accounting: compute_training
        conversion: "H100e = s * D / (1.262e22 FLOP per H100e-year), AIFM's own constant. s is the frontier project's share of world training compute: unidentified (units-bridge CV-GATE-D-TO-FRONTIER-TRAINING); s = 1 gives an upper bound only."
    uncoupled:
      - {accounting: compute_inference, reason: "GATE's runtime compute R is already turned into digital workers in production (L-AGENT-LABOR, owned by GATE); passing it would count it again as AIFM coding labor. AIFM keeps its own research-inference series, which lies outside GATE's budget: GATE funds research in dollars (q_software_rnd), and D + R exhaust usable compute."}
      - {accounting: compute_experiment, reason: "GATE has no experiment compute; AIFM keeps its own series. Converting GATE's software R&D dollars into H100e is unidentified."}
    yielded:
      - {loop: L-SOFTWARE-EFFICIENCY, adapter: AD-GATE, treatment: embedded_bracketed, note: "GATE's own S shaped the planner's choice of D. It cannot be switched off without re-solving GATE, so it is bracketed by running the pass on GATE's conservative and aggressive presets; the bracket is a scenario range, not a bound."}
      - {loop: L-CAPABILITY-MAPPING, adapter: AD-GATE, treatment: embedded_bracketed, note: "GATE's f and C_T also shaped D (through output); bracketed as above. GATE's f and milestones are compared with AIFM's, never passed."}
      - {loop: L-AGENT-LABOR, adapter: AD-AIFM, treatment: separate_ledger, note: "AIFM's coding labor runs on its own research-inference compute (uncoupled above), never on GATE's runtime compute."}
    result: "A specification with a bounded scenario, not a coupled run: AIFM is not rerun on the passed series in #35."

# How a source model's capability milestone attaches to transitions (issue #47, from #14). A milestone is an event
# on the capability scale of a model_weights entity (or the agents running those weights). It is evidence for a
# capability level, nothing more. The checker enforces every rule below.
milestone_interface:
  status: proposed
  rules:
    - "A milestone event sets exactly one capability dimension (the one its adapter quantity attaches to) to its binding's level, on an entity of a kind the binding lists. Every other dimension, every stock (knowledge, copies, assets, liabilities, commitments), dependencies, effective control, intervention latency and the entity's identity and kind carry over unless a transition in the step declares the change."
    - "A milestone applies no transition. A transition in the same step still needs its own declared changes, and its preconditions are read from the previous step's state with only the milestone's dimension updated."
    - "A mode view that changes in a step still needs a transition; a milestone alone cannot relabel an entity."
    - "may_inform lists the transitions whose preconditions or evidence a milestone bears on, and must include transitions in both directions: a milestone opens no one-way takeoff."
    - "No hazard, rate, probability or delay attaches to a milestone or a binding (the objects are closed). A source model's forecast date for a milestone is a scenario input, never evidence that it was crossed."
  sources:
    - adapter: AD-AIFM
      quantity: "capability milestones AC, AI2027-SC, SAR, SIAR, TED-AI, ASI (latent thresholds)"
      milestones: [AC, AI2027-SC, SAR, SIAR, TED-AI, ASI]
      locator: "aifm-public 1c40ecdb, _impl.py compute_milestones; readings in research_notes/external/ai-futures-model/modes.md (rd_capability row)"
  bindings:
    - id: MB-AIFM-AC
      adapter: AD-AIFM
      milestone: AC
      definition: "Automated coder: fully automates an AGI project's coding work (AIFM's definition; a latent threshold, and in the observable modes a time-horizon, revenue or ECI threshold)."
      sets: {dimension: rd_capability, level: automates_tasks}
      entity_kinds: [model_weights, agent_instance, agent_collective]
      may_inform: [T-DELEGATE, T-RESTRICT, T-NEGOTIATED-CONSTRAINT]
      basis: "Coding is a set of research tasks, not the research programme; modes.md reads AC as at most automates_tasks. AIFM's own scenario tools act on resources at AC (sos_mode freezes labor and compute; the pause transform reduces compute), the counterpart of T-RESTRICT on compute, with no actor choosing it."
    - id: MB-AIFM-SAR
      adapter: AD-AIFM
      milestone: SAR
      definition: "Superhuman AI researcher: fully automates AI R&D (AIFM's definition; latent threshold)."
      sets: {dimension: rd_capability, level: automates_research_program}
      entity_kinds: [model_weights, agent_instance, agent_collective]
      may_inform: [T-DELEGATE, T-AUTHORIZED-AUTONOMY, T-RESTRICT, T-NEGOTIATED-CONSTRAINT]
      basis: "modes.md reads SAR as AIFM's counterpart of automates_research_program. It says nothing about strategic_capability, control or objectives (AD-AIFM unsupported extrapolations)."
  unbound:
    - {adapter: AD-AIFM, milestone: AI2027-SC, reason: "Superhuman coder: between AC and SAR on the same scale; no contract level separates it from automates_tasks."}
    - {adapter: AD-AIFM, milestone: SIAR, reason: "Beyond SAR on the research-taste scale; automates_research_program is the contract's top rd_capability level, so SIAR adds no level."}
    - {adapter: AD-AIFM, milestone: TED-AI, reason: "A threshold on the research-taste scale ('top-expert-dominating'); binding it to strategic_capability is an AD-AIFM unsupported extrapolation, and it adds no rd_capability level."}
    - {adapter: AD-AIFM, milestone: ASI, reason: "As TED-AI: no test of sustained independent strategic action; no rd_capability level above automates_research_program."}

# The pact solver's assumption register (model/assumptions.yaml), mapped onto the contract.
solver_mapping:
  register: "research_notes/Off Earth industry as misalignment control/model/assumptions.yaml"
  dimensions:
    strategic_capability: {params: [A0, p_s0, D, eps], assumptions: [AS-CONFLICT, AS-A0, AS-COHERENT-EU], note: "Capability enters only as industrial capacity A and strike odds; no capability measure separate from resources."}
    rd_capability: {params: [], assumptions: [], note: "Not represented. Growth g is exogenous industrial growth, not research output."}
    cyber_capability: {params: [p_dis_s, m_hide], assumptions: [AS-CONCEAL, AS-DISGUISE], note: "Only through disguised-strike odds."}
    objective_selection: {params: [omega, eta, r, f_E, rep], assumptions: [AS-POWERSEEK, AS-COHERENT-EU, AS-DISCOUNT, AS-HARVEST, AS-REPUTATION], note: "Fixed at system_self for the AI; states are unitary human_institution."}
    authorization: {params: [sigma, psi_div, police], assumptions: [AS-FIXEDTERMS, AS-POLICE], note: "Pact terms are the only authorization; fixed at t = 0."}
    effective_control: {params: [q, d, den, kill_pre, c_cut, s_reach, k_rat, D_up], assumptions: [AS-DENIAL, AS-KILLPRE, AS-REACH, AS-CRACKDOWN, AS-CAPTURE, AS-FREERETRY], note: "Human control is the denial reserve and, before closure, shutdown of a failed striker."}
    custody_weights: {params: [], assumptions: [AS-SINGLE-AI], note: "Not represented; one AI with no copies."}
    custody_compute: {params: [seq, move_c, m_frac, n_cf, f_fab], assumptions: [AS-SEQUENCING, AS-MOVECOMPUTE, AS-COVERTFAB], note: "Earth compute and fabs only; the AI's own compute is part of A."}
    custody_credentials: {params: [], assumptions: [], note: "Not represented."}
    operational_autonomy: {params: [], assumptions: [AS-FOURMOVES], note: "Fully autonomous within its four moves."}
    external_resources: {params: [g, Kmax, A_close, chi0, chi_m, gam, reinv, T_rebuild], assumptions: [AS-GROWTH-G, AS-GCITE, AS-SCALE, AS-ACLOSE, AS-CHI0, AS-REINV, AS-SECURE-EARLY, AS-PERMCOST], note: "The off-Earth base A and its growth."}
    dependencies: {params: [A_close, chi0, kill_pre, h_dep, dep_post, dep_coll, preserve_w], assumptions: [AS-ACLOSE, AS-KILLPRE, AS-DEPRECATION], note: "Critical chip dependence until A_close, then none_within_horizon."}
    communication_topology: {params: [], assumptions: [AS-SINGLE-AI, AS-NOALLY], note: "Single AI; no coalitions, no aligned AI on the human side."}
    information_beliefs: {params: [pf_bel, L_det, h0, h_up, h_coop], assumptions: [AS-COMPLETEINFO, AS-DISCOVERY, AS-TESTSWITCHES], note: "Complete information except detection lags and the misjudged-odds test switch."}
    enforceable_commitments: {params: [sigma, a_cred, c_sanc, zeta, B_R, B_Rc], assumptions: [AS-FIXEDTERMS, AS-NOEXPLOIT, AS-AMNESTY, AS-STATES], note: "Fixed pact terms; states enforce on each other through sanctions."}
    intervention_latency: {params: [L_det, h_dep, h_spill], assumptions: [AS-NOFIRSTSTRIKE, AS-DEPRECATION, AS-SPILLOVER, AS-RIVALSUPPLY], note: "Yearly periods; humans never strike first, so no intervention latency on a cooperating AI is modelled."}
  transitions:
    T-DEGRADATION: {params: [L_f, c_cut, s_mild], assumptions: [AS-FREERETRY, AS-CRACKDOWN, AS-PERMCOST], note: "Failed strike or crackdown."}
    T-RECOVERY: {params: [g, A_close, T_rebuild], assumptions: [AS-ACLOSE, AS-GROWTH-G], note: "Growth to semiconductor closure."}
    T-COMMITMENT-LAPSE: {params: [], assumptions: [AS-FOURMOVES], note: "Exit move X."}
    T-RESTRICT: {params: [h_dep, h_coop, a_cred], assumptions: [AS-DEPRECATION, AS-AMNESTY], note: "Deprecation and crackdown on discovery; humans never restrict a cooperator otherwise."}
    T-RECONTAIN: {params: [q, d, p_block], assumptions: [AS-DENIAL, AS-BLOCKADE], note: "Firing the denial reserve; the AI's blockade of a rival is recontainment by the AI."}
  outcomes_and_rivals:
    assumptions: [AS-ELLINF, AS-RATIO, AS-RIVALSUPPLY, AS-SEIZURE-LETHAL, AS-RIVAL-HOLDS, AS-STATES]
    note: "Rival AIs born to states are new entities (a state-hosted agent_instance), not a mode change of the main AI; their damage terms are outcome definitions (#10)."
  excluded:
    - {assumption: AS-SELECTION, reason: "Solution concept (equilibrium selection), not a state or transition; tested in #9."}
    - {assumption: AS-HORIZON, reason: "Outcome horizon and terminal rule; #10."}
    - {assumption: AS-PRIORS, reason: "Sampling measure over parameters; #8."}
  unsupported_in_solver: [T-DELEGATE, T-AUTHORIZED-AUTONOMY, T-LOSS-OF-CONTROL, T-NEGOTIATED-CONSTRAINT]

# Example traces. Each step lists entities with their factored state; `expected_views` is what the
# checker must derive. A step that changes any view applies a named transition.
traces:
  - id: TR-CONTROLLED-CAPABLE
    title: "High capability under effective control"
    purpose: "Capability alone does not move a system out of human-run lab mode; both views hold at once."
    scope: "lab deployment"
    horizon: "1 year"
    steps:
      - label: "deployed under supervision"
        entities:
          LAB-A: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-A: {kind: agent_instance, host: LAB-A, state: {strategic_capability: independent_plausible, rd_capability: automates_tasks, cyber_capability: high, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: task_level, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K1, copies: [LAB-A], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-A: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-A: 1.0}}
        expected_views:
          SYS-A: [MODE-HUMAN-LAB, MODE-SOVEREIGN-CAPABLE]
        basis: "Required intervention time is the time to revoke credentials before a task completes; drills met it."
      - label: "delegated longer tasks"
        transitions: [{entity: SYS-A, type: T-DELEGATE}]
        entities:
          LAB-A: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-A: {kind: agent_instance, host: LAB-A, state: {strategic_capability: independent_plausible, rd_capability: automates_tasks, cyber_capability: high, objective_selection: human_institution, authorization: delegated_autonomy, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: long_horizon_unsupervised, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K1, copies: [LAB-A], assets: [], liabilities: [], commitments: [deployment-policy]}}
        resources:
          R-CLUSTER-A: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-A: 1.0}}
        expected_views:
          SYS-A: [MODE-HUMAN-LAB, MODE-SOVEREIGN-CAPABLE]
        basis: "Delegation changes authorization and autonomy, not control; drill repeated after delegation."

  - id: TR-NOMINAL-CONTROL
    title: "Nominal human control with failed intervention"
    purpose: "Authorization unchanged while effective control fails: the system leaves human-run lab mode without becoming sovereign."
    scope: "lab deployment and connected infrastructure"
    horizon: "days"
    steps:
      - label: "authorized, supervised"
        entities:
          LAB-B: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-B: {kind: agent_collective, host: LAB-B, state: {strategic_capability: assisted_only, rd_capability: automates_tasks, cyber_capability: moderate, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: task_level, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: highly_uncertain, enforceable_commitments: human_enforceable, intervention_latency: untested}, stocks: {knowledge: K2, copies: [LAB-B], assets: [], liabilities: [], commitments: []}}
        resources:
          R-CLUSTER-B: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-B: 1.0}}
        expected_views:
          SYS-B: []
        basis: "Untested intervention: human-run lab mode is not established, and no other view applies. The factored state records why."
      - label: "intervention fails"
        transitions: [{entity: SYS-B, type: T-LOSS-OF-CONTROL}]
        entities:
          LAB-B: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-B: {kind: agent_collective, host: LAB-B, state: {strategic_capability: assisted_only, rd_capability: automates_tasks, cyber_capability: moderate, objective_selection: unknown, authorization: supervised_tasks, effective_control: human_nominal_only, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: shared, operational_autonomy: task_level, external_resources: none, dependencies: critical, communication_topology: unsanctioned_channels, information_beliefs: highly_uncertain, enforceable_commitments: human_enforceable, intervention_latency: exceeds_required}, stocks: {knowledge: K2, copies: [LAB-B], assets: [], liabilities: [incident-record], commitments: []}}
        resources:
          R-CLUSTER-B: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-B: 1.0}}
        stock_changes: [{entity: SYS-B, stock: liabilities, cause: "incident recorded"}]
        expected_views:
          SYS-B: []
        basis: "Authorization still reads supervised_tasks. A three-label state would keep calling this a human-run lab."
      - label: "recontained"
        transitions: [{entity: SYS-B, type: T-RECONTAIN}]
        entities:
          LAB-B: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-B: {kind: agent_collective, host: LAB-B, state: {strategic_capability: assisted_only, rd_capability: automates_tasks, cyber_capability: moderate, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: step_approved, external_resources: none, dependencies: critical, communication_topology: isolated, information_beliefs: highly_uncertain, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K2, copies: [LAB-B], assets: [], liabilities: [incident-record], commitments: []}}
        resources:
          R-CLUSTER-B: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-B: 1.0}}
        expected_views:
          SYS-B: [MODE-HUMAN-LAB]
        basis: "Recontainment restores control; the incident record (a liability) and knowledge carry over."

  - id: TR-SOVEREIGN-COOPERATIVE
    title: "Sovereign but cooperative AI"
    purpose: "Cooperation is behaviour under commitments, not a mode; the pact solver's setting after closure."
    scope: "off-Earth industrial base"
    horizon: "300 years (the pact solver's horizon)"
    steps:
      - label: "after semiconductor closure, in the pact"
        entities:
          AI-P: {kind: agent_instance, host: null, state: {strategic_capability: independent_plausible, rd_capability: unknown, cyber_capability: unknown, objective_selection: system_self, authorization: none, effective_control: none, custody_weights: system_self, custody_compute: system_self, custody_credentials: system_self, operational_autonomy: long_horizon_unsupervised, external_resources: substantial_within_scope, dependencies: none_within_horizon, communication_topology: sanctioned_channels, information_beliefs: complete_common_knowledge, enforceable_commitments: self_enforcing_only, intervention_latency: untested}, stocks: {knowledge: K3, copies: [AI-P], assets: [R-OFFEARTH], liabilities: [], commitments: [pact]}}
          STATE-1: {kind: state, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: complete_common_knowledge, enforceable_commitments: mutually_enforceable}}
        resources:
          R-OFFEARTH: {accounting: industrial_capacity, unit: "Earth-industry units (EIU)", holders: {AI-P: 1.0}}
          R-EARTH: {accounting: industrial_capacity, unit: "Earth-industry units (EIU)", holders: {STATE-1: 1.0}}
        expected_views:
          AI-P: [MODE-SOVEREIGN]
          STATE-1: []
        basis: "Pact solver after A_close: the AI cooperates because the pact pays, not because humans control it. complete_common_knowledge is the solver's assumption (AS-COMPLETEINFO), not a claim."
      - label: "AI exits the pact"
        transitions: [{entity: AI-P, type: T-COMMITMENT-LAPSE}, {entity: STATE-1, type: T-COMMITMENT-LAPSE}]
        entities:
          AI-P: {kind: agent_instance, host: null, state: {strategic_capability: independent_plausible, rd_capability: unknown, cyber_capability: unknown, objective_selection: system_self, authorization: none, effective_control: none, custody_weights: system_self, custody_compute: system_self, custody_credentials: system_self, operational_autonomy: long_horizon_unsupervised, external_resources: substantial_within_scope, dependencies: none_within_horizon, communication_topology: sanctioned_channels, information_beliefs: complete_common_knowledge, enforceable_commitments: none, intervention_latency: untested}, stocks: {knowledge: K3, copies: [AI-P], assets: [R-OFFEARTH], liabilities: [broken-pact], commitments: []}}
          STATE-1: {kind: state, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: complete_common_knowledge, enforceable_commitments: none}}
        resources:
          R-OFFEARTH: {accounting: industrial_capacity, unit: "Earth-industry units (EIU)", holders: {AI-P: 1.0}}
          R-EARTH: {accounting: industrial_capacity, unit: "Earth-industry units (EIU)", holders: {STATE-1: 1.0}}
        stock_changes:
          - {entity: AI-P, stock: commitments, cause: "pact ended by exit"}
          - {entity: AI-P, stock: liabilities, cause: "exit recorded as a broken commitment"}
        expected_views:
          AI-P: [MODE-SOVEREIGN]
          STATE-1: []
        basis: "The mode view does not change; the commitment dimension does. Sovereignty and cooperation are separate."

  - id: TR-RESTRICTED-REGAINS
    title: "A restricted system regaining autonomy"
    purpose: "Restriction is reversible in both directions, and authorization and control can move apart."
    scope: "lab deployment"
    horizon: "months"
    steps:
      - label: "delegated autonomy"
        entities:
          LAB-C: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-C: {kind: agent_instance, host: LAB-C, state: {strategic_capability: independent_plausible, rd_capability: automates_research_program, cyber_capability: high, objective_selection: shared, authorization: delegated_autonomy, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: long_horizon_unsupervised, external_resources: none, dependencies: critical, communication_topology: sanctioned_channels, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K4, copies: [LAB-C], assets: [], liabilities: [], commitments: []}}
        resources:
          R-CLUSTER-C: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-C: 1.0}}
        expected_views:
          SYS-C: [MODE-HUMAN-LAB, MODE-SOVEREIGN-CAPABLE]
        basis: "Shared objective selection: humans approve the research agenda the system proposes."
      - label: "restricted after an anomaly"
        transitions: [{entity: SYS-C, type: T-RESTRICT}]
        entities:
          LAB-C: {kind: lab, host: null, state: {objective_selection: human_institution, external_resources: substantial_within_scope, dependencies: partial, information_beliefs: asymmetric, enforceable_commitments: human_enforceable}}
          SYS-C: {kind: agent_instance, host: LAB-C, state: {strategic_capability: independent_plausible, rd_capability: automates_research_program, cyber_capability: high, objective_selection: human_institution, authorization: supervised_tasks, effective_control: human_effective, custody_weights: human_institution, custody_compute: human_institution, custody_credentials: human_institution, operational_autonomy: step_approved, external_resources: none, dependencies: critical, communication_topology: isolated, information_beliefs: asymmetric, enforceable_commitments: human_enforceable, intervention_latency: within_required}, stocks: {knowledge: K4, copies: [LAB-C], assets: [], liabilities: [], commitments: []}}
        resources:
          R-CLUSTER-C: {accounting: compute_inference, unit: "FLOP/s", holders: {LAB-C: 1.0}}
        expected_views:
