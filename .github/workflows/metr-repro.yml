# Reproduces METR's Time Horizon 1.1 analysis from the pinned public data (issue #12): fetches
# eval-analysis-public at 52cb829 and METR's published result files, checks their sha256, re-fits every
# agent with the independent numpy implementation (with 1000 bootstrap replicates), runs METR's own code
# with the upstream dependency versions, and compares both with the published numbers.
# Needs network (github.com, metr.org) and about 20 minutes. Run by hand.
# Never commits: outputs are uploaded as an artifact for a person to review.
# Actions are pinned by full commit SHA (tag in the trailing comment).
name: metr-repro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHON_VERSION: "3.12.7"
  METR_CACHE: ${{ github.workspace }}/metr-cache

jobs:
  reproduce:
    name: reproduce METR TH1.1 and compare with published values
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research_notes/external/metr-time-horizons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Fetch pinned sources and verify sha256
        run: bash fetch_sources.sh
      - name: Independent implementation (pinned CI packages plus pyyaml)
        run: |
          python -m venv "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/pip" install -r "$GITHUB_WORKSPACE/.github/requirements-ci.txt" pyyaml==6.0.3
          "$RUNNER_TEMP/ci/bin/python" build_observations.py --cache "$METR_CACHE" --out "$RUNNER_TEMP/out/observations.csv"
          cmp "$RUNNER_TEMP/out/observations.csv" data/observations.csv && echo "observations.csv rebuilt identically"
      - name: METR's own code (versions from upstream uv.lock)
        run: |
          python -m venv "$RUNNER_TEMP/up"
          "$RUNNER_TEMP/up/bin/pip" install numpy==2.4.1 scikit-learn==1.8.0 pandas==2.3.3 joblib==1.5.3 scipy==1.18.1 pyyaml==6.0.3
          "$RUNNER_TEMP/up/bin/python" run_upstream.py --cache "$METR_CACHE" --n-bootstrap 1000 --out "$RUNNER_TEMP/out/upstream_th11.json"
      - name: Compare with published values (tolerances in reproduce.py)
        run: |
          "$RUNNER_TEMP/ci/bin/python" reproduce.py --cache "$METR_CACHE" --bootstrap 1000 \
            --upstream "$RUNNER_TEMP/out/upstream_th11.json" --outdir "$RUNNER_TEMP/out"
          # Pass/fail flags must match exactly; numbers within 1e-9 relative (CPU rounding moves
          # the last digits, run 40221870656), so a real change still fails.
          python - "$RUNNER_TEMP/out/reproduction.json" results/reproduction.json <<'PY'
          import json, math, sys
          new, ref = (json.load(open(f)) for f in sys.argv[1:3])
          def walk(a, b, path):
              if isinstance(b, dict):
                  assert isinstance(a, dict) and a.keys() == b.keys(), f"{path}: keys differ"
                  for k in b: walk(a[k], b[k], f"{path}.{k}")
              elif isinstance(b, bool) or not isinstance(b, (int, float)):
                  assert a == b, f"{path}: {a!r} != {b!r}"
              else:
                  assert math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-12), f"{path}: {a!r} vs {b!r}"
          assert new["th11_points_ok"] is True and new["th11_points_ok"] == ref["th11_points_ok"]
          walk(new["doubling_times"], ref["doubling_times"], "doubling_times")
          print("headline comparison matches the committed results/reproduction.json within 1e-9 relative")
          PY
      - name: Fast checks
        run: '"$RUNNER_TEMP/ci/bin/python" test_metr_time_horizons.py'
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metr-repro
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/out/
