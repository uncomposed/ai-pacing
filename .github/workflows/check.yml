# Validates every pull request and every push to main. No secrets; read-only token.
# Actions are pinned by full commit SHA (tag in the trailing comment).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHON_VERSION: "3.12.7"

jobs:
  make-check:
    name: "software: make check (spec, renderings, systems model, model unit tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Rendering tests resolve historical commits, so a shallow clone fails.
          fetch-depth: 0
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: make check

  # Model gates, one evidence category per command (model_gates.py; HANDOFF.md section 8c). The categories are
  # reported separately; none of them is empirical validation.
  model-check:
    name: "model: numerical checks and software regression"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "research_notes/Off Earth industry as misalignment control/model"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r "$GITHUB_WORKSPACE/.github/requirements-ci.txt"
      - run: echo "RD_WORKERS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: "numerics: identities and closed forms against CHECK_TOL and invariants (robust_design.py --check)"
        run: python model_gates.py numerics
      - name: "software: unit tests, cache provenance, drift against committed outputs, cache re-solve"
        if: always()
        run: python model_gates.py software
      - name: "empirical validation: not established (reported, never pass)"
        if: always()
        run: python model_gates.py empirical
      - name: Status by category
        if: always()
        run: python model_gates.py report
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-check
          retention-days: 14
          if-no-files-found: warn
          path: |
            research_notes/Off Earth industry as misalignment control/model/results/robust_design_checks.*
            research_notes/Off Earth industry as misalignment control/model/repro_*.json
            research_notes/Off Earth industry as misalignment control/model/gate_status/

  model-replication:
    name: "model: external-model replication (Saklakov, Clark)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "research_notes/Off Earth industry as misalignment control/model"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r "$GITHUB_WORKSPACE/.github/requirements-ci.txt"
      - run: echo "RD_WORKERS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: "replication: pinned Saklakov and Clark checks, then a deliberately broken dock that must fail"
        run: python model_gates.py replication
      - name: Status by category
        if: always()
        run: python model_gates.py report
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-replication
          retention-days: 14
          if-no-files-found: warn
          path: research_notes/Off Earth industry as misalignment control/model/gate_status/
