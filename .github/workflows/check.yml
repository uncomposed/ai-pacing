# Validates every pull request and every push to main. No secrets; read-only token.
# Actions are pinned by full commit SHA (tag in the trailing comment).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHON_VERSION: "3.12.7"

jobs:
  make-check:
    name: make check (spec, renderings, systems model)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: make check

  model-check:
    name: equilibrium model checks against committed outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "research_notes/Off Earth industry as misalignment control/model"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r "$GITHUB_WORKSPACE/.github/requirements-ci.txt"
      - run: echo "RD_WORKERS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: robust_design.py --check (round-1 regression S1/S7/S14/S16, identities, closed form)
        run: python robust_design.py --check
      - name: Compare --check output with the committed reference
        run: python ci_sims.py compare-checks
      - name: Re-solve a cached ensemble (r0.1 box, base design) and compare with the laptop cache
        run: python ci_sims.py repro --args "--stage oat_r --designs '[{}]'" --manifest repro_r0.1_base.json
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-check
          retention-days: 14
          if-no-files-found: warn
          path: |
            research_notes/Off Earth industry as misalignment control/model/results/robust_design_checks.*
            research_notes/Off Earth industry as misalignment control/model/repro_*.json
