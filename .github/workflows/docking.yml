# Slow suite: every docking script in model/docking/ (results/docking.md), on GitHub's free runners.
# Started by hand (Actions tab > docking > Run workflow) or weekly. The fast, pinned replication gate for Saklakov and
# Clark runs on every pull request in check.yml (job model-replication); this workflow runs the full scripts
# (Saklakov about 9 minutes, Potapov about 12) and reports drift against the committed docking/out/*.json.
# Categories: saklakov and clark are replications and fail the job if a switch point leaves its closed form or the
# solver disagrees with the ledger's sign. powell, potapov and metzger are comparisons, not replications: they fail
# only if the script errors, and their output is reported, never judged as a replication.
# Nothing is committed. No secrets; read-only token; actions pinned by full commit SHA (tag in the trailing comment).
name: docking

on:
  workflow_dispatch:
  schedule:
    # Tuesdays 05:41 UTC
    - cron: "41 5 * * 2"

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHON_VERSION: "3.12.7"
  OMP_NUM_THREADS: "1"

jobs:
  dock:
    name: "${{ matrix.category }}: ${{ matrix.dock }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dock: saklakov, category: replication}
          - {dock: clark, category: replication}
          - {dock: powell, category: comparison}
          - {dock: potapov, category: comparison}
          - {dock: metzger, category: comparison}
    defaults:
      run:
        working-directory: "research_notes/Off Earth industry as misalignment control/model"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r "$GITHUB_WORKSPACE/.github/requirements-ci.txt"
      - name: Run docking/${{ matrix.dock }}.py
        run: python -u "docking/${{ matrix.dock }}.py" | tee "docking/out/${{ matrix.dock }}.ci.log"
      - name: Drift against the committed docking/out/${{ matrix.dock }}.json (reported, not judged)
        if: always()
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          from ci_sims import _json_diff, summary
          dock = "${{ matrix.dock }}"
          rel = f"docking/out/{dock}.json"
          ref = subprocess.run(["git", "show", f"HEAD:./{rel}"], capture_output=True, text=True).stdout
          here = json.load(open(rel))
          ref = json.loads(ref)
          for k in ("runtime_s",):
              ref.pop(k, None); here.pop(k, None)
          diffs = _json_diff(ref, here)
          summary(f"### {dock} ({'${{ matrix.category }}'}): drift against the committed output\n\n"
                  + ("No differences." if not diffs else "\n".join(f"- {d}" for d in diffs[:60])))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dock-${{ matrix.dock }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            research_notes/Off Earth industry as misalignment control/model/docking/out/${{ matrix.dock }}.*
            research_notes/Off Earth industry as misalignment control/model/figures/dock_*.png
