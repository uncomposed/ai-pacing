# Reserved-ID registry for AI Pacing proposition IDs (K, D, H, I, Q).
#
# One list of every proposition ID that is used or reserved anywhere in the
# repository or its proposal issues, so a new YAML node cannot silently reuse an
# ID that already means something else. `ruby tools/spec_tool.rb check` (and so
# `make check`) enforces it:
#   - every node in spec/ai-pacing.yaml has an entry here with a `yaml`
#     definition whose kind, title, and status (accepted or proposed) match;
#   - every heading ID in the editorial reference is registered with its title;
#   - an ID with more than one definition declares how they relate, only the
#     IDs in LEGACY_COLLISION_IDS may be `legacy`, a `reserved-conflict` ID
#     cannot appear in the YAML, and a proposed YAML node cannot collide;
#   - `next_free` is above every registered ID and every local-namespace ID.
# `ruby tools/spec_tool.rb next-id H` prints the next free ID for a kind.
#
# Allocating a new ID: take `next_free`, add an entry, and bump `next_free`.
# Reserving an ID for a research note or issue: add an entry with that source
# and status `reserved`. Renaming an ID used in an issue: add a `renumbering` row.
#
# Collision values:
#   none               one definition.
#   same-proposition   the YAML and the editorial reference state the same
#                      proposition in different words (a judgment recorded when
#                      the registry was created; the editor may revise it).
#   legacy             the YAML and the editorial reference give the ID different
#                      meanings. This is the known conformance gap described in
#                      CANONICALITY.md and docs/clean-room-reconstruction.md; it
#                      is recorded, not resolved, here.
#   reserved-conflict  a reserved candidate shares an ID with a different
#                      definition. It must be renumbered before it lands in YAML.

schema_version: 1
created: "2026-10-25"

sources:
  yaml:
    locator: spec/ai-pacing.yaml
    authority: normative
  editorial:
    locator: AI_Pacing_Canonical_Spec_v0.1.md
    authority: editorial reference
  off_earth_report:
    locator: research_notes/Off Earth industry as misalignment control/repo_review.md
    authority: research proposal (section Q6, candidate YAML nodes)
    note: >-
      docs/off-earth-pact.md section 8 cites these candidates as "D7, D8, H7 to
      H11, I8 to I10, Q6 to Q8" and says they need rework before landing.
  issue_1:
    locator: https://github.com/uncomposed/ai-pacing/issues/1
    authority: proposal
  issue_3:
    locator: https://github.com/uncomposed/ai-pacing/issues/3
    authority: proposal

# Files that number their own items with a local namespace. These are not
# proposition IDs. Each uses a prefix so its IDs cannot be mistaken for K, D, H,
# I or Q nodes (issue #23), and the prefixed IDs do not constrain `next_free`.
# `tools/assumptions_tool.py check` enforces the AR- prefix on register claims.
local_namespaces:
  - locator: research_notes/Off Earth industry as misalignment control/model/assumptions.yaml
    field: claims[].id
    prefix: AR-
    meaning: model-result claims checked by the assumption register (formerly H1 to H13)
    ids: [AR-H1, AR-H2, AR-H3, AR-H4, AR-H5, AR-H6, AR-H7, AR-H8, AR-H9, AR-H10, AR-H11, AR-H12, AR-H13]
  - locator: research_notes/Off Earth industry as misalignment control/model/results/equilibrium.md
    field: section 7 question numbers
    prefix: EQ-
    meaning: open questions about the equilibrium model (formerly cited as question 1 to 10)
    ids: [EQ-Q1, EQ-Q2, EQ-Q3, EQ-Q4, EQ-Q5, EQ-Q6, EQ-Q7, EQ-Q8, EQ-Q9, EQ-Q10]

next_free:
  K: K8
  D: D22
  H: H15
  I: I12
  Q: Q17

# IDs proposed in issues or notes under a different number.
renumbering:
  - {source: issue_1, old: H6, new: H14, reason: "H6 is editorial H6; H10 and H11 are taken; H12 and H13 overlap the model's claim IDs."}
  - {source: issue_1, old: Q5, new: Q13, reason: "Q5 is editorial Q5; Q11 and Q12 are taken by issue 3."}
  - {source: issue_3, old: H7, new: H10, reason: "Renumbered in the issue on 2026-10-21."}
  - {source: issue_3, old: D7, new: D18, reason: "Renumbered in the issue on 2026-10-21."}
  - {source: issue_3, old: I8, new: I11, reason: "Renumbered in the issue on 2026-10-21."}
  - {source: issue_3, old: Q6, new: Q11, reason: "Renumbered in the issue on 2026-10-21."}
  - {source: issue_3, old: D8, new: D19, reason: "Renumbered in the addendum comment on 2026-10-21."}
  - {source: issue_3, old: Q7, new: Q12, reason: "Renumbered in the addendum comment on 2026-10-21."}
  - {source: off_earth_report, old: H10, new: H11, reason: "The report's optional H10 collides with issue 3's H10; H11 is inside the range docs/off-earth-pact.md already cites."}
  - {source: off_earth_report, old: D7, new: D20, reason: "D7 is an editorial ID (warning-shot ladder); the report's candidate is reserved as D20 (issue #23)."}
  - {source: off_earth_report, old: D8, new: D21, reason: "D8 is an editorial ID (dry-tinder learning); the report's candidate is reserved as D21 (issue #23)."}
  - {source: off_earth_report, old: Q6, new: Q14, reason: "Q6 is an editorial ID (industrial vetoes); the report's candidate is reserved as Q14 (issue #23)."}
  - {source: off_earth_report, old: Q7, new: Q15, reason: "Q7 is an editorial ID (covert software); the report's candidate is reserved as Q15 (issue #23)."}
  - {source: off_earth_report, old: Q8, new: Q16, reason: "Q8 is an editorial ID (domestic coalition); the report's candidate is reserved as Q16 (issue #23)."}

