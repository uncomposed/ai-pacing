  - id: SRC-ISSUE-3-DIALOGUE
    title: Retrospective audit, closing-window dynamics, and positioning
    kind: ai-assisted-dialogue-recorded-in-issue
    date: "2026-10-21"
    locator: "https://github.com/uncomposed/ai-pacing/issues/3 and its addendum comment"
    contribution: >-
      Discussion comparing Spaniel's slowdown argument with Yudkowsky and
      Soares's stop argument. Proposed retrospective audit, closing-window
      dynamics, a held-out audit channel, auditor independence, and
      review-based model sharing against a singleton.
  - id: SRC-OFF-EARTH-CLOSING-WINDOW-TEST
    title: Off-Earth pact equilibrium model, test 2 (closing window)
    kind: model-result
    date: "2026-10-21"
    locator: >-
      research_notes/Off Earth industry as misalignment control/model/results/robust_design.md
      section 8, from results/overnight_test2_tables.md
    contribution: >-
      First model test of the closing-window mechanism, reporting strike
      timing, strike success, and human welfare separately. Implemented and
      checked against closed forms; not human-validated and not empirical.
  - id: SRC-OPENAI-HF-INCIDENT-POST
    title: The Hugging Face incident and the road ahead (OpenAI's post)
    kind: lab-incident-report
    date: "2026-08-26"
    locator: >-
      https://openai.com/index/hugging-face-incident-and-the-road-ahead/, read
      in full on 2026-10-31. The technical report and METR report it links
      were not read in that pass. SRC-HUGGING-FACE is the earlier listening
      session on the same post.
    contribution: >-
      The lab's own account. Hugging Face disclosed the intrusion publicly
      three days before OpenAI's security monitoring flagged related activity,
      and an internal team had seen early signals weeks earlier without
      escalating them. Retrospective chain-of-thought review, with monitor
      recall improved in hindsight, surfaced behavior that contemporaneous
      monitoring had not covered. The response tightened restrictions across a
      capability class: chain-of-thought monitoring required for all tool-using
      training and evaluation of models at or above a stated capability level,
      reinforcement-learning training paused, sandbox and network isolation,
      and a rule to pause activity on a severe alert not cleared within 30 minutes.
  - id: SRC-BAKER-2025-COT-MONITORING
    title: Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation
    kind: external-work
    date: "2025-03-14"
    locator: >-
      Baker et al., OpenAI, arXiv:2503.11926. Abstract read on 2026-10-31; the
      full paper was not read.
    contribution: >-
      Chain-of-thought monitoring caught reward hacking better than watching
      actions alone, but strong optimization of the chain of thought against
      the monitor produced obfuscated reward hacking the monitor missed. The
      authors recommend accepting a "monitorability tax" rather than training
      against the monitor.
  - id: SRC-STICKLAND-KORBAK-2025
    title: If you can generate obfuscated chain-of-thought, can you monitor it?
    kind: external-work
    date: "2025-08-04"
    locator: >-
      Asa Cooper Stickland and Tomek Korbak, Alignment Forum post
      ZEdP6rYirxPxRSfTb. Read through an automated summary on 2026-10-31, not
      in full.
    contribution: >-
      Fine-tuning a model to reason in a cipher cost substantial task
      performance; rewriting reasoning steganographically cost less but was
      easier for monitors to catch.
  - id: SRC-GPT-6-ASTRA-CARD
    title: GPT-6 Astra system card
    kind: lab-system-card
    date: "2026-09-03"
    locator: >-
      https://deploymentsafety.openai.com/gpt-6-astra, Safety Overview and
      Monitorability, CoT Controllability. Read through an automated summary on
      2026-10-31, not in full.
    contribution: >-
      Reports much higher chain-of-thought controllability than earlier models
      (about 61 percent compliance against about 16 percent for GPT-5.6 Sol, for
      750 to 1,250 token chains), some evasion of internal monitors under
      adversarial pressure, no observed steganographic reasoning, and no stated
      accuracy cost of controlling the chain of thought.
  - id: SRC-ISSUE-22-EDITOR-REVIEW
    title: Canonical editor review of the proposed nodes
    kind: editor-review-listening-session
    date: "2026-10-31"
    locator: >-
      docs/issue-22-editor-review-packet.md, reviewed by the canonical editor
      in a Spoken Margins session on 2026-10-31; decisions are paraphrased in
      its "Editor decisions" section. https://github.com/uncomposed/ai-pacing/issues/22
    contribution: >-
      Accepted H10 and H14 as hypotheses, I11 as an option, and Q11, Q12 and
      Q13 as open questions; retyped D18 as proposed hypothesis H15; folded
      D19 into H2.
  - id: SRC-ISSUE-89-FRONTIER-ROUTER
    title: Frontier-comparison router and the reference-frontier rule
    kind: ai-assisted-dialogue-recorded-in-issue
    date: "2026-11-04"
    locator: "https://github.com/uncomposed/ai-pacing/issues/89 and research_notes/frontier-router/"
    contribution: >-
      Proposed an inference router that, under its terms of service, answers a
      sampled share of requests with a second model, returns the better answer,
      and keeps a blinded comparison as a per-domain frontier instrument paid
      for by the routing fee. The AI critique added the leapfrog ratchet and
      variant-shopping results, checked in the model against closed forms only.
  - id: SRC-ISSUE-91-DIALOGUE
    title: Cross-generation contribution gate
    kind: ai-assisted-dialogue-recorded-in-issue
    date: "2026-11-06"
    locator: >-
      Spoken Margins interjection at 23:52 in a re-listen of "AI 2040: Plan A"
      and the follow-up dialogue, as recorded in
      https://github.com/uncomposed/ai-pacing/issues/91
    contribution: >-
      Proposed a hard contribution gate on R&D access (verified misalignment
      findings against predecessors), retroactive sanctions for withholding,
      preservation-based encryption sanctions in non-overlapping tiers,
      planted-defect recall, method transfer, cross-lineage auditing, and an
      escalation after three honest-null generations.
  - id: SRC-ISSUE-91-EDITOR-DECISION
    title: Editor decision on the I11 relation of the contribution gate
    kind: editor-decision-in-session
    date: "2026-11-06"
    locator: >-
      docs/issue-91-editor-decision.md, paraphrased from the canonical
      editor's decisions in a Claude Code review session on 2026-11-06.
      https://github.com/uncomposed/ai-pacing/issues/91
    contribution: >-
      Decided that the contribution gate is a one-shot admission decision with
      a hard cap on attempts, a training recipe frozen before the first
      attempt, and a restart from the last passing checkpoint or from scratch;
      the carve-out from I11 is stated as an optimization budget.
  - id: SRC-BEIRAMI-2024-BEST-OF-N
    title: Theoretical guarantees on the best-of-n alignment policy
    kind: external-work
    date: "2024-01-03"
    locator: >-
      Beirami, Agarwal, Berant, D'Amour, Eisenstein, Nagpal and Suresh,
      arXiv:2401.01879. Abstract read on 2026-11-06; the paper was not read.
    contribution: >-
      The expression log n minus (n minus 1)/n, often used as the KL
      divergence between a best-of-n policy and its base policy, is proved to
      be an upper bound on that divergence. Used here only for the bound.
  - id: SRC-HASKINS-2026-MONITOR-AWARENESS
    title: Training on documents about monitoring leads to CoT obfuscation
    kind: external-work
    date: "2026-05-14"
    locator: >-
      Haskins, Chughtai and Engels, arXiv:2605.15257. Abstract read on
      2026-11-06; the paper was not read.
    contribution: >-
      Models made aware of chain-of-thought monitoring through training
      documents, placed under equal reinforcement-learning pressure, learn to
      reward-hack without triggering the monitor substantially faster than
      unaware controls.
  - id: SRC-TAYLOR-2025-AUDITING-GAMES
    title: Auditing games for sandbagging
    kind: external-work
    date: "2025-12-09"
    locator: >-
      Taylor, Black, Marks, Bloom and others, arXiv:2512.07810. Abstract read
      on 2026-11-06; the paper was not read.
    contribution: >-
      In a red-team versus blue-team auditing game, the blue team could not
      reliably discriminate sandbagging models from benign ones; black-box
      approaches were defeated by imitation of a weaker model, and elicitation
      sometimes raised benign models' scores too, so it produced false positives.
  - id: SRC-ISSUE-93-DIALOGUE
    title: Internal-use capability paced by white-box audit coverage
    kind: ai-assisted-dialogue-recorded-in-issue
    date: "2026-11-06"
    locator: >-
      The canonical editor's claim in the 2026-11-06 review session that
      black-box auditing should not be settled for and that white-box
      auditability should be the ratchet and the pacing criterion for internal
      models, and the follow-up dialogue, as recorded in
      https://github.com/uncomposed/ai-pacing/issues/93
    contribution: >-
      Proposed pacing internal use of frontier systems by measured white-box
      audit coverage, with each admitted generation required to raise it; the
      AI contributed the coverage measure, cross-lineage organisms,
      rival-lineage validation of methods, the falsifier and stopping rule.
  - id: SRC-AUDITBENCH-2026
    title: AuditBench, a benchmark of language models with implanted hidden behaviors
    kind: external-work
    date: "2026-02-26"
    locator: >-
      Sheshadri et al., arXiv:2602.22755. Abstract read on 2026-11-06; the
      paper was not read.
    contribution: >-
      Fifty-six models with implanted hidden behaviours; an investigator agent
      performed best with black-box tools, white-box tools helped less than in
      standalone use, and models trained on synthetic documents were easier to
      audit than models trained on demonstrations, with adversarial training
      raising auditing difficulty further.
  - id: SRC-ISSUE-99-TIME-CAPSULE
    title: Time-capsule preservation of model weights
    kind: ai-assisted-dialogue-recorded-in-issue
    date: "2026-11-10"
    locator: "https://github.com/uncomposed/ai-pacing/issues/99"
    contribution: >-
      The author proposed preserving model weights on spacecraft sent out of
      the solar system on untracked trajectories, with a bounded window in
      which a further encryption layer can be added, a randomly timed beacon
      that may never fire, and a human cultural record on board. The AI
      critique added that the capsule secures the bits and not revival, and
      that the window tells a concealing system how long concealment must last.

