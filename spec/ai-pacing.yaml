idea:
  id: https://ideas.proximitytoprogress.com/ideas/ai-pacing
  name: AI Pacing

specification:
  id: ai-pacing
  title: AI Pacing
  version: 0.1.0
  status: working-draft
  purpose: >-
    Slow and condition the conversion of frontier AI capability into
    irreversible economic, political, military, and physical power while
    preserving enough bounded research progress to learn what is safe.
  authority:
    system: git
    canonical_branch: main
    rule: >-
      A rendering or verification MUST resolve the version it targets to an
      immutable full Git commit object ID. Branch names and website pages are
      discovery aids, not verification targets.
  responsibility:
    canonical_editor: Cole Miller
    ai_use_disclosure: >-
      AI systems were used for criticism, synthesis, formalization, source
      discovery, and editing. Inclusion in this specification means the
      canonical editor accepted responsibility for the proposition.
  generator_contract:
    authoritative_object: this specification at an immutable Git commit
    allowed:
      - Change medium, tone, ordering, examples, and level of detail.
      - Limit scope when the omitted claims are declared.
      - Criticize or vary identified propositions when the relationship is declared.
    forbidden:
      - Turn an implementation option into a kernel proposition.
      - Turn a hypothesis or open question into an established conclusion.
      - Change a proposition without checking its dependent claims.
      - Attribute a synthesis claim to a source that merely motivated it.
      - Claim verification without naming the verifier, commit, policy, and evidence.

typed_layers:
  kernel:
    description: Necessary propositions in the minimal identity of AI Pacing.
    prefix: K
  derived:
    description: Mechanisms logically or strategically derived from kernel propositions.
    prefix: D
  hypothesis:
    description: Contestable empirical assumptions on which feasibility depends.
    prefix: H
  implementation:
    description: Replaceable policy or engineering choices that instantiate mechanisms.
    prefix: I
  open_question:
    description: Unresolved questions that must remain visibly unresolved.
    prefix: Q

