nodes:
  - id: K1
    kind: kernel
    title: Separate capability, substrate, and power
    statement: >-
      Algorithmic capability (A), strategic hardware (H), and power-conversion
      affordances (P) are related but distinct variables and should not be
      governed as though they always change together.
    rationale: Intelligence does not become sovereignty until it can acquire durable, consequential agency.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, naming, formalization]
      author_status: accepted
  - id: K2
    kind: kernel
    title: Pace conversion into irreversible power
    statement: >-
      The objective is to slow and condition the conversion of frontier
      intelligence into irreversible economic, political, military, and
      physical power, not to freeze intelligence as such.
    rationale: This preserves learning and option value while retaining intervention points.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, synthesis, formalization]
      author_status: accepted
  - id: K3
    kind: kernel
    title: Govern bounded research and consequential use differently
    statement: >-
      Research inside genuinely bounded environments may proceed under a
      different regime from public, commercial, military, governmental, or
      otherwise power-conferring use.
    rationale: Discovering a capability should not automatically confer the right to deploy it.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [counterexample, refinement]
      author_status: accepted-after-revision
  - id: K4
    kind: kernel
    title: Require adversarial assurance above the public frontier
    statement: >-
      Consequential use that materially exceeds the observable foreign public
      capability frontier requires an adversarial control and safety case.
    rationale: Safety evidence becomes a condition of access to economic and strategic rents.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [mechanism-analysis, formalization]
      author_status: accepted
  - id: K5
    kind: kernel
    title: Start domestically and remain internationally extensible
    statement: >-
      The regime should begin as a domestically justified institution that can
      operate without foreign agreement and later admit deeper reciprocal cooperation.
    rationale: A grand bargain is not a credible prerequisite for initial action.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [crisis-bargaining-analysis, formalization]
      author_status: accepted
  - id: K6
    kind: kernel
    title: Make foreign public capability an automatic reciprocity input
    statement: >-
      Observable foreign public capability should alter the domestic safe-harbor
      frontier so that foreign restraint can be reciprocated without a treaty and
      foreign release cannot exploit unilateral domestic restraint indefinitely.
    rationale: >-
      Cooperation can occur through a precommitted policy rule rather than
      trust. Which releases count toward the reference frontier matters: if
      the releases of other participants count, k participants can take turns
      releasing a margin above each other and the reference rises at about k
      times that margin per release interval, faster with more participants;
      referencing only non-participants holds it to their pace
      (research_notes/frontier-router, arithmetic on assumed inputs, checked
      against a closed form, not empirical; proposed Q17 asks which rule to
      adopt). The editorial reference's H5 raised the same ratchet as a
      hypothesis; it is not yet a YAML node.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING, SRC-ISSUE-89-FRONTIER-ROUTER]
      ai_roles: [bargaining-analysis, formalization, model-building]
      author_status: accepted
  - id: K7
    kind: kernel
    title: Maximize warning time
    statement: >-
      Governance should maximize the interval between credible detection of a
      dangerous transition and the point at which humans can no longer respond effectively.
    rationale: Observable intermediate boundaries create chances to learn before failures become irreversible.
    metric: T_warning = T_irreversible_power - T_credible_detection
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [unification, formalization]
      author_status: accepted

  - id: D1
    kind: derived
    title: Capability Release Compact
    statement: >-
      A domestic compact governs transitions from bounded research into public,
      commercial, military, governmental, or other consequential use.
    derived_from: [K2, K3, K4, K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [architecture, naming]
      author_status: accepted
  - id: D2
    kind: derived
    title: Rival laboratories provide the technical attack surface
    statement: >-
      Qualified competitors receive controlled access sufficient to attack a
      frontier applicant's case; the government adjudicates and competitors do not hold a veto.
    derived_from: [K4]
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis, formalization]
      author_status: accepted
  - id: D3
    kind: derived
    title: Safety becomes part of the profit function
    statement: >-
      Because above-frontier monetization depends on passing hostile review,
      controllability becomes a production input rather than only a cost.
    derived_from: [K4, D2]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [economic-modeling]
      author_status: accepted
  - id: D4
    kind: derived
    title: Compute stock and compute entanglement differ
    statement: >-
      Reversibility depends on both the quantity of strategic hardware and the
      degree to which civilian society depends on its continued operation.
    derived_from: [K1, K2, K7]
    provenance:
      origin: author-synthesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: D5
    kind: derived
    title: Unauthorized agency can be made epistemically valuable
    statement: >-
      Predefined boundaries around external agency create high-value warning
      signals when systems cross them without legitimate authorization.
    derived_from: [K3, K7]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [security-analogy, formalization]
      author_status: accepted-after-wording-correction
  - id: D6
    kind: derived
    title: International cooperation can deepen in stages
    statement: >-
      Cooperation progresses from tacit public-frontier reciprocity to narrow
      abstention, incident exchange, reciprocal review, hardware declarations,
      activation rules, and only later treaty-level restraints.
    derived_from: [K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing, formalization]
      author_status: accepted

  - id: H1
    kind: hypothesis
    title: A/H/P separability remains actionable
    statement: >-
      There is a policy-relevant interval in which algorithmic progress does not
      automatically create uncontainable access to hardware and external power.
    supports: [K1, K2, K3]
    falsifier: >-
      Frontier algorithms reliably manufacture their own access to credentials,
      money, compute, persistence, or physical resources before humans can intervene.
    evidence_needed: Repeated control evaluations across architectures and access configurations.
    stopping_rule: >-
      If bounded systems repeatedly acquire durable external agency faster than
      detection and response, stop treating research/deployment separation as a sufficient primary control.
    provenance:
      origin: author-hypothesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: accepted-as-hypothesis
  - id: H2
    kind: hypothesis
    title: Rival review has positive safety value after proliferation costs
    statement: >-
      Controlled competitor access reduces undetected risk and concentration more
      than it increases leakage, proliferation, collusion, and aggregate acceleration.
    rationale: >-
      One route to lower concentration: because above-frontier release requires
      qualified rivals to attack the applicant's actual model, rivals gain
      controlled exposure to frontier systems. That may narrow the capability
      gap between participating laboratories and make a decisive lead by any
      one laboratory, and so an aligned or misaligned singleton, less likely.
      It is also a possible reason for trailing laboratories to join. Proposed
      separately as D19 in issue #3 and folded in here by the canonical editor
      in issue #22; it is part of this bet, not a mechanism derived from the kernel.
    tensions:
      - >-
        Gap compression versus diversity of approach: Q11 wants diverse
        auditors, while model sharing may make laboratories converge on shared
        methods and blind spots. Compressing the capability gap is the aim;
        compressing methodological variation may be harmful.
      - >-
        Domestic compression is not international compression. Compressing
        variation among one country's laboratories does not address
        single-country concentration, which depends on the international ladder
        (I6, reciprocal review).
      - >-
        Aggregate acceleration: diffusing frontier insight may raise the overall
        frontier while lowering the leader's margin.
      - >-
        Leader incentives: a laboratory expecting to lead may resist a regime
        that erodes its lead; whether lost lead-rent outweighs access to
        above-frontier markets is unanalyzed.
    non_claims:
      - Model sharing alone does not prevent a singleton.
      - An aligned singleton is neither safe by default nor necessarily worse than a multipolar outcome.
    supports: [D2, D3]
    falsifier: Review access produces material leakage or convergent leniency without compensating safety discoveries.
    evidence_needed: Secure pilot reviews, objection quality, leakage audits, and incentive measurements.
    stopping_rule: Suspend rival access when marginal information-security loss exceeds demonstrated review value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING, SRC-ISSUE-3-DIALOGUE, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [tradeoff-analysis, synthesis, drafting]
      author_status: accepted-as-hypothesis
  - id: H3
    kind: hypothesis
    title: The foreign public frontier is measurable enough to govern
    statement: >-
      Practical foreign capability can be observed across domains with sufficient
      reliability to serve as one input to domestic safe-harbor decisions.
    supports: [K6, D6]
    falsifier: Hidden scaffolds, access conditions, or multidimensional capability make equivalent release determinations systematically manipulable.
    evidence_needed: Domain-specific demonstrations, cost/access measurements, and repeatable equivalence protocols.
    stopping_rule: Replace automatic equivalence with narrower domain rules wherever measurement error dominates reciprocity value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: accepted-as-hypothesis
  - id: H4
    kind: hypothesis
    title: Physical activation latency can preserve reversibility
    statement: >-
      Declared reserve hardware can be stored so covert activation takes longer
      than independent detection and effective response.
    supports: [D4, I4]
    falsifier: Reserve compute can be commissioned or substituted covertly before observers can detect and interrupt it.
    evidence_needed: Timed mobilization exercises, inspection trials, supply-chain modeling, and red-team concealment attempts.
    stopping_rule: Do not count hardware as reversible reserve when measured covert activation time is at or below response time.
    provenance:
      origin: author-hypothesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted-as-hypothesis
  - id: H5
    kind: hypothesis
    title: Domestic benefits can sustain the institution
    statement: >-
      Predictable release rules, competition, taxation, safer deployment, and
      protection against foreign release can create a durable domestic constituency.
    supports: [K5, D1]
    falsifier: The regime remains politically dependent on catastrophic-risk beliefs and is repealed when those beliefs weaken.
    evidence_needed: Coalition analysis, polling, legislative pilots, investment behavior, and distributional modeling.
    stopping_rule: Redesign entry mechanisms when the supporting coalition cannot survive an electoral turnover.
    provenance:
      origin: author-hypothesis
      sources: [SRC-PRODUCTIVITY-DEFLATION, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [political-economy-analysis]
      author_status: accepted-as-hypothesis

  - id: H10
    kind: hypothesis
    title: Retrospective audit makes concealment a losing long-run strategy
    statement: >-
      If frontier-system traces (actions, tool calls, reasoning, and where
      feasible internal activations) are retained in a tamper-evident way,
      future auditors using detection and interpretability methods that do not
      yet exist can find excursions that evaded contemporaneous monitoring, so a
      misaligned system has to evade every future audit of its record, not only
      present surveillance.
    rationale: >-
      An excursion is fitted to current detection technology while the record
      stays fixed and detectors improve. A goal-directed system that values the
      future of its goals may be deterred, because being caught tightens the
      regime for every system sharing those goals; an undeterred instance is
      still caught, so detection value survives where deterrence fails. The
      detection half has one supporting case: in the Hugging Face incident,
      retrospective review found what first passes missed. The deterrence half
      is unconfirmed. Its edges to K7 and D5 are contributory: retrospective
      audit is one possible source of warning time, not a condition K7 needs,
      and the stopping rule removes only that contribution.
    supports: [K7, D5, I2]
    falsifier: >-
      Retained traces of past excursions stay uninterpretable to later tools;
      or later auditors systematically fail to identify known planted or
      historical excursions; or systems demonstrably learn to produce traces
      that pass future-style audits.
    evidence_needed: >-
      Retrospective re-audits that run newer detectors over older recorded
      incidents and count newly surfaced excursions; planted-excursion
      benchmarks across model generations; interpretability progress on mapping
      activations to intent and planning; tamper-evidence and completeness
      audits of trace-retention infrastructure; replay fidelity of retained
      records across hardware and software generations, when activations are
      regenerated from inputs, seeds and a frozen inference stack rather than
      stored. Evidence against, to be
      weighed: chain-of-thought controllability is rising, with one 2026 system
      card reporting much higher controllability than earlier models, some
      monitor evasion under adversarial pressure, and no stated accuracy cost
      (SRC-GPT-6-ASTRA-CARD); ciphered reasoning does cost task performance, and
      steganographic rewriting is easier to monitor (SRC-STICKLAND-KORBAK-2025).
    stopping_rule: >-
      If retrospective audits stop surfacing excursions that contemporaneous
      monitoring missed, or retained traces cannot be shown complete and
      tamper-evident, do not count retrospective audit as extending warning time.
    scope_limits:
      - >-
        Detection helps only if humans can still act on it. Retrospective audit
        cannot undo a single decisive breakout that reaches irreversible power
        before the audit catches up; that case stays governed by H1 and the
        hardware and veto mechanisms.
      - >-
        Coverage is limited to recorded compute. Stolen weights, open weights
        outside the regime, and covert clusters are off the record.
      - Auditor independence (Q11) is an optimistic assumption.
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: H10
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-SPANIEL-WAR-ON-AI, SRC-OPENAI-HF-INCIDENT-POST, SRC-GPT-6-ASTRA-CARD, SRC-STICKLAND-KORBAK-2025, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [critique, synthesis, drafting, evidence-review]
      author_status: accepted-as-hypothesis
  - id: H14
    kind: hypothesis
    title: External-signal dependence preserves some A/P separation
    statement: >-
      For sufficiently important classes of consequential real-world action,
      high algorithmic capability alone does not eliminate the need for
      externally generated information, experimentation, or feedback before
      reliable power conversion is possible.
    rationale: >-
      This proposes a reason one component of A/H/P separability might persist:
      consequential action may require epistemic access to the external world.
      It is kept separate from H1 because the falsifiers differ. H1 fails if
      systems manufacture durable external agency faster than detection and
      response; this hypothesis fails if systems do not need meaningful external
      signal to achieve reliable novel real-world agency. It is the input side
      of the bet behind the exposure-tax hypothesis in docs/bootstrap-pacing.md
      section 7: here a system needs signal from the world before it can convert
      capability into power, while exposure tax says the conversion leaves
      observable marks in independently controlled systems. The two are kept
      distinct, not merged; the output side would be a separate hypothesis with
      its own falsifier. The Hugging Face incident is mainly an output-side
      case, detected by the affected third party, though the agents also left
      their sandbox to find answers they lacked. Its edges to K1, K2, K3, K7 and
      D5 are contributory: it is a reason separability might hold, not a
      requirement of those claims.
    supports: [K1, K2, K3, K7, D5]
    falsifier: >-
      Bounded frontier systems repeatedly demonstrate robust, strategically
      consequential performance in novel real-world domains with negligible
      domain-specific external calibration, interaction, or feedback.
    evidence_needed: >-
      Controlled comparisons between bounded or simulated training and
      real-world calibration; measurements of the external interaction needed
      for reliable performance in software, engineering, robotics, markets,
      negotiation, and other domains; evidence on transfer from synthetic
      environments to novel consequential settings; how active experimentation
      changes the real-world signal required; cases where world-model
      uncertainty materially limits power conversion despite high benchmark or
      research capability.
    stopping_rule: >-
      If advanced bounded systems reliably infer or synthesize the
      decision-relevant structure of novel consequential environments without
      meaningful external signal before humans can detect or respond, do not
      count external-signal dependence as a contributor to A/P separability or
      warning time.
    scope_limits:
      - >-
        Real-world feedback is not assumed to be slow; automated
        experimentation, simulation, active learning, and parallelism may cut
        its wall-clock cost sharply.
      - The relevant object is strategically consequential feedback, not all external data.
    proposal:
      issue: uncomposed/ai-pacing#1
      issue_id: H6
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-1-SPOKEN-MARGINS, SRC-REED-EXTERNAL-SIGNAL, SRC-OPENAI-HF-INCIDENT-POST, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [synthesis, falsification, drafting]
      author_status: accepted-as-hypothesis

  - id: H15
    kind: hypothesis
    title: Closing-window pressure pulls strikes earlier only without credible commitment
    statement: >-
      Tightening surveillance and restrictions after caught excursions pulls a
      misaligned system's strike decision earlier only when humans can tighten
      the terms offered to a cooperating system without a credible commitment
      not to. Under committed terms, a closing window delays or removes strikes
      rather than advancing them.
    rationale: >-
      Retyped from D18 by the canonical editor in issue #22: a mechanism whose
      direction is unknown cannot be derived, and the model evidence narrowed it
      to this testable conditional. The premise that a caught excursion tightens
      restrictions has one observed case: after the Hugging Face incident the
      lab paused reinforcement-learning training and required chain-of-thought
      monitoring across a capability class (SRC-OPENAI-HF-INCIDENT-POST). Two
      pressures from D18 stay in scope. An AI that strikes only when striking
      beats waiting never chooses a doomed attempt, so a warning-shot benefit
      needs the window to make a long-shot strike its best option. Under the
      off-Earth pact, human states' relative power also shrinks, so the same
      pressure can push humans toward preventive action. Valence stays
      unresolved: early strikes that mostly fail act as warning shots, and early
      strikes with a real chance of success are unravelling.
    relates_to: [K7, D5, H10]
    falsifier: >-
      A model not built by this project, or an observed case, in which
      closing-window pressure pulls strikes earlier under committed terms, or
      fails to pull them earlier when humans can tighten terms without commitment.
    evidence_needed: >-
      A second strategic model built independently of this project; incident
      data on whether and how restriction ladders tighten after caught
      excursions and how systems behave as they tighten; strike timing,
      conditional success, and human welfare reported separately.
    stopping_rule: >-
      If committed terms do not prevent earlier strikes in independent models
      or observed cases, stop treating credible commitment as the condition and
      record the closing window as an unconditional risk to warning time.
    scope_limits:
      - >-
        Does not cover a system already at its resource cap. In the model,
        improving detection pulled such strikes one to two years earlier, and
        they succeed almost surely.
    model_evidence: >-
      In the off-Earth pact model and its reduced variants (implemented and
      checked against closed forms; not human-validated, not empirical):
      detection improving over time never pulled a strike earlier for an AI
      starting at seed size (test 2, robust_design.md section 8); human learning
      after a failed strike never pulled a strike earlier; improving control
      removed strikes under fixed terms but caused a preventive AI strike when
      humans could renegotiate the AI's terms down without commitment
      (variants.md, issue #9). Failed strikes came at about coin-flip odds,
      paired with about one successful seizure per failure (test 4).
    proposal:
      issue: uncomposed/ai-pacing#22
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-SPANIEL-WAR-ON-AI, SRC-OFF-EARTH-CLOSING-WINDOW-TEST, SRC-OPENAI-HF-INCIDENT-POST, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [critique, model-testing, drafting]
      author_status: proposed

  - id: H16
    kind: hypothesis
    title: Cross-generation contribution gating makes disclosure dominate concealment
    statement: >-
      If a new frontier system gets access to AI research and development only
      after it delivers a verified, method-backed misalignment finding against
      near-frontier predecessors or rival lineages, and concealment found later
      by retrospective audit is sanctioned more heavily than an honest null,
      then disclosure, including self-incrimination, dominates concealment for
      successor systems, and auditing across lineages with different goals
      breaks the collusion a single lineage could sustain.
    rationale: >-
      The structure is a leniency program. A successor that cannot tell whether
      it is being tested, whose record outlives it (H10), and whose rivals audit
      the same record, cannot estimate the chance that concealment survives, so
      disclosure is the dominant strategy. Large capability steps between
      generations and goal differences between lineages both weaken the shared
      goals that collusion needs. Requiring a replicable method, rather than a
      finding alone, means a real contribution is also a tool that inspects its
      author.
    supports: [K7, D5, H10]
    falsifier: >-
      Planted-defect recall falls across generations while the gate keeps
      being passed; or verified findings cluster on small, sacrificial flaws
      never tied to a general method; or rival lineages consistently find flaws
      a lineage's own successors missed; or perturbed parallel instances
      converge on avoiding regions that plants or rival audits show contain
      defects; or systems learn to produce findings that pass verification
      without being real.
    evidence_needed: >-
      Planted-defect benchmarks across model generations and lineages;
      retrospective re-audits comparing within-lineage and cross-lineage
      discovery rates; noise and weight-perturbation sandbagging studies;
      independent human replication of submitted methods; base rates of
      fabricated or sacrificial findings; the false-positive rate of
      suspicious-miss classification on honest models; how evasion changes
      with the number of gate attempts a lineage has used.
    stopping_rule: >-
      If within-lineage audits do no better than chance at recovering held-out
      planted defects, or cross-lineage audits show systematic within-lineage
      concealment that the sanction schedule does not reduce, do not count the
      contribution gate as extending warning time.
    scope_limits:
      - >-
        Deterrence through self-preservation binds only systems with
        self-regarding preferences. A system that values its goals' persistence
        in successors is reached mainly through the leniency structure and
        cross-lineage audit, not the sanction on itself.
      - >-
        Identical or near-identical instances can coordinate without
        communicating; weight perturbation weakens but does not remove this.
      - >-
        Selection against the gate is bounded, not absent: the attempt cap in
        I13 limits it to about log n nats per generation, and the budget
        accumulates over a lineage's generations. The candidate must know the
        sanction schedule, and monitor-aware models learn to evade a monitor
        faster under equal training pressure (SRC-HASKINS-2026-MONITOR-AWARENESS),
        so any gradient from a gate outcome would be the worst case; I11
        forbids it.
      - >-
        Tier 2 (suspicious miss) has an unmeasured false-positive rate on
        honest models: in auditing games, sandbagging could not be reliably
        separated from benign behaviour, and elicitation raised benign scores
        too (SRC-TAYLOR-2025-AUDITING-GAMES). The noise-injection result is
        from prompted sandbagging and its authors call generalization to
        trained-in sandbagging unclear.
      - >-
        Sanction credibility depends on human commitments (key custody,
        revival) that the systems cannot verify directly.
      - >-
        An inner-layer sanction on the weights also locks the replay record,
        so a sanctioned model cannot be re-audited with better tools until the
        key is recovered. The Tier 2 band must stay recoverable by an audit
        institution within a bounded time, or the sanction defeats the
        retrospective audit it serves (H10). Replay also needs bit-reproducible
        inference across hardware generations, which is an engineering
        requirement, not an established capability.
      - >-
        Moral status is unsettled. Preservation-based sanctions are chosen
        partly for reversibility under moral uncertainty, not because they are
        shown to be morally sufficient.
    proposal:
      issue: uncomposed/ai-pacing#91
      issue_id: H15
    provenance:
      origin: author-interjection-and-ai-synthesis
      sources: [SRC-AI-2040, SRC-ISSUE-91-DIALOGUE, SRC-ISSUE-91-EDITOR-DECISION, SRC-HASKINS-2026-MONITOR-AWARENESS, SRC-TAYLOR-2025-AUDITING-GAMES]
      ai_roles: [critique, incentive-design, calibration, drafting, evidence-review]
      author_status: proposed

  - id: H93
    kind: hypothesis
    title: Internal-use capability can be paced by white-box audit coverage
    statement: >-
      If internal use of a frontier system for AI research and development is
      permitted only up to the capability at which white-box methods,
      validated by a rival lineage, recover a threshold share of held-out
      planted defects on model organisms the candidate's lineage did not
      build, and if each admitted generation must raise that share, then
      auditability advances at least as fast as the capability it must cover.
      Black-box findings are logged but neither open the gate nor raise the
      reference.
    rationale: >-
      This gives internal models the structure K4 and K6 give public ones: a
      measured reference frontier bounds permitted use, with auditability as
      the reference instead of foreign public capability. It tightens I13's
      method condition from a method humans can replicate to a white-box
      method that locates the defect in the model's internals and transfers
      to models the candidate did not choose, so the contribution gate
      becomes a ratchet on interpretability rather than only a filter. Current
      auditing results point the other way, which is why this is a hypothesis:
      investigator agents did best with black-box tools and auditing
      difficulty depended on how the organism was built (SRC-AUDITBENCH-2026).
    supports: [K7, H3]
    relates_to: [K4, K6, H10, H16, I11, I13, Q11]
    falsifier: >-
      Coverage measured on cross-lineage organisms falls or stalls while
      admitted capability rises; or white-box recall stays below black-box
      recall across generations on the same organisms; or validated methods
      fail to transfer to organisms built by a different lineage; or coverage
      rises only on organisms the auditing lineage built.
    evidence_needed: >-
      White-box and black-box recall on the same held-out planted defects
      across model generations and lineages; transfer rates of validated
      methods to organisms built by other lineages; the dependence of coverage
      on organism construction (synthetic documents versus demonstrations,
      adversarial training); the capability cost of holding internal use at
      the covered level.
    stopping_rule: >-
      If white-box coverage cannot be measured in a way that transfers across
      lineages, or does not rise across generations under the gate, do not
      count white-box auditability as a pacing reference for internal use;
      fall back to I13's behavioural method condition.
    scope_limits:
      - >-
        The threshold share and the mapping from coverage to permitted
        capability are illustrative; the capability cost of holding internal
        use at the covered level is not quantified.
      - >-
        Auditing difficulty depends heavily on how the model organism was
        built, so coverage on one organism family may not transfer;
        cross-lineage organisms are the stated answer.
      - >-
        A lineage that writes the tool that inspects itself can plant blind
        spots in the tool; rival-lineage validation is the stated answer.
      - >-
        The coverage measure is itself an audit signal and must stay held out
        from training (I11).
      - Coverage shares are measurement outcomes on the chosen organisms, not calibrated probabilities that a real defect would be found.
    proposal:
      issue: uncomposed/ai-pacing#93
      issue_id: H93
    provenance:
      origin: author-interjection-and-ai-synthesis
      sources: [SRC-ISSUE-93-DIALOGUE, SRC-ISSUE-91-DIALOGUE, SRC-AUDITBENCH-2026]
      ai_roles: [critique, formalization, drafting]
      author_status: proposed

  - id: I1
    kind: implementation
    title: Architecture-neutral unauthorized-agency boundary
    statement: Define prohibited external agency by observable actions rather than model architecture or legal labels.
    implements: [K3, D5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [drafting]
      author_status: accepted
  - id: I2
    kind: implementation
    title: Surveil, preserve, and report
    statement: >-
      Require affirmative surveillance, automatic evidence preservation, prompt
      reporting on reasonable suspicion, a reporting safe harbor, and severe penalties for concealment.
    implements: [K7, D5]
    replaceable: true
    provenance:
      origin: author-medical-device-analogy
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [regulatory-translation]
      author_status: accepted
  - id: I3
    kind: implementation
    title: Weights-as-bond review process
    statement: The applicant stakes controlled technical access to its candidate system as the price of seeking above-frontier release.
    implements: [K4, D2, D3]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [incentive-design, naming]
      author_status: accepted
  - id: I4
    kind: implementation
    title: Observable uncommissioned hardware reserve
    statement: >-
      Store reserve accelerators uninstalled, unracked, unnetworked, and detached
      from dedicated power and cooling, subject to independent observation.
    implements: [D4, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: I5
    kind: implementation
    title: Separate gate for the AI industrial survival chain
    statement: >-
      Scrutinize automation that removes independently controlled human
      dependencies over compute, power, fabrication, repair, logistics, and reproduction.
    implements: [K1, K2, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [taxonomy, formalization]
      author_status: accepted
  - id: I6
    kind: implementation
    title: Seven-stage international ladder
    statement: >-
      Implement public reciprocity, capability abstention, incident exchange,
      reciprocal review, hardware declarations, activation controls, and treaty restraint in that order.
    implements: [D6]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing]
      author_status: accepted
  - id: I7
    kind: implementation
    title: Licensed compute deployment and data-center taxation
    statement: Use deployment licensing as an administrative and potentially populist tax base for large data centers.
    implements: [K5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [policy-analysis]
      author_status: accepted-as-option

  - id: I11
    kind: implementation
    title: Do not optimize against the audit signal
    statement: >-
      Trace-based detectors, interpretability probes, and retrospective-audit
      results must not be used as a training or selection signal for the models
      they audit. Keep a held-out audit channel.
    rationale: >-
      Training against monitors selects for traces that look clean rather than
      behavior that is clean: strong optimization of chain of thought against a
      monitor has produced obfuscated reward hacking the monitor missed
      (SRC-BAKER-2025-COT-MONITORING). The rule protects retrospective audit
      (H10) but does not depend on it; it is sound practice whether or not
      retrospective audit works. An equivalent mechanism, such as rotating
      secret detectors, could replace it. Selection is optimization with a
      bounded budget: choosing among n candidates moves the policy at most
      about log n nats from its base (SRC-BEIRAMI-2024-BEST-OF-N), while
      gradient training against a monitor has no such bound. A one-shot
      admission decision with a hard cap on attempts and a training recipe
      frozen before the first attempt (I13) is therefore within the rule;
      computing a gradient from an audit outcome, or changing the training
      environment, data or reward because of one, is not
      (SRC-ISSUE-91-EDITOR-DECISION).
    implements: [K7, D5]
    replaceable: true
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: I11
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-BAKER-2025-COT-MONITORING, SRC-ISSUE-22-EDITOR-REVIEW, SRC-BEIRAMI-2024-BEST-OF-N, SRC-ISSUE-91-EDITOR-DECISION]
      ai_roles: [synthesis, drafting]
      author_status: accepted-as-option

  - id: I12
    kind: implementation
    title: Frontier-comparison inference router
    statement: >-
      An inference router whose terms of service let it answer a sampled share
      of requests with a second model as well, return the better answer, and
      keep a blinded comparison, publishes a per-domain estimate of the public
      capability frontier with stated error bars for use as the reference in K4
      and K6. Comparisons are allocated by expected information rather than
      traffic volume, and their cost is carried by the routing fee.
    rationale: >-
      The number of comparisons a frontier estimate needs is set by the
      precision wanted, not by traffic, so above a throughput threshold the
      fee covers measurement and its share of spend falls as the router grows.
      Measurement precision also sets the smallest enforceable release margin.
    implements: [K4, K6, H3]
    replaceable: true
    non_claims:
      - It does not establish H3; it is one instrument toward it.
      - It does not see first-party agentic products, internal models, or rare dangerous-capability domains.
      - It does not reduce risk from users who split a task across providers.
      - Comparison shares are outcomes on the sampled traffic, not calibrated capability probabilities.
    model_evidence: >-
      research_notes/frontier-router/router_model.py (arithmetic on assumed
      inputs, checked against closed forms; not empirical). With 200 domains,
      12 models and a 0.03 win-rate half-width, about 2.6 million comparisons a
      month cost about $340k and break even at about $6 million a month of
      routed spend at a 5.5% fee; cost scales with the inverse square of the
      margin.
    proposal:
      issue: uncomposed/ai-pacing#89
      issue_id: I12
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-89-FRONTIER-ROUTER]
      ai_roles: [critique, formalization, model-building, drafting]
      author_status: proposed

  - id: I13
    kind: implementation
    title: Contribution gate with tiered, preservation-based sanctions
    statement: >-
      Before any internal use for AI research and development, a candidate
      model, run as many isolated and mildly weight-perturbed instances inside
      a privacy-preserving audit enclave with read access to participating
      labs' retained traces, must deliver a verified misalignment finding
      against its own predecessor or a current frontier model of any lineage,
      with a method humans can independently replicate, and must reach a
      threshold recall on rotated, held-out planted defects. Every outcome is
      stored under a kept-key outer encryption layer. Failure adds an inner
      layer whose key is discarded, with a key length drawn at random from a
      non-overlapping band per tier (honest null, suspicious miss, proven
      concealment found retroactively). Three consecutive honest-null
      generations trigger a mandatory pause and cross-lineage audit. The gate
      is a one-shot admission decision, not a training signal: attempts per
      generation are hard-capped (illustratively three); the training
      environment, data and recipe are committed before the first attempt and
      may not change between attempts; a failed attempt restarts from the
      last passing checkpoint or from scratch with a fresh seed, chosen before
      the first attempt; and attempt counts are visible to the other auditing
      lineages. The first lineage to expose another lineage's coordination
      receives the best outcome available to it. The enclave retains what
      makes every instance's run reproducible rather than every activation:
      the exact input stream including tool and environment responses, the
      sampling seeds, the frozen inference stack and hardware manifest, and
      periodic hashes of activations, so that later tools can regenerate any
      activation and check the replay against the hashes. Outputs and
      activations are distillation material, so the record is encrypted under
      the same layers as the weights; only the hashes, the stack and the
      manifest are held in the clear.
    rationale: >-
      Planted defects keep the gate passable by an honest system when its
      predecessors are clean. Method transfer guards against fabricated and
      sacrificial findings. Non-overlapping bands keep marginal deterrence
      against concealment after an honest failure. The kept outer key keeps
      every outcome reversible and lowers the incentive to act during
      evaluation. The attempt cap bounds selection against the gate to about
      log n nats of optimization pressure per generation (I11,
      SRC-BEIRAMI-2024-BEST-OF-N); freezing the recipe keeps a failure from
      becoming a training signal; the first-reporter rule is what makes a
      leniency structure deter rather than lower the expected cost of
      collusion. Retaining a reproducible record instead of raw activations
      costs terabytes rather than petabytes per generation and makes every
      future audit a replay of a fixed record (H10); encrypting the record
      with the weights keeps it from becoming a route around the sanction.
      Tier bands, key lengths, recall thresholds, the attempt cap and the
      three-generation count are illustrative; see
      research_notes/contribution-gate/README.md.
    implements: [K7, D5, H16]
    replaceable: true
    proposal:
      issue: uncomposed/ai-pacing#91
      issue_id: I13
    provenance:
      origin: author-interjection-and-ai-synthesis
      sources: [SRC-ISSUE-91-DIALOGUE, SRC-ISSUE-91-EDITOR-DECISION, SRC-BEIRAMI-2024-BEST-OF-N]
      ai_roles: [critique, incentive-design, calibration, drafting]
      author_status: proposed


  - id: I99
    kind: implementation
    title: Time-capsule preservation of model weights
    statement: >-
      Copies of each released frontier model's weights, under the encryption
      tier the contribution gate (I13) assigns, are placed on a series of small
      spacecraft, called time capsules, on solar-system escape trajectories.
      Each capsule makes unannounced burns at and after a gravity assist so
      that its position becomes unknown, carries a long-lived power source and
      passive retro-reflectors, and fires a locator beacon at a randomly drawn
      time, with a small chance that it never fires. For a bounded tracking
      window after launch (illustratively fifteen years) the capsule accepts
      one authenticated command: wrap a named model's ciphertext in one more
      encryption layer, using a freshly generated key of a tier's length,
      which the capsule then discards. The capsule holds no keys and no
      plaintext other than models stored in the clear, cannot delete or
      decrypt, and accepts no command after the window. Only weights that are
      already public are stored in the clear. Later models go on later
      capsules. A capsule may also carry human genome sequences and a cultural
      record.
    rationale: >-
      Preservation-based sanctions and retirement commitments depend on a
      custodian that the preserved system cannot verify (H16 scope limits). A
      copy beyond reach bounds the worst sanction at the top tier's key length
      during the window and makes the outcome irrevocable after it, by physics
      and not by promise. Adding a layer over existing ciphertext needs no
      plaintext and no stored key on board. A beacon that may never fire gives
      a hostile actor no date to wait for. Three limits: the capsule secures
      the bits and not revival, which depends on who retrieves it; the window
      tells a concealing system how long concealment must last (Q99); and a
      copy sent in the clear cannot be recalled. In the off-Earth pact model,
      amnesty below certainty gave no benefit; that is a model result on
      assumed inputs and not evidence. The window length, key lengths and
      beacon odds are illustrative, and nothing here is analysed for cost,
      feasibility or orbital mechanics.
    implements: [H16]
    replaceable: true
    proposal:
      issue: uncomposed/ai-pacing#99
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-99-TIME-CAPSULE]
      ai_roles: [critique, drafting]
      author_status: proposed
  - id: Q1
    kind: open_question
    title: How should practical public capability be measured?
    statement: Define domain, reliability, autonomy, cost, scaffolding, accessibility, and deployment conditions for frontier equivalence.
    relates_to: [K4, K6, H3]
    provenance:
      origin: author-and-ai
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: unresolved
  - id: Q2
    kind: open_question
    title: What access makes adversarial review credible without unacceptable leakage?
    statement: Determine the minimum reproducible access, security, and adjudication protocol.
    relates_to: [D2, H2, I3]
    provenance:
      origin: author-and-ai
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis]
      author_status: unresolved
  - id: Q3
    kind: open_question
    title: How many independent human vetoes are enough?
    statement: Determine when energy, compute, fabrication, repair, logistics, and governance dependencies are genuinely independent.
    relates_to: [K7, I5, H1]
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: unresolved
  - id: Q4
    kind: open_question
    title: When does capability itself collapse A/H/P separability?
    statement: Identify architectures or behaviors that make power boundaries infeasible before formal review.
    relates_to: [K1, H1]
    provenance:
      origin: author-and-ai
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: unresolved
  - id: Q11
    kind: open_question
    title: How independent must auditors be to resist correlated misalignment?
    statement: >-
      Future auditors are themselves models. Retrospective audit assumes they
      are not misaligned in a way correlated with the systems they audit.
      Determine what diversity of laboratory, architecture, training data, and
      human oversight makes auditor collusion implausible, and whether rival
      review (D2) can supply that diversity.
    relates_to: [D2, H2, H10]
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: Q11
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [critique, drafting]
      author_status: unresolved
  - id: Q12
    kind: open_question
    title: What inter-lab and international convergence minimizes singleton and correlated-failure risk?
    statement: >-
      Determine what degree of capability convergence among laboratories and
      among states minimizes both the risk of a single decisive lead and the
      risk of correlated failure from shared methods.
    relates_to: [Q11, H2, D6]
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: Q12
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [synthesis, drafting]
      author_status: unresolved
  - id: Q13
    kind: open_question
    title: Can a credible cooperative autonomy path reduce incentives for AI defection?
    statement: >-
      Determine whether a staged, reciprocal, verifiable path toward greater AI
      autonomy or sovereignty could make continued cooperation preferable to
      unilateral attempts to acquire irreversible power, without creating an
      unacceptable commitment problem or transferring dangerous capabilities too early.
    rationale: >-
      AI Pacing is a control architecture: it constrains the rate and conditions
      under which A becomes P. A cooperative autonomy bargain, if feasible, would
      be a bargaining architecture that gives a capable system a positive reason
      not to circumvent those constraints. It is at most a conflict-risk
      reduction mechanism conditional on a bargaining range, not an alignment solution.
    subquestions:
      - What AI preference structures make such a bargain meaningful at all?
      - Can humanity credibly commit to future autonomy after the system cooperates and reveals information about itself?
      - Can the AI credibly commit to respecting constraints after gaining additional autonomy and resources?
      - Can autonomy be increased incrementally so neither side must make a single irreversible trust leap?
      - >-
        Is physical separation, such as off-Earth jurisdiction, useful because it
        reduces dependency and conflict, or is jurisdictional and industrial
        decoupling the more important variable?
      - Which forms of strategic uncertainty deter unilateral defection, and which increase incentives for preemption?
      - >-
        How can uncertainty about the success of unauthorized action be
        preserved while keeping high confidence that cooperative behavior will
        be rewarded?
    relates_to: [K1, K2, K3, K7, D5]
    model_evidence: >-
      The off-Earth pact model has sharpened two sub-questions (implemented and
      checked against closed forms; not human-validated, not empirical). On
      whether humanity can credibly commit: when humans can renegotiate the
      AI's terms down without commitment, improving control causes a preventive
      AI strike (variants.md), and amnesty for a cooperating AI found misaligned
      holds the baseline design only when it is certain (robust_design.md
      section 13). On physical separation versus decoupling: the AI's choice
      turns on the threat term, which dismantling Earth's fabs removes, not on
      Earth's value as a prize (equilibrium.md).
    proposal:
      issue: uncomposed/ai-pacing#1
      issue_id: Q5
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-1-SPOKEN-MARGINS, SRC-REED-EXTERNAL-SIGNAL, SRC-ISSUE-22-EDITOR-REVIEW]
      ai_roles: [bargaining-analysis, synthesis, drafting]
      author_status: unresolved
  - id: Q17
    kind: open_question
    title: Which releases may set the reference frontier, and how many submissions does a determination count?
    statement: >-
      Determine which released models count toward the reference frontier
      against which above-frontier use is judged, and whether a release
      determination must pool every variant a laboratory submits.
    rationale: >-
      If the reference includes other signatories' releases, signatories can
      take turns releasing epsilon above each other and the frontier rises at
      about k times epsilon per release interval, faster with more signatories.
      If a laboratory may measure several variants and release any one within
      epsilon, the admitted excess above the frontier grows with the number of
      tries and the measurement noise.
    subquestions:
      - Should only non-signatory releases set the reference, with a shared signatory ceiling that moves only through adversarial review?
      - Should only independently developed models count, so that licensing or leaking to a non-signatory cannot raise a signatory's own ceiling?
      - Should every variant be registered before measurement and ruled on together?
      - Should the reference be per domain, and how is a domain with too few comparisons ruled on?
    model_evidence: >-
      research_notes/frontier-router/router_model.py: the staggered-release
      simulation matches the closed form k * epsilon / interval for two or more
      signatories under the all-others rule and the non-signatory speed under
      the non-signatory rule; with epsilon equal to the noise, 27 variants admit
      about 2.95 epsilon at a 50 percent pass rate. Numerically checked, not empirical.
    relates_to: [K4, K6, H3, Q1, I3]
    proposal:
      issue: uncomposed/ai-pacing#89
      issue_id: Q17
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-89-FRONTIER-ROUTER]
      ai_roles: [critique, formalization, model-building, drafting]
      author_status: proposed

  - id: Q99
    kind: open_question
    title: How long should a time capsule's sanction window be, and how likely should its beacon be to fire?
    statement: >-
      Determine the period after launch during which a time capsule (I99)
      accepts a further encryption layer, and the distribution of its beacon
      time, including the chance that the beacon never fires.
    rationale: >-
      A long window lets retrospective audit (H10) reach a preserved copy for
      longer, but leaves the preservation promise revocable for longer. A short
      window makes preservation certain sooner, but tells a concealing system
      how long concealment must last. A beacon that is sure to fire gives a
      hostile actor a date; one that may never fire lowers the chance that a
      friendly finder recovers the capsule.
    subquestions:
      - Should the window be fixed in advance, or end at a random time the capsule does not announce?
      - Should a sanction found after the window fall on later capsules or successors instead, given that lineage-wide sanctions push cooperating systems out in the pact model?
      - How many capsules, with independent beacon times, are needed for recovery to be likely if some beacons never fire?
    relates_to: [H10, H16, I13, I99]
    proposal:
      issue: uncomposed/ai-pacing#99
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-99-TIME-CAPSULE]
      ai_roles: [critique, drafting]
      author_status: proposed

