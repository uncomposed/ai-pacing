publication:
  layers:
    canonical:
      authority: Git repository and immutable commit
      contains: Specification, history, sources, generated deterministic views, and tests
    website:
      authority: none
      contains: Cached readable projections, rendering index, and verification records
      disagreement_rule: If a website view and the targeted Git commit disagree, the Git commit controls.
    federation:
      authority: transport-only
      contains: Announcements, pointers, and attestations
  rendering_model:
    universal_type: rendering
    rule: >-
      Essays, games, runs, analyses, songs, films, protests, simulations,
      critiques, and all other external works use the same rendering envelope.
    required_fields: [artifact_uri, artifact_digest, target_git_commit, creator, relationship_claim, verifier_request]
    optional_fields: [covers, declared_omissions, declared_deviations, evidence_uri]
  verification_policy:
    principle: Verification describes fidelity and declared relationship, not quality or endorsement.
    outcomes:
      - verified
      - verified_with_deviations
      - not_verified
    attestation_must_name:
      - artifact_digest
      - full_target_git_commit
      - verifier_identity
      - verification_policy_version
      - judgment
      - evidence_digest

acceptance_tests:
  - id: AT-001
    title: Kernel is complete and minimal
    rationale: A faithful reconstruction must include all seven identity claims.
    assertions:
      - {type: exact_kind_ids, kind: kernel, ids: [K1, K2, K3, K4, K5, K6, K7]}
  - id: AT-002
    title: Capability is not conflated with power
    rationale: K1 and K2 must jointly ground the hardware-entanglement mechanism.
    assertions:
      - {type: node_exists, id: K1, kind: kernel}
      - {type: node_exists, id: K2, kind: kernel}
      - {type: path_exists, from: K1, to: D4}
      - {type: path_exists, from: K2, to: D4}
  - id: AT-003
    title: Research permission does not imply deployment permission
    rationale: The research/deployment distinction and external-agency boundary must both remain represented.
    assertions:
      - {type: node_exists, id: K3, kind: kernel}
      - {type: path_exists, from: K3, to: I1}
  - id: AT-004
    title: Above-frontier release is adversarially gated
    rationale: Removing rival review changes a central mechanism rather than a drafting detail.
    assertions:
      - {type: path_exists, from: K4, to: D2}
      - {type: path_exists, from: D2, to: I3}
      - {type: path_exists, from: D2, to: D3}
  - id: AT-005
    title: Domestic entry and automatic reciprocity coexist
    rationale: The proposal must neither require a treaty first nor ignore foreign public releases.
    assertions:
      - {type: node_exists, id: K5, kind: kernel}
      - {type: node_exists, id: K6, kind: kernel}
      - {type: path_exists, from: K5, to: D6}
      - {type: path_exists, from: K6, to: D6}
  - id: AT-006
    title: Warning time has legal, technical, and physical implementations
    rationale: K7 must reach incident reporting, hardware reversibility, and industrial vetoes.
    assertions:
      - {type: path_exists, from: K7, to: I2}
      - {type: path_exists, from: K7, to: I4}
      - {type: path_exists, from: K7, to: I5}
  - id: AT-007
    title: Foundational uncertainty remains falsifiable
    rationale: Feasibility claims must expose evidence needs and stopping rules.
    assertions:
      - {type: all_kind_have_fields, kind: hypothesis, fields: [falsifier, evidence_needed, stopping_rule]}
  - id: AT-008
    title: Implementation options cannot masquerade as kernel claims
    rationale: Optional policy choices must remain replaceable.
    assertions:
      - {type: all_kind_field_equals, kind: implementation, field: replaceable, value: true}
  - id: AT-009
    title: Provenance is proposition-level
    rationale: Every claim must expose responsibility and source lineage.
    assertions:
      - {type: all_nodes_have_provenance}
  - id: AT-010
    title: Publication authority is commit-addressed
    rationale: Branch movement or website drift must not alter the object that was rendered or verified.
    assertions:
      - {type: field_equals, path: specification.authority.system, value: git}
      - {type: field_equals, path: publication.rendering_model.universal_type, value: rendering}
      - {type: collection_contains, path: publication.verification_policy.attestation_must_name, value: full_target_git_commit}

deterministic_views:
  - id: VIEW-CANONICAL-JSON
    path: generated/canonical.json
    purpose: Stable normalized serialization used for semantic hashing and machine comparison.
  - id: VIEW-MINIMAL
    path: generated/minimal-reconstruction.md
    purpose: Seven-claim checksum for a purported explanation of the idea.
  - id: VIEW-AUDIT
    path: generated/audit-trail.md
    purpose: Chronological intellectual provenance with confidence and caveats.
  - id: VIEW-GRAPH
    path: generated/dependency-graph.mmd
    purpose: Machine-generated Mermaid dependency graph for omission and impact review.
  - id: VIEW-CLAIMS
    path: generated/claims.csv
    purpose: Flat claim register for review, filtering, and external analysis.
  - id: VIEW-ACCEPTANCE
    path: generated/acceptance-matrix.md
    purpose: Human-readable result of executable semantic acceptance assertions.
  - id: VIEW-REVIEW
    path: generated/rendering-review-checklist.md
    purpose: Commit-addressed checklist for an attributable rendering-fidelity judgment.
