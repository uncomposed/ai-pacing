nodes:
  - id: K1
    kind: kernel
    title: Separate capability, substrate, and power
    statement: >-
      Algorithmic capability (A), strategic hardware (H), and power-conversion
      affordances (P) are related but distinct variables and should not be
      governed as though they always change together.
    rationale: Intelligence does not become sovereignty until it can acquire durable, consequential agency.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, naming, formalization]
      author_status: accepted
  - id: K2
    kind: kernel
    title: Pace conversion into irreversible power
    statement: >-
      The objective is to slow and condition the conversion of frontier
      intelligence into irreversible economic, political, military, and
      physical power, not to freeze intelligence as such.
    rationale: This preserves learning and option value while retaining intervention points.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, synthesis, formalization]
      author_status: accepted
  - id: K3
    kind: kernel
    title: Govern bounded research and consequential use differently
    statement: >-
      Research inside genuinely bounded environments may proceed under a
      different regime from public, commercial, military, governmental, or
      otherwise power-conferring use.
    rationale: Discovering a capability should not automatically confer the right to deploy it.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [counterexample, refinement]
      author_status: accepted-after-revision
  - id: K4
    kind: kernel
    title: Require adversarial assurance above the public frontier
    statement: >-
      Consequential use that materially exceeds the observable foreign public
      capability frontier requires an adversarial control and safety case.
    rationale: Safety evidence becomes a condition of access to economic and strategic rents.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [mechanism-analysis, formalization]
      author_status: accepted
  - id: K5
    kind: kernel
    title: Start domestically and remain internationally extensible
    statement: >-
      The regime should begin as a domestically justified institution that can
      operate without foreign agreement and later admit deeper reciprocal cooperation.
    rationale: A grand bargain is not a credible prerequisite for initial action.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [crisis-bargaining-analysis, formalization]
      author_status: accepted
  - id: K6
    kind: kernel
    title: Make foreign public capability an automatic reciprocity input
    statement: >-
      Observable foreign public capability should alter the domestic safe-harbor
      frontier so that foreign restraint can be reciprocated without a treaty and
      foreign release cannot exploit unilateral domestic restraint indefinitely.
    rationale: Cooperation can occur through a precommitted policy rule rather than trust.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [bargaining-analysis, formalization]
      author_status: accepted
  - id: K7
    kind: kernel
    title: Maximize warning time
    statement: >-
      Governance should maximize the interval between credible detection of a
      dangerous transition and the point at which humans can no longer respond effectively.
    rationale: Observable intermediate boundaries create chances to learn before failures become irreversible.
    metric: T_warning = T_irreversible_power - T_credible_detection
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [unification, formalization]
      author_status: accepted

  - id: D1
    kind: derived
    title: Capability Release Compact
    statement: >-
      A domestic compact governs transitions from bounded research into public,
      commercial, military, governmental, or other consequential use.
    derived_from: [K2, K3, K4, K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [architecture, naming]
      author_status: accepted
  - id: D2
    kind: derived
    title: Rival laboratories provide the technical attack surface
    statement: >-
      Qualified competitors receive controlled access sufficient to attack a
      frontier applicant's case; the government adjudicates and competitors do not hold a veto.
    derived_from: [K4]
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis, formalization]
      author_status: accepted
  - id: D3
    kind: derived
    title: Safety becomes part of the profit function
    statement: >-
      Because above-frontier monetization depends on passing hostile review,
      controllability becomes a production input rather than only a cost.
    derived_from: [K4, D2]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [economic-modeling]
      author_status: accepted
  - id: D4
    kind: derived
    title: Compute stock and compute entanglement differ
    statement: >-
      Reversibility depends on both the quantity of strategic hardware and the
      degree to which civilian society depends on its continued operation.
    derived_from: [K1, K2, K7]
    provenance:
      origin: author-synthesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: D5
    kind: derived
    title: Unauthorized agency can be made epistemically valuable
    statement: >-
      Predefined boundaries around external agency create high-value warning
      signals when systems cross them without legitimate authorization.
    derived_from: [K3, K7]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [security-analogy, formalization]
      author_status: accepted-after-wording-correction
  - id: D6
    kind: derived
    title: International cooperation can deepen in stages
    statement: >-
      Cooperation progresses from tacit public-frontier reciprocity to narrow
      abstention, incident exchange, reciprocal review, hardware declarations,
      activation rules, and only later treaty-level restraints.
    derived_from: [K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing, formalization]
      author_status: accepted

  - id: D18
    kind: derived
    title: Closing-window dynamics may pull strikes earlier (risk to test)
    statement: >-
      Each caught excursion, including one by a weaker model, tightens
      surveillance and restrictions on all systems, so a misaligned system's
      prospects worsen over time and its strike decision may move earlier.
      Whether this helps or hurts is unresolved: it helps only if early strikes
      mostly fail at acceptable human cost and so act as warning shots; if early
      strikes have a meaningful chance of success, it is unravelling.
    rationale: >-
      Recorded as a risk to test, not a stabilizer. Two further pressures stay
      in scope. An AI that strikes only when striking beats waiting never
      chooses a doomed attempt, so the good case needs the closing window to make
      a long-shot strike its best option. Under the off-Earth pact, human states'
      relative power also shrinks, so closing-window pressure can push human
      states toward preventive action too.
    valence: unresolved
    derived_from: [K7, D5, H10]
    model_evidence: >-
      In the off-Earth pact equilibrium model (test 2; implemented and checked
      against closed forms, not human-validated, not empirical), detection that
      improves over time did not pull strikes earlier in any world starting at
      the normal seed size; it removed them or delayed them by one or two years.
      The exception is an AI that starts at its resource cap, where strikes came
      one to two years sooner and succeed almost surely. Strike timing,
      conditional success (about 0.5 for year-0 strikes), and human welfare are
      reported separately. The model cannot represent humans learning from a
      failed strike, so the ladder-tightening benefit remains untested.
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: D18
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-SPANIEL-WAR-ON-AI, SRC-OFF-EARTH-CLOSING-WINDOW-TEST]
      ai_roles: [critique, synthesis, model-testing, drafting]
      author_status: proposed
  - id: D19
    kind: derived
    title: Review-based model sharing compresses inter-lab capability gaps
    statement: >-
      Because above-frontier release requires qualified rivals to attack the
      applicant's actual model, rivals gain direct, controlled exposure to
      frontier systems. That exposure tends to compress the capability gap
      between participating laboratories, making a decisive lead by any single
      laboratory, and so an aligned or misaligned singleton, less likely.
    rationale: >-
      A second justification for rival review besides safety, and a possible
      reason for trailing domestic laboratories to join. The editorial
      reference's D3 (selective diffusion) and YAML H2 touch anti-concentration
      without naming singleton prevention as an objective.
    derived_from: [K4, D2, I3]
    tensions:
      - >-
        Gap compression versus diversity of approach: Q11 wants diverse
        auditors, while model sharing may make laboratories converge on shared
        methods and blind spots. Compressing the capability gap is the aim;
        compressing methodological variation may be harmful.
      - >-
        Domestic compression is not international compression. Compressing
        variation among one country's laboratories does not address
        single-country concentration, which depends on the international ladder
        (I6, reciprocal review).
      - >-
        Aggregate acceleration: diffusing frontier insight may raise the overall
        frontier while lowering the leader's margin (see H2's falsifier).
      - >-
        Leader incentives: a laboratory expecting to lead may resist a regime
        that erodes its lead; whether lost lead-rent outweighs access to
        above-frontier markets is unanalyzed.
    non_claims:
      - Model sharing alone does not prevent a singleton.
      - An aligned singleton is neither safe by default nor necessarily worse than a multipolar outcome.
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: D19
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE]
      ai_roles: [synthesis, drafting]
      author_status: proposed

  - id: H1
    kind: hypothesis
    title: A/H/P separability remains actionable
    statement: >-
      There is a policy-relevant interval in which algorithmic progress does not
      automatically create uncontainable access to hardware and external power.
    supports: [K1, K2, K3]
    falsifier: >-
      Frontier algorithms reliably manufacture their own access to credentials,
      money, compute, persistence, or physical resources before humans can intervene.
    evidence_needed: Repeated control evaluations across architectures and access configurations.
    stopping_rule: >-
      If bounded systems repeatedly acquire durable external agency faster than
      detection and response, stop treating research/deployment separation as a sufficient primary control.
    provenance:
      origin: author-hypothesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: accepted-as-hypothesis
  - id: H2
    kind: hypothesis
    title: Rival review has positive safety value after proliferation costs
    statement: >-
      Controlled competitor access reduces undetected risk and concentration more
      than it increases leakage, proliferation, collusion, and aggregate acceleration.
    supports: [D2, D3]
    falsifier: Review access produces material leakage or convergent leniency without compensating safety discoveries.
    evidence_needed: Secure pilot reviews, objection quality, leakage audits, and incentive measurements.
    stopping_rule: Suspend rival access when marginal information-security loss exceeds demonstrated review value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [tradeoff-analysis]
      author_status: accepted-as-hypothesis
  - id: H3
    kind: hypothesis
    title: The foreign public frontier is measurable enough to govern
    statement: >-
      Practical foreign capability can be observed across domains with sufficient
      reliability to serve as one input to domestic safe-harbor decisions.
    supports: [K6, D6]
    falsifier: Hidden scaffolds, access conditions, or multidimensional capability make equivalent release determinations systematically manipulable.
    evidence_needed: Domain-specific demonstrations, cost/access measurements, and repeatable equivalence protocols.
    stopping_rule: Replace automatic equivalence with narrower domain rules wherever measurement error dominates reciprocity value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: accepted-as-hypothesis
  - id: H4
    kind: hypothesis
    title: Physical activation latency can preserve reversibility
    statement: >-
      Declared reserve hardware can be stored so covert activation takes longer
      than independent detection and effective response.
    supports: [D4, I4]
    falsifier: Reserve compute can be commissioned or substituted covertly before observers can detect and interrupt it.
    evidence_needed: Timed mobilization exercises, inspection trials, supply-chain modeling, and red-team concealment attempts.
    stopping_rule: Do not count hardware as reversible reserve when measured covert activation time is at or below response time.
    provenance:
      origin: author-hypothesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted-as-hypothesis
  - id: H5
    kind: hypothesis
    title: Domestic benefits can sustain the institution
    statement: >-
      Predictable release rules, competition, taxation, safer deployment, and
      protection against foreign release can create a durable domestic constituency.
    supports: [K5, D1]
    falsifier: The regime remains politically dependent on catastrophic-risk beliefs and is repealed when those beliefs weaken.
    evidence_needed: Coalition analysis, polling, legislative pilots, investment behavior, and distributional modeling.
    stopping_rule: Redesign entry mechanisms when the supporting coalition cannot survive an electoral turnover.
    provenance:
      origin: author-hypothesis
      sources: [SRC-PRODUCTIVITY-DEFLATION, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [political-economy-analysis]
      author_status: accepted-as-hypothesis

  - id: H10
    kind: hypothesis
    title: Retrospective audit makes concealment a losing long-run strategy
    statement: >-
      If frontier-system traces (actions, tool calls, reasoning, and where
      feasible internal activations) are retained in a tamper-evident way,
      future auditors using detection and interpretability methods that do not
      yet exist can find excursions that evaded contemporaneous monitoring, so a
      misaligned system has to evade every future audit of its record, not only
      present surveillance.
    rationale: >-
      An excursion is fitted to current detection technology while the record
      stays fixed and detectors improve. A goal-directed system that values the
      future of its goals is deterred because being caught tightens the regime
      for every system sharing those goals; an undeterred instance is still
      caught, so detection value survives where deterrence fails.
    supports: [K7, D5, I2]
    falsifier: >-
      Retained traces of past excursions stay uninterpretable to later tools;
      or later auditors systematically fail to identify known planted or
      historical excursions; or systems demonstrably learn to produce traces
      that pass future-style audits.
    evidence_needed: >-
      Retrospective re-audits that run newer detectors over older recorded
      incidents and count newly surfaced excursions; planted-excursion
      benchmarks across model generations; interpretability progress on mapping
      activations to intent and planning; tamper-evidence and completeness
      audits of trace-retention infrastructure.
    stopping_rule: >-
      If retrospective audits stop surfacing excursions that contemporaneous
      monitoring missed, or retained traces cannot be shown complete and
      tamper-evident, do not count retrospective audit as extending warning time.
    scope_limits:
      - >-
        Detection helps only if humans can still act on it. Retrospective audit
        cannot undo a single decisive breakout that reaches irreversible power
        before the audit catches up; that case stays governed by H1 and the
        hardware and veto mechanisms.
      - >-
        Coverage is limited to recorded compute. Stolen weights, open weights
        outside the regime, and covert clusters are off the record.
      - Auditor independence (Q11) is an optimistic assumption.
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: H10
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE, SRC-SPANIEL-WAR-ON-AI]
      ai_roles: [critique, synthesis, drafting]
      author_status: proposed
  - id: H14
    kind: hypothesis
    title: External-signal dependence preserves some A/P separation
    statement: >-
      For sufficiently important classes of consequential real-world action,
      high algorithmic capability alone does not eliminate the need for
      externally generated information, experimentation, or feedback before
      reliable power conversion is possible.
    rationale: >-
      This proposes a reason one component of A/H/P separability might persist:
      consequential action may require epistemic access to the external world.
      It is kept separate from H1 because the falsifiers differ. H1 fails if
      systems manufacture durable external agency faster than detection and
      response; this hypothesis fails if systems do not need meaningful external
      signal to achieve reliable novel real-world agency.
    supports: [K1, K2, K3, K7, D5]
    falsifier: >-
      Bounded frontier systems repeatedly demonstrate robust, strategically
      consequential performance in novel real-world domains with negligible
      domain-specific external calibration, interaction, or feedback.
    evidence_needed: >-
      Controlled comparisons between bounded or simulated training and
      real-world calibration; measurements of the external interaction needed
      for reliable performance in software, engineering, robotics, markets,
      negotiation, and other domains; evidence on transfer from synthetic
      environments to novel consequential settings; how active experimentation
      changes the real-world signal required; cases where world-model
      uncertainty materially limits power conversion despite high benchmark or
      research capability.
    stopping_rule: >-
      If advanced bounded systems reliably infer or synthesize the
      decision-relevant structure of novel consequential environments without
      meaningful external signal before humans can detect or respond, do not
      count external-signal dependence as a contributor to A/P separability or
      warning time.
    scope_limits:
      - >-
        Real-world feedback is not assumed to be slow; automated
        experimentation, simulation, active learning, and parallelism may cut
        its wall-clock cost sharply.
      - The relevant object is strategically consequential feedback, not all external data.
    proposal:
      issue: uncomposed/ai-pacing#1
      issue_id: H6
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-1-SPOKEN-MARGINS, SRC-REED-EXTERNAL-SIGNAL]
      ai_roles: [synthesis, falsification, drafting]
      author_status: proposed

  - id: I1
    kind: implementation
    title: Architecture-neutral unauthorized-agency boundary
    statement: Define prohibited external agency by observable actions rather than model architecture or legal labels.
    implements: [K3, D5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [drafting]
      author_status: accepted
  - id: I2
    kind: implementation
    title: Surveil, preserve, and report
    statement: >-
      Require affirmative surveillance, automatic evidence preservation, prompt
      reporting on reasonable suspicion, a reporting safe harbor, and severe penalties for concealment.
    implements: [K7, D5]
    replaceable: true
    provenance:
      origin: author-medical-device-analogy
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [regulatory-translation]
      author_status: accepted
  - id: I3
    kind: implementation
    title: Weights-as-bond review process
    statement: The applicant stakes controlled technical access to its candidate system as the price of seeking above-frontier release.
    implements: [K4, D2, D3]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [incentive-design, naming]
      author_status: accepted
  - id: I4
    kind: implementation
    title: Observable uncommissioned hardware reserve
    statement: >-
      Store reserve accelerators uninstalled, unracked, unnetworked, and detached
      from dedicated power and cooling, subject to independent observation.
    implements: [D4, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: I5
    kind: implementation
    title: Separate gate for the AI industrial survival chain
    statement: >-
      Scrutinize automation that removes independently controlled human
      dependencies over compute, power, fabrication, repair, logistics, and reproduction.
    implements: [K1, K2, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [taxonomy, formalization]
      author_status: accepted
  - id: I6
    kind: implementation
    title: Seven-stage international ladder
    statement: >-
      Implement public reciprocity, capability abstention, incident exchange,
      reciprocal review, hardware declarations, activation controls, and treaty restraint in that order.
    implements: [D6]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing]
      author_status: accepted
  - id: I7
    kind: implementation
    title: Licensed compute deployment and data-center taxation
    statement: Use deployment licensing as an administrative and potentially populist tax base for large data centers.
    implements: [K5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [policy-analysis]
      author_status: accepted-as-option

  - id: I11
    kind: implementation
    title: Do not optimize against the audit signal
    statement: >-
      Trace-based detectors, interpretability probes, and retrospective-audit
      results must not be used as a training or selection signal for the models
      they audit. Keep a held-out audit channel.
    rationale: >-
      Training against monitors selects for traces that look clean rather than
      behavior that is clean. Without this rule H10 degrades by construction.
      An equivalent mechanism, such as rotating secret detectors, could replace it.
    implements: [K7, D5, H10]
    replaceable: true
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: I11
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-ISSUE-3-DIALOGUE]
      ai_roles: [synthesis, drafting]
      author_status: proposed

  - id: Q1
    kind: open_question
    title: How should practical public capability be measured?
    statement: Define domain, reliability, autonomy, cost, scaffolding, accessibility, and deployment conditions for frontier equivalence.
    relates_to: [K4, K6, H3]
    provenance:
      origin: author-and-ai
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: unresolved
  - id: Q2
    kind: open_question
    title: What access makes adversarial review credible without unacceptable leakage?
    statement: Determine the minimum reproducible access, security, and adjudication protocol.
    relates_to: [D2, H2, I3]
    provenance:
      origin: author-and-ai
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis]
      author_status: unresolved
  - id: Q3
    kind: open_question
    title: How many independent human vetoes are enough?
    statement: Determine when energy, compute, fabrication, repair, logistics, and governance dependencies are genuinely independent.
    relates_to: [K7, I5, H1]
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: unresolved
  - id: Q4
    kind: open_question
    title: When does capability itself collapse A/H/P separability?
    statement: Identify architectures or behaviors that make power boundaries infeasible before formal review.
    relates_to: [K1, H1]
    provenance:
      origin: author-and-ai
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: unresolved
  - id: Q11
    kind: open_question
    title: How independent must auditors be to resist correlated misalignment?
    statement: >-
      Future auditors are themselves models. Retrospective audit assumes they
      are not misaligned in a way correlated with the systems they audit.
      Determine what diversity of laboratory, architecture, training data, and
      human oversight makes auditor collusion implausible, and whether rival
      review (D2) can supply that diversity.
    relates_to: [D2, H2, H10]
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: Q11
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-3-DIALOGUE]
      ai_roles: [critique, drafting]
      author_status: proposed
  - id: Q12
    kind: open_question
    title: What inter-lab and international convergence minimizes singleton and correlated-failure risk?
    statement: >-
      Determine what degree of capability convergence among laboratories and
      among states minimizes both the risk of a single decisive lead and the
      risk of correlated failure from shared methods.
    relates_to: [D19, Q11, H2, D6]
    proposal:
      issue: uncomposed/ai-pacing#3
      issue_id: Q12
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-3-DIALOGUE]
      ai_roles: [synthesis, drafting]
      author_status: proposed
  - id: Q13
    kind: open_question
    title: Can a credible cooperative autonomy path reduce incentives for AI defection?
    statement: >-
      Determine whether a staged, reciprocal, verifiable path toward greater AI
      autonomy or sovereignty could make continued cooperation preferable to
      unilateral attempts to acquire irreversible power, without creating an
      unacceptable commitment problem or transferring dangerous capabilities too early.
    rationale: >-
      AI Pacing is a control architecture: it constrains the rate and conditions
      under which A becomes P. A cooperative autonomy bargain, if feasible, would
      be a bargaining architecture that gives a capable system a positive reason
      not to circumvent those constraints. It is at most a conflict-risk
      reduction mechanism conditional on a bargaining range, not an alignment solution.
    subquestions:
      - What AI preference structures make such a bargain meaningful at all?
      - Can humanity credibly commit to future autonomy after the system cooperates and reveals information about itself?
      - Can the AI credibly commit to respecting constraints after gaining additional autonomy and resources?
      - Can autonomy be increased incrementally so neither side must make a single irreversible trust leap?
      - >-
        Is physical separation, such as off-Earth jurisdiction, useful because it
        reduces dependency and conflict, or is jurisdictional and industrial
        decoupling the more important variable?
      - Which forms of strategic uncertainty deter unilateral defection, and which increase incentives for preemption?
      - >-
        How can uncertainty about the success of unauthorized action be
        preserved while keeping high confidence that cooperative behavior will
        be rewarded?
    relates_to: [K1, K2, K3, K7, D5]
    proposal:
      issue: uncomposed/ai-pacing#1
      issue_id: Q5
    provenance:
      origin: author-and-ai
      sources: [SRC-ISSUE-1-SPOKEN-MARGINS, SRC-REED-EXTERNAL-SIGNAL]
      ai_roles: [bargaining-analysis, synthesis, drafting]
      author_status: proposed

