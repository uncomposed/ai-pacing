nodes:
  - id: K1
    kind: kernel
    title: Separate capability, substrate, and power
    statement: >-
      Algorithmic capability (A), strategic hardware (H), and power-conversion
      affordances (P) are related but distinct variables and should not be
      governed as though they always change together.
    rationale: Intelligence does not become sovereignty until it can acquire durable, consequential agency.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, naming, formalization]
      author_status: accepted
  - id: K2
    kind: kernel
    title: Pace conversion into irreversible power
    statement: >-
      The objective is to slow and condition the conversion of frontier
      intelligence into irreversible economic, political, military, and
      physical power, not to freeze intelligence as such.
    rationale: This preserves learning and option value while retaining intervention points.
    provenance:
      origin: author-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [critique, synthesis, formalization]
      author_status: accepted
  - id: K3
    kind: kernel
    title: Govern bounded research and consequential use differently
    statement: >-
      Research inside genuinely bounded environments may proceed under a
      different regime from public, commercial, military, governmental, or
      otherwise power-conferring use.
    rationale: Discovering a capability should not automatically confer the right to deploy it.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [counterexample, refinement]
      author_status: accepted-after-revision
  - id: K4
    kind: kernel
    title: Require adversarial assurance above the public frontier
    statement: >-
      Consequential use that materially exceeds the observable foreign public
      capability frontier requires an adversarial control and safety case.
    rationale: Safety evidence becomes a condition of access to economic and strategic rents.
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [mechanism-analysis, formalization]
      author_status: accepted
  - id: K5
    kind: kernel
    title: Start domestically and remain internationally extensible
    statement: >-
      The regime should begin as a domestically justified institution that can
      operate without foreign agreement and later admit deeper reciprocal cooperation.
    rationale: A grand bargain is not a credible prerequisite for initial action.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [crisis-bargaining-analysis, formalization]
      author_status: accepted
  - id: K6
    kind: kernel
    title: Make foreign public capability an automatic reciprocity input
    statement: >-
      Observable foreign public capability should alter the domestic safe-harbor
      frontier so that foreign restraint can be reciprocated without a treaty and
      foreign release cannot exploit unilateral domestic restraint indefinitely.
    rationale: Cooperation can occur through a precommitted policy rule rather than trust.
    provenance:
      origin: author-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [bargaining-analysis, formalization]
      author_status: accepted
  - id: K7
    kind: kernel
    title: Maximize warning time
    statement: >-
      Governance should maximize the interval between credible detection of a
      dangerous transition and the point at which humans can no longer respond effectively.
    rationale: Observable intermediate boundaries create chances to learn before failures become irreversible.
    metric: T_warning = T_irreversible_power - T_credible_detection
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [unification, formalization]
      author_status: accepted

  - id: D1
    kind: derived
    title: Capability Release Compact
    statement: >-
      A domestic compact governs transitions from bounded research into public,
      commercial, military, governmental, or other consequential use.
    derived_from: [K2, K3, K4, K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [architecture, naming]
      author_status: accepted
  - id: D2
    kind: derived
    title: Rival laboratories provide the technical attack surface
    statement: >-
      Qualified competitors receive controlled access sufficient to attack a
      frontier applicant's case; the government adjudicates and competitors do not hold a veto.
    derived_from: [K4]
    provenance:
      origin: author
      sources: [SRC-TOBY-ORD, SRC-PAUSEAI, SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis, formalization]
      author_status: accepted
  - id: D3
    kind: derived
    title: Safety becomes part of the profit function
    statement: >-
      Because above-frontier monetization depends on passing hostile review,
      controllability becomes a production input rather than only a cost.
    derived_from: [K4, D2]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [economic-modeling]
      author_status: accepted
  - id: D4
    kind: derived
    title: Compute stock and compute entanglement differ
    statement: >-
      Reversibility depends on both the quantity of strategic hardware and the
      degree to which civilian society depends on its continued operation.
    derived_from: [K1, K2, K7]
    provenance:
      origin: author-synthesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: D5
    kind: derived
    title: Unauthorized agency can be made epistemically valuable
    statement: >-
      Predefined boundaries around external agency create high-value warning
      signals when systems cross them without legitimate authorization.
    derived_from: [K3, K7]
    provenance:
      origin: author-interjection-and-ai-formalization
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [security-analogy, formalization]
      author_status: accepted-after-wording-correction
  - id: D6
    kind: derived
    title: International cooperation can deepen in stages
    statement: >-
      Cooperation progresses from tacit public-frontier reciprocity to narrow
      abstention, incident exchange, reciprocal review, hardware declarations,
      activation rules, and only later treaty-level restraints.
    derived_from: [K5, K6]
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing, formalization]
      author_status: accepted

  - id: H1
    kind: hypothesis
    title: A/H/P separability remains actionable
    statement: >-
      There is a policy-relevant interval in which algorithmic progress does not
      automatically create uncontainable access to hardware and external power.
    supports: [K1, K2, K3]
    falsifier: >-
      Frontier algorithms reliably manufacture their own access to credentials,
      money, compute, persistence, or physical resources before humans can intervene.
    evidence_needed: Repeated control evaluations across architectures and access configurations.
    stopping_rule: >-
      If bounded systems repeatedly acquire durable external agency faster than
      detection and response, stop treating research/deployment separation as a sufficient primary control.
    provenance:
      origin: author-hypothesis
      sources: [SRC-AI-BREAKOUT, SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: accepted-as-hypothesis
  - id: H2
    kind: hypothesis
    title: Rival review has positive safety value after proliferation costs
    statement: >-
      Controlled competitor access reduces undetected risk and concentration more
      than it increases leakage, proliferation, collusion, and aggregate acceleration.
    supports: [D2, D3]
    falsifier: Review access produces material leakage or convergent leniency without compensating safety discoveries.
    evidence_needed: Secure pilot reviews, objection quality, leakage audits, and incentive measurements.
    stopping_rule: Suspend rival access when marginal information-security loss exceeds demonstrated review value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [tradeoff-analysis]
      author_status: accepted-as-hypothesis
  - id: H3
    kind: hypothesis
    title: The foreign public frontier is measurable enough to govern
    statement: >-
      Practical foreign capability can be observed across domains with sufficient
      reliability to serve as one input to domestic safe-harbor decisions.
    supports: [K6, D6]
    falsifier: Hidden scaffolds, access conditions, or multidimensional capability make equivalent release determinations systematically manipulable.
    evidence_needed: Domain-specific demonstrations, cost/access measurements, and repeatable equivalence protocols.
    stopping_rule: Replace automatic equivalence with narrower domain rules wherever measurement error dominates reciprocity value.
    provenance:
      origin: author-hypothesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: accepted-as-hypothesis
  - id: H4
    kind: hypothesis
    title: Physical activation latency can preserve reversibility
    statement: >-
      Declared reserve hardware can be stored so covert activation takes longer
      than independent detection and effective response.
    supports: [D4, I4]
    falsifier: Reserve compute can be commissioned or substituted covertly before observers can detect and interrupt it.
    evidence_needed: Timed mobilization exercises, inspection trials, supply-chain modeling, and red-team concealment attempts.
    stopping_rule: Do not count hardware as reversible reserve when measured covert activation time is at or below response time.
    provenance:
      origin: author-hypothesis
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted-as-hypothesis
  - id: H5
    kind: hypothesis
    title: Domestic benefits can sustain the institution
    statement: >-
      Predictable release rules, competition, taxation, safer deployment, and
      protection against foreign release can create a durable domestic constituency.
    supports: [K5, D1]
    falsifier: The regime remains politically dependent on catastrophic-risk beliefs and is repealed when those beliefs weaken.
    evidence_needed: Coalition analysis, polling, legislative pilots, investment behavior, and distributional modeling.
    stopping_rule: Redesign entry mechanisms when the supporting coalition cannot survive an electoral turnover.
    provenance:
      origin: author-hypothesis
      sources: [SRC-PRODUCTIVITY-DEFLATION, SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [political-economy-analysis]
      author_status: accepted-as-hypothesis

  - id: I1
    kind: implementation
    title: Architecture-neutral unauthorized-agency boundary
    statement: Define prohibited external agency by observable actions rather than model architecture or legal labels.
    implements: [K3, D5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PAUSEAI, SRC-HUGGING-FACE]
      ai_roles: [drafting]
      author_status: accepted
  - id: I2
    kind: implementation
    title: Surveil, preserve, and report
    statement: >-
      Require affirmative surveillance, automatic evidence preservation, prompt
      reporting on reasonable suspicion, a reporting safe harbor, and severe penalties for concealment.
    implements: [K7, D5]
    replaceable: true
    provenance:
      origin: author-medical-device-analogy
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [regulatory-translation]
      author_status: accepted
  - id: I3
    kind: implementation
    title: Weights-as-bond review process
    statement: The applicant stakes controlled technical access to its candidate system as the price of seeking above-frontier release.
    implements: [K4, D2, D3]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [incentive-design, naming]
      author_status: accepted
  - id: I4
    kind: implementation
    title: Observable uncommissioned hardware reserve
    statement: >-
      Store reserve accelerators uninstalled, unracked, unnetworked, and detached
      from dedicated power and cooling, subject to independent observation.
    implements: [D4, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-DAVIDSON, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: accepted
  - id: I5
    kind: implementation
    title: Separate gate for the AI industrial survival chain
    statement: >-
      Scrutinize automation that removes independently controlled human
      dependencies over compute, power, fabrication, repair, logistics, and reproduction.
    implements: [K1, K2, K7]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [taxonomy, formalization]
      author_status: accepted
  - id: I6
    kind: implementation
    title: Seven-stage international ladder
    statement: >-
      Implement public reciprocity, capability abstention, incident exchange,
      reciprocal review, hardware declarations, activation controls, and treaty restraint in that order.
    implements: [D6]
    replaceable: true
    provenance:
      origin: author-and-ai-synthesis
      sources: [SRC-NGO, SRC-PLAN-A-BARGAINING]
      ai_roles: [sequencing]
      author_status: accepted
  - id: I7
    kind: implementation
    title: Licensed compute deployment and data-center taxation
    statement: Use deployment licensing as an administrative and potentially populist tax base for large data centers.
    implements: [K5]
    replaceable: true
    provenance:
      origin: author
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [policy-analysis]
      author_status: accepted-as-option

  - id: Q1
    kind: open_question
    title: How should practical public capability be measured?
    statement: Define domain, reliability, autonomy, cost, scaffolding, accessibility, and deployment conditions for frontier equivalence.
    relates_to: [K4, K6, H3]
    provenance:
      origin: author-and-ai
      sources: [SRC-TOBY-ORD, SRC-PLAN-A-BARGAINING]
      ai_roles: [measurement-critique]
      author_status: unresolved
  - id: Q2
    kind: open_question
    title: What access makes adversarial review credible without unacceptable leakage?
    statement: Determine the minimum reproducible access, security, and adjudication protocol.
    relates_to: [D2, H2, I3]
    provenance:
      origin: author-and-ai
      sources: [SRC-PLAN-A-BARGAINING]
      ai_roles: [risk-analysis]
      author_status: unresolved
  - id: Q3
    kind: open_question
    title: How many independent human vetoes are enough?
    statement: Determine when energy, compute, fabrication, repair, logistics, and governance dependencies are genuinely independent.
    relates_to: [K7, I5, H1]
    provenance:
      origin: author
      sources: [SRC-AI-BREAKOUT, SRC-PLAN-A-BARGAINING]
      ai_roles: [formalization]
      author_status: unresolved
  - id: Q4
    kind: open_question
    title: When does capability itself collapse A/H/P separability?
    statement: Identify architectures or behaviors that make power boundaries infeasible before formal review.
    relates_to: [K1, H1]
    provenance:
      origin: author-and-ai
      sources: [SRC-HUGGING-FACE, SRC-PLAN-A-BARGAINING]
      ai_roles: [falsification]
      author_status: unresolved

