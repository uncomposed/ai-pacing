  - id: SRC-ISSUE-1-SPOKEN-MARGINS
    title: External-signal dependence and human–AI bargaining extensions
    kind: listening-session-recorded-in-issue
    date: "2026-09-10"
    locator: >-
      Spoken Margins/Why the intelligence explosion can't happen inside a data
      centre | Tom Reed, session of 2026-09-10 13:14, as recorded in
