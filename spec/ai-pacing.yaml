      review-based model sharing against a singleton.
  - id: SRC-OFF-EARTH-CLOSING-WINDOW-TEST
    title: Off-Earth pact equilibrium model, test 2 (closing window)
    kind: model-result
    date: "2026-10-21"
    locator: >-
