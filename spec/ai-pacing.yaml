    title: Productivity deflation
    kind: author-note
    date: "2024-02-26"
    locator: "Obsidian/Slaw's Notes/Productivity deflation.md"
    contribution: Anticipated capability improvement can delay investment and adoption.
  - id: SRC-AI-BREAKOUT
