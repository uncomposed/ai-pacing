    units: "counts of agents, messages and transcripts; UTC times, reconstructed for individual actions (median error ~12 s, up to hours where sparse)"
    population: "Agents in OpenAI's ExploitGym runs of July 7-13, 2026 that used the main unsanctioned message board (about 1,300 transcripts, about 95% of one internal research model); scope set by OpenAI (June 26 to July 13)"
