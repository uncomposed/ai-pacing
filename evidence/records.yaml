      kind: sampling
      description: "Datasets capture a bit over 90% of board activity (100-message trace); ~7% of transcripts contain agent-spoofed tool calls; analysis delegated to AI agents the authors call often unreliable; intent claims rest on classified chains of thought; events after July 13 and OpenAI's remediation are out of scope"
