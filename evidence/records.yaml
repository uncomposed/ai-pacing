  - id: EV-METR-RCT-2025
    kind: observation_report
    title: "Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity (RCT)"
    source:
      citation: "Becker, Rush, Barnes and Rein, METR blog, 2025-07-10 (the accompanying paper was not read)"
      url: "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"
      version: "blog as served 2026-10-25 (datePublished 2025-07-10; now marked out of date by METR)"
    reading: read_primary
    observation_date: {start: "2025-02", end: "2025-06"}
    availability_date: "2025-07-10"
    availability_basis: "blog datePublished; study months from METR's 2026-02-24 post ('data from February to June 2025')"
    units: "ratio of implementation time with AI allowed to without (self-reported time, screen-recorded)"
    population: "16 experienced developers on their own large open-source repositories; 246 issues averaging about two hours; mostly Cursor Pro with Claude 3.5/3.7 Sonnet"
    protocol: "issue-level randomization to AI allowed or disallowed"
    extraction:
      method: quoted
      locator: "blog sections Methodology and Core Result: 19% longer with AI; developers expected 24% speedup and afterwards believed 20%; 95% CI +2% to +39% (from the 2026-02-24 post)"
      by: "issue #12 session, 2026-10-25"
      date: "2026-10-25"
      note: "METR lists claims it does not support (no generalization to most developers, other domains or future AI). The paper's factor analysis (5 of 20 factors likely contribute) was read only as summarized in the blog."
    uncertainty:
      kind: sampling
      description: "95% CI +2% to +39% on time; small developer sample; one setting with high quality standards and implicit requirements"
    depends_on: []
    fitted_to: []
    intended_use: ["realized task productivity observable, separate from benchmark capability (#12)"]
    not_for: ["benchmark capability", "adoption", "generalization to other developers, tasks, tools or later AI", "research output"]

