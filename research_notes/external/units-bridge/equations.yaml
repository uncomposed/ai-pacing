# Dimensional consistency of the equations used across the bridge (issue #11). [[ai gen]] Written 2026-10-25.
#
# tools/units_tool.py parses every equation with Python's ast, gives each symbol its declared unit and checks that
# both sides, every term of a sum and every argument of min/max carry the same dimensions, that exp/log arguments
# are dimensionless, and that a `check_value` equation reproduces the declared value (in SI-scaled units).
# Inequalities (<=) are checked like equations. Symbols may point at a dictionary quantity; then their units must
# have the quantity's dimensions.

schema_version: 0.1.0

symbols:
  # pact solver (equilibrium_model.py, unchanged)
  A: {unit: EIU, quantity: QTY-PACT-A}
  A_next: {unit: EIU, quantity: QTY-PACT-A}
  Kmax: {unit: EIU, quantity: QTY-PACT-A}
  g: {unit: 1/yr, quantity: QTY-GROWTH-RATE-G}
  chi: {unit: "1", quantity: QTY-CHI0}
  dt: {unit: yr}
  T_double: {unit: yr, quantity: QTY-DOUBLING-TIME}
  # pact solver payoffs and transfers (issue #39): where A and H are stocks and where they are flows
  H: {unit: EIU, quantity: QTY-EARTH-INDUSTRY-H}
  rho: {unit: 1/yr, value: 1.0}
  gam: {unit: "1"}
  sigma: {unit: "1"}
  N: {unit: "1"}
  c_w: {unit: "1"}
  c_S: {unit: EIU, quantity: QTY-PACT-A}
  A_seized: {unit: EIU, quantity: QTY-PACT-A}
  T_trade: {unit: EIU/yr, quantity: QTY-INDUSTRIAL-OUTPUT}
  Y_AI: {unit: EIU/yr, quantity: QTY-INDUSTRIAL-OUTPUT}
  Y_H: {unit: EIU/yr, quantity: QTY-INDUSTRIAL-OUTPUT}
  F: {unit: LEC, quantity: QTY-LE-FAB-LEVEL-F}
  F_next: {unit: LEC, quantity: QTY-LE-FAB-LEVEL-F}
  F_ref: {unit: LEC, value: 1.0}
  T_dis: {unit: yr}
  # GATE output read in the unit (CV-GWP-TO-EIU-OUTPUT)
  Y_gate: {unit: USD/yr, quantity: QTY-GWP}
  Y_ref: {unit: USD/EIU, value: 1.11669432109121e+14}
  f_gwp: {unit: EIU/USD, value: 8.955002108570063e-15}
  # Metzger docking bridge
  E_gen5: {unit: J/yr, value: 1.0e+15, quantity: QTY-METZGER-GEN5-ENERGY}
  P_earth: {unit: W/EIU, value: 1.96e+13}
  m_gen5: {unit: t, value: 6434.0, quantity: QTY-METZGER-ASSET-MASS}
  u_t: {unit: EIU/t, value: 2.5128e-10}
  A_gen5: {unit: EIU, value: 1.6167e-6, quantity: QTY-PACT-A}
  r_metzger: {unit: 1/yr, value: 0.6474, quantity: QTY-METZGER-GROWTH-RATE}
  T_gen: {unit: yr, value: 2.0, quantity: QTY-METZGER-GEN-SPACING}
  # coupling toy (coupling_toy.py)
  Y: {unit: EIU/yr, quantity: QTY-INDUSTRIAL-OUTPUT}
  nu: {unit: 1/yr}
  K: {unit: EIU, quantity: QTY-TOY-CAPITAL}
  E: {unit: EIU, quantity: QTY-TOY-ENERGY}
  E_max: {unit: EIU, quantity: QTY-TOY-ENERGY}
  C: {unit: EIU, quantity: QTY-TOY-COMPUTE}
  C_ops: {unit: EIU, quantity: QTY-TOY-COMPUTE}
  C_res: {unit: EIU, quantity: QTY-TOY-COMPUTE}
  phi: {unit: "1"}
  D: {unit: EIU/yr, quantity: QTY-TOY-DESIGN}
  D_h: {unit: EIU/yr, quantity: QTY-TOY-DESIGN}
  lam: {unit: 1/yr}
  s: {unit: "1"}
  kappa: {unit: "1"}
  c_K: {unit: "1"}
  c_E: {unit: "1"}
  c_C: {unit: "1"}
  dK: {unit: EIU}
  dE: {unit: EIU}
  dC: {unit: EIU}
  r_E: {unit: 1/yr}
  Q_imp: {unit: EIU/yr, quantity: QTY-TOY-CHIP-SUPPLY}
  eta_crude: {unit: 1/yr}
  eta_le: {unit: 1/yr}
  crude: {unit: "1"}
  le: {unit: "1"}
  delta: {unit: 1/yr}
  K_next: {unit: EIU, quantity: QTY-TOY-CAPITAL}

equations:
  - {id: PACT-GROWTH, model: AD-PACT, text: "A_next = A * exp(g * chi * dt * (1 - A / Kmax))"}
  - {id: PACT-DOUBLING, model: AD-PACT, text: "T_double = log(2) / g"}
  # rho is the output rate the solver leaves implicit (rho = 1/yr with dt = 1 yr); without it these do not balance.
  - {id: PACT-OUTPUT-RATE, model: AD-PACT, text: "Y = rho * A", note: "CV-CAPACITY-TO-OUTPUT; the AD-PACT output_rate in systems/modes.yaml"}
  - {id: PACT-TRADE, model: AD-PACT, text: "T_trade = gam * rho * min(A, H)", note: "solve(): trade = gam * min(A, H), 'trade surplus per year as a share of the smaller partner's economy'"}
  - {id: PACT-AI-FLOW, model: AD-PACT, text: "Y_AI = rho * A + sigma * T_trade", note: "solve(): flowA_pact = u(A + (1 - reinv) sigma trade ...) dt, with reinv = psi_div = 0 and no blockade"}
  - {id: PACT-HUMAN-FLOW, model: AD-PACT, text: "Y_H = rho * H + (1 - sigma) * T_trade / N", note: "solve(): flowH_pact = (1 + (1 - sigma) trade / N - den_cost) dt; the 1 is H's yearly output, the human welfare unit"}
  - {id: PACT-REINVEST, model: AD-PACT, text: "A_next = A + sigma * T_trade * dt", note: "solve(): reinv = 1 adds sigma trade dt to the stock (growth term omitted here)"}
  - {id: PACT-PRIZE, model: AD-PACT, text: "A_seized = A - c_S + (1 - c_w) * H", note: "solve(): As0 = A - cS + Pi0, Pi0 = (1 - c_w) H; a seizure transfers Earth's capacity, a stock"}
  - {id: PACT-FAB-DISMANTLE, model: AD-PACT, text: "F_next = F - F_ref * dt / T_dis", note: "solve(): F - dt / T_dis; F is a share of F_ref = 1 LEC, a level of installed capacity"}
  - {id: GATE-Y-IN-EIU, model: AD-GATE, text: "Y = Y_gate / Y_ref", note: "CV-GWP-TO-EIU-OUTPUT: GATE output read in EIU/yr; not coupled"}
  - {id: GWP-FACTOR, model: AD-GATE, text: "f_gwp = 1 / Y_ref", check_value: f_gwp}
  - {id: METZGER-BRIDGE, model: docking, text: "u_t = E_gen5 / P_earth / m_gen5", check_value: u_t}
  - {id: METZGER-GEN5-EIU, model: docking, text: "A_gen5 = E_gen5 / P_earth", check_value: A_gen5}
  - {id: METZGER-PER-GENERATION, model: Metzger, text: "T_gen * r_metzger = log(3.65)", note: "ln of the growth factor per generation is dimensionless; 3.65 = exp(2 x 0.647)"}
  - {id: TOY-OUTPUT, model: toy, text: "Y = nu * min(K, E, C_ops)"}
  - {id: TOY-COMPUTE-SPLIT, model: toy, text: "C = C_ops + C_res"}
  - {id: TOY-RESEARCH-SHARE, model: toy, text: "C_res = phi * C"}
  - {id: TOY-DESIGN, model: toy, text: "D = D_h + lam * C_res"}
  - {id: TOY-BUDGET, model: toy, text: "c_K * dK + c_E * dE + c_C * dC <= s * Y * dt"}
  - {id: TOY-DESIGN-CAP, model: toy, text: "dK + dE + dC <= D * dt"}
  - {id: TOY-ENERGY-RATE-CAP, model: toy, text: "dE <= r_E * E * dt"}
  - {id: TOY-ENERGY-RESOURCE-CAP, model: toy, text: "E + dE <= E_max"}
  - {id: TOY-CHIP-CAP, model: toy, text: "dC <= (Q_imp + eta_crude * crude * K + eta_le * le * K) * dt"}
  - {id: TOY-CAPITAL, model: toy, text: "K_next = K * (1 - delta * dt) + dK"}
  - {id: TOY-COST-NORMALIZATION, model: toy, text: "kappa = c_K + c_E + c_C / (1 - phi)"}
  - {id: TOY-REDUCES-TO-PACT, model: toy, text: "s / kappa = exp(g * dt) - 1", note: "with every cap slack, toy output grows exactly like PACT-GROWTH with chi = 1 and A << Kmax"}
