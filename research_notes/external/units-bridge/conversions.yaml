# Cross-model conversions for issue #11. [[ai gen]] Written 2026-10-25. Status: proposed; nothing validated.
#
# Every conversion between two dictionary quantities (quantities.yaml) is listed here with its units, mechanism,
# delay, constraints and evidence status, or listed as forbidden with a reason. tools/units_tool.py checks it.
#
# class
#   normalization            a unit definition with an exact factor (choice of reference); no evidence needed
#   identity                 a mathematical identity (doubling time = ln 2 / rate)
#   empirical_scale_estimate a factor that bridges a normalized unit and a physical one, or two physical dimensions,
#                            estimated from data; needs bounds and an evidence status
#   bounded_scenario         a bridge that cannot be estimated; only its bounds are used, as a scenario
#   unidentified             no estimate and no defensible bounds; must stay uncoupled (coupled: false)
#   forbidden                must never be used, with the reason (the stopping rule of #11)
# form: linear (to = factor * from), reciprocal (to = factor / from), log10 (to = log10(from / factor)),
#       exp10 (to = factor * 10 ** from)
# coupled: true when a model in this repository actually uses the conversion to pass a value between modules.
#
# Rules the checker enforces: dimensions of from, factor and to agree for the form; a factor that bridges a
# normalized and a physical dimension (or two physical dimensions other than time) is never a normalization or an
# identity; a derivation, when given, reproduces the factor's value and unit; unidentified and forbidden entries
# are uncoupled; no chain of coupled conversions leads from a capability metric to supply-chain closure or external
# control, or to a quantity marked no_calibration_from_capability.

schema_version: 0.1.0
status: proposed

conversions:
  # ---- identities and normalizations ----------------------------------------------------------------------------
  - id: CV-RATE-TO-DOUBLING
    from: QTY-GROWTH-RATE-G
    to: QTY-DOUBLING-TIME
    class: identity
    form: reciprocal
    factor: {value: 0.6931471805599453, unit: "1"}
    mechanism: "ln 2 divided by a constant continuous growth rate"
    delay: {kind: none, note: "identity"}
    constraints: "Only for a constant rate below the cap; with chi < 1 the rate is chi g."
    evidence: {status: normalization, ref: "mathematics"}
    coupled: true
    used_by: [metzger/RECHECK.md, docking.md section 7]
  - id: CV-CAPACITY-TO-OUTPUT
    from: QTY-PACT-A
    to: QTY-INDUSTRIAL-OUTPUT
    class: normalization
    form: linear
    factor: {value: 1.0, unit: 1/yr}
    mechanism: "The output rate of DEF-EIU: one EIU of capacity yields one EIU of output per year. This defines the flow unit EIU/yr; it is not a capital-output ratio."
    delay: {kind: none, note: "definition"}
    constraints: "The solver leaves it implicit (dt = 1 yr, rate 1); PACT-AI-FLOW, PACT-HUMAN-FLOW and PACT-TRADE balance only with it. Stated in the mode contract as AD-PACT's output_rate (A booked to industrial_capacity, its output to industrial_output); the units checker requires the two to agree (#39, README finding F2)."
    evidence: {status: normalization, ref: "DEF-EIU; PARAMS H ('Normalisation'), gam; README finding F2"}
    coupled: true
    used_by: [coupling_toy.py, systems/modes.yaml AD-PACT output_rate]
  - id: CV-TOY-DESIGN-TO-CAPITAL
    from: QTY-TOY-DESIGN
    to: QTY-TOY-CAPITAL
    class: identity
    form: linear
    factor: {value: 1.0, unit: yr}
    mechanism: "Integration over one step: new capacity of all kinds per step is at most design throughput times dt."
    delay: {kind: fixed, value: 1.0, unit: yr, note: "one model step"}
    constraints: "An upper bound, not an equality: investment, energy and chip supply cap the same additions."
    evidence: {status: normalization, ref: "coupling_toy.py, equation TOY-DESIGN-CAP"}
    coupled: true
    used_by: [coupling_toy.py]
  - id: CV-GATE-Q-TO-FLOPS
    from: QTY-GATE-COMPUTE-STOCK
    to: QTY-TRAINING-COMPUTE-RATE
    class: identity
    form: linear
    factor: {value: 1.0, unit: "1"}
    mechanism: "A change of time unit only (FLOP/yr to FLOP/s); the unit table carries the 3.156e7."
    delay: {kind: none, note: "identity"}
    constraints: "Q is the shared stock; only its training share maps to compute_training. The share is resolved in #35 (E7: D + R = g(Q) at the start of the step), so the training share is QTY-GATE-TRAINING-COMPUTE, not Q."
    evidence: {status: normalization, ref: "epoch-gate/INTERFACES.md"}
    coupled: false
    used_by: []
  # ---- empirical scale estimates --------------------------------------------------------------------------------
  - id: CV-EIU-TO-PRIMARY-POWER
    from: QTY-EARTH-INDUSTRY-H
    to: QTY-WORLD-PRIMARY-POWER
    class: empirical_scale_estimate
    form: linear
    factor: {value: 1.96e+13, bounds: [1.88e+13, 1.97e+13], unit: W/EIU}
    derivation: P_earth
    mechanism: "Energy intensity of the unit: the primary energy one EIU of today's capacity uses, i.e. world primary energy use. Not the definition of the EIU (DEF-EIU rejects the energy reading), so the docking's 'one EIU = 19.6 TW' is this estimate."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "The bounds span the 2023 and 2024 Energy Institute figures and their change of method. Applying it off Earth assumes Earth's energy per unit of output there, which an off-Earth solar industry need not have (the Metzger bridge and Kmax's 'Dyson-scale' basis both rely on this)."
    evidence: {status: observed_secondary, ref: "decision_model.md (EI Review 2024 via DieselNet); physics_economics.md (EI Review 2025)"}
    coupled: false
    used_by: [docking/metzger.py]
  - id: CV-METZGER-ENERGY-TO-EIU
    from: QTY-METZGER-GEN5-ENERGY
    to: QTY-PACT-A
    class: empirical_scale_estimate
    form: linear
    factor: {value: 5.102040816326531e-14, bounds: [5.076e-14, 5.319e-14], unit: EIU/W}
    derivation: 1 / P_earth
    mechanism: "Energy use divided by Earth's energy use per EIU; J/yr over W is a pure number (s per yr)."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "Inherits CV-EIU-TO-PRIMARY-POWER. Assumes a lunar industry uses as much energy per unit of 'industry' as Earth's."
    evidence: {status: observed_secondary, ref: "as CV-EIU-TO-PRIMARY-POWER"}
    coupled: false
    used_by: [docking/metzger.py]
  - id: CV-GWP-TO-EIU-OUTPUT
    from: QTY-GWP
    to: QTY-INDUSTRIAL-OUTPUT
    class: empirical_scale_estimate
    form: linear
    factor: {value: 8.955002108570063e-15, bounds: [8.449502298688144e-15, 1.0626885527300513e-14], unit: EIU/USD}
    derivation: 1 / Y_ref
    mechanism: "Under DEF-EIU one EIU/yr is the reference year's gross world output, so a GWP in USD/yr divided by the measured reference-year GWP is output in EIU/yr. Central: 2024 world GDP, current US$, market exchange rates, 1.117e14 USD/yr."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "Bounds: reference year 2023 to 2025 times price base (current US$ or constant 2015 US$), market exchange rates: 9.41e13 to 1.18e14 USD/yr. PPP (1.89e14 to 2.11e14) is excluded because GATE's Y(0) = 1.10e14 lies in the market-rate band and far below PPP; GATE's 'real USD' base year is still unstated (#13), which the bounds cover. Valid as a scale at the reference year; at later dates a real-USD path is a quantity index, and with large relative price changes (automation) it stops tracking capacity. Maps units only: GATE's Y is Earth's output, which the pact freezes at H, so it is never fed into H or A (coupled: false)."
    evidence: {status: observed_primary, ref: "EV-WB-WDI-GDP-2026 (World Bank WDI API, NY.GDP.MKTP.CD and .KD, world, accessed 2026-10-25; data/world_gdp_wdi.json)"}
    coupled: false
    used_by: [equations.yaml GATE-Y-IN-EIU, README.md (GATE output in EIU/yr)]
  - id: CV-TRAINING-TO-EFFECTIVE-COMPUTE
    from: QTY-TRAINING-COMPUTE
    to: QTY-EFFECTIVE-COMPUTE
    class: empirical_scale_estimate
    form: linear
    factor: {unit: "1"}
    mechanism: "Effective compute is physical compute times the software-efficiency multiplier, 10^SE (QTY-SOFTWARE-EFFICIENCY, in OOMs)."
    delay: {kind: unknown, note: "AIFM applies efficiency gains at once to all training compute (no lag, #14); GATE's lag not pinned (#13)"}
    constraints: "The multiplier is relative to a reference date each source states: AIFM SE = 0 at 2025.13, GATE S = 1 at the start of 2025. Same dimension as FLOP, different meaning. No common efficiency path, so no value."
    evidence: {status: external_pending, ref: "#13; AIFM side pinned in #14 (EV-UNITS-AIFM-CONVENTIONS)"}
    coupled: false
    used_by: []
  # ---- bounded scenarios ----------------------------------------------------------------------------------------
  - id: CV-METZGER-T-TO-EIU
    from: QTY-METZGER-ASSET-MASS
    to: QTY-PACT-A
    class: bounded_scenario
    form: linear
    factor: {value: 2.5128e-10, bounds: [2.5e-11, 2.5e-9], unit: EIU/t}
    derivation: E_gen5 / P_earth / m_gen5
    mechanism: "Asset mass to EIU through Gen 5.0's energy use per tonne of assets."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "One generation's energy per tonne, applied to all; the bounds (a factor of 10 each way) are a scenario band, not an estimate. The docking's 2.4e-10 used the by-eye 6,600 t; the re-digitized 6,434 t gives 2.51e-10."
    evidence: {status: scenario, ref: "docking.md section 7; metzger/RECHECK.md"}
    coupled: false
    used_by: [docking/metzger.py]
  - id: CV-TOY-COMPUTE-TO-DESIGN
    from: QTY-TOY-COMPUTE
    to: QTY-TOY-DESIGN
    class: bounded_scenario
    form: linear
    factor: {value: 1.0, bounds: [0.1, 100.0], unit: 1/yr}
    mechanism: "lam: design and integration throughput per unit of research compute (the coding-speed lever), plus a constant human term D_h."
    delay: {kind: bounded, bounds: [0.0, 5.0], unit: yr, note: "years from research output to designs used in construction; not modelled (0) in the toy, since with constant lam a delay only shifts the design-bound path and cannot lift a physical cap"}
    constraints: "Applies to the research share phi of compute only. It cannot raise energy capacity, chip supply or the investment budget."
    evidence: {status: scenario, ref: "coupling_toy.py; no observable fixes lam (CV-HORIZON-TO-DEV-TIME and CV-DEV-TIME-TO-RESEARCH stay unidentified after the #42 recheck)"}
    coupled: true
    used_by: [coupling_toy.py]
  # ---- unidentified: kept uncoupled -----------------------------------------------------------------------------
  - id: CV-GATE-D-TO-FRONTIER-TRAINING
    from: QTY-GATE-TRAINING-COMPUTE
    to: QTY-AIFM-TRAINING-CAPACITY
    class: unidentified
    form: linear
    mechanism: "World training compute (GATE, economy aggregate) to one frontier project's training capacity (AIFM): the project's share s."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "s is in (0, 1]; s = 1 gives an upper bound only (systems/modes.yaml coupling XC-GATE-AIFM-TRAINING). Apart from s it is a change of unit: 1 H100e = 4e14 FLOP/s (1.262e22 FLOP per H100e-year), AIFM's convention (EV-UNITS-AIFM-CONVENTIONS)."
    evidence: {status: not_collected, ref: "#35; no source for the frontier share of world training compute is pinned"}
    coupled: false
    used_by: [epoch-gate/coupling_example.py (upper bound, s = 1)]
  # The chain time horizon -> developer time -> research output, rechecked in #42 after the METR (#12) and AI Futures
  # (#14) replications landed. A link counts as identified only with an evidence record and a stated conversion; none
  # of these has both, so each stays unidentified and unused (stopping rule of #42). README "Recheck after #12 and #14".
  - id: CV-HORIZON-TO-DEV-TIME
    from: QTY-METR-HORIZON
    to: QTY-DEV-TIME-RATIO
    class: unidentified
    form: linear
    mechanism: "Longer task horizons might shorten realized developer task time."
    delay: {kind: unknown, note: "adoption lag; not observed"}
    constraints: >-
      Rechecked in #42; not identified. (1) One usable paired observation: the 2025 RCT ratio 1.19 (95% CI 1.02 to
      1.39; EV-METR-RCT-2025) with models whose TH1.0 p50 was 29 min (Claude 3.5 Sonnet New) and 59 min (Claude 3.7
      Sonnet) when the study ran (EV-METR-TH10-2025-03-19). One point cannot fix a slope, and it is a slowdown while
      horizons were rising, so not even the sign of the link is established. (2) The 2026 follow-up (EV-METR-UPLIFT-2026)
      is judged unreliable by METR itself (30 to 50% of developers withheld tasks; time accounting fails with
      concurrent agents): no second point. (3) The two quantities measure different populations: self-contained,
      automatically scored tasks against issues in developers' own large repositories with implicit requirements. In
      METR's follow-up 38% of agent PRs passed the maintainers' tests and none was mergeable as-is (EV-METR-ALGO-2025),
      so the gap is task-dependent, not a factor. (4) The from-quantity has no forecast either: the #12 holdout and the
      #56 per-model holdout both have the verdict 'not established'. (5) AIFM's serial coding uplift (2.0 at 2026.578) is an elicited belief, not
      a reading of these studies (EV-UNITS-AIFM-CONVENTIONS), so it does not identify the link.
    evidence: {status: observed_secondary, ref: "EV-METR-RCT-2025, EV-METR-UPLIFT-2026, EV-METR-ALGO-2025, EV-METR-TH10-2025-03-19 (#12); the records support the reasons above, not a conversion"}
    coupled: false
    used_by: []
  - id: CV-DEV-TIME-TO-RESEARCH
    from: QTY-DEV-TIME-RATIO
    to: QTY-RESEARCH-OUTPUT
    class: unidentified
    form: linear
    mechanism: "Faster coding might raise software-efficiency growth, limited by compute for experiments and by research judgment."
    delay: {kind: unknown, note: "research lag; AIFM has none (software efficiency applies at once to all training compute)"}
    constraints: >-
      Rechecked in #42; not identified. AIFM gives a functional form, not an estimate: serial coding labor (a CES of
      human FTEs and AI labor, rho -2, raised to parallel_penalty 0.5) enters research effort in a CES with experiment
      compute^0.655, times research taste; effort accumulates to a research stock RS and SE = r_software log10(RS/RS_0).
      (1) Its parameters are elicited or calibrated, not fitted to research-output data (ai-futures-model/MECHANISMS.md);
      r_software is calibrated to an uncited 1 OOM/yr at 2024 (EV-UNITS-AIFM-CONVENTIONS). (2) Before 2026 the
      feedback-on and feedback-off paths differ by under 0.1 OOM (ai-futures-model/results/feedback_off.json), so the
      historical record cannot tell whether AI coding has moved software progress at all; in horizon units the on and
      off curves fit METR's observations equally well (ai-futures-model/HELDOUT.md, #45). (3) AIFM's input is a serial
      labor multiplier of one aggregate project, not a per-issue time ratio of individual developers; no conversion
      between them is stated by either source. (4) No review or integration stage: every unit of effort becomes
      efficiency, which overstates any coding effect. (5) The repository holds no observation of research output
      (QTY-RESEARCH-OUTPUT is a source-model assumption). Compute-bound research does not speed up with labor alone, and
      GATE treats research inputs differently (#13).
    evidence: {status: source_model_output, ref: "EV-AIFM-REFERENCE-TRAJECTORY and ai-futures-model/results/feedback_off.json (#14); EV-UNITS-AIFM-CONVENTIONS. The structure is the source model's, not evidence for a conversion."}
    coupled: false
    used_by: []
  - id: CV-INFERENCE-TO-AGENT-LABOR
    from: QTY-INFERENCE-COMPUTE-RATE
    to: QTY-AGENT-LABOR
    class: unidentified
    form: linear
    mechanism: "Agent-hours per year that an inference allocation can run."
    delay: {kind: none, note: "contemporaneous"}
    constraints: >-
      Depends on model size, tokens per agent-hour and utilization; a production function uses this or the compute,
      not both (mode contract accounting). AIFM (#14) does not supply it: it maps inference H100e straight to AI coding
      labor on an optimal-CES task frontier with an elicited efficiency slope (3 OOMs per anchor-progress-year), never
      through agent-hours.
    evidence: {status: not_collected, ref: "no data in the repository"}
    coupled: false
    used_by: []
  - id: CV-AIFM-FTE-TO-PERSON-HOURS
    from: QTY-AIFM-HUMAN-CODING-LABOR
    to: QTY-HUMAN-RESEARCH-LABOR
    class: unidentified
    form: linear
    factor: {unit: person*h/FTE/yr}
    mechanism: "Hours worked per full-time-equivalent year."
    delay: {kind: none, note: "contemporaneous"}
    constraints: "AIFM states no hours per FTE and its series has no per-row sources; a conventional value (about 2000 h) would be this project's assumption, and nothing here needs it, so none is set (#42)."
    evidence: {status: not_collected, ref: "AIFM input series at 1c40ecdb; no hours stated"}
    coupled: false
    used_by: []
  - id: CV-OOM-TO-FLOP
    from: QTY-AIFM-PROGRESS
    to: QTY-EFFECTIVE-COMPUTE
    class: unidentified
    form: exp10
    factor: {unit: FLOP}
    mechanism: "Effective FLOP = reference FLOP times 10 to the OOM index."
    delay: {kind: none, note: "definition"}
    constraints: >-
      Rechecked in #42. The reference is now known: AIFM's logE is log10 of FLOP itself (reference 1 FLOP), at 2025.13
      software efficiency in its output (progress_model/_impl.py:1835-1837 at 1c40ecdb). It stays unidentified because
      the meanings differ: logE is cumulative effective compute over all training capacity since the start of the
      data, while QTY-EFFECTIVE-COMPUTE is one training run (GATE's C_T, base S(start of 2025) = 1). The upstream notes
      that logE and the log of the training stock do not coincide at the reference year; mapping one to a single run
      needs a run-length assumption that neither source states.
    evidence: {status: source_model_output, ref: "EV-AIFM-REFERENCE-TRAJECTORY; EV-UNITS-AIFM-CONVENTIONS"}
    coupled: false
    used_by: []
  - id: CV-METZGER-RATE-TO-G
    from: QTY-METZGER-GROWTH-RATE
    to: QTY-GROWTH-RATE-G
    class: unidentified
    form: linear
    factor: {unit: "1"}
    mechanism: "Would carry the bootstrap rate over to the pact's scale."
    delay: {kind: none, note: "none"}
    constraints: "Metzger models 7 to 23,000 t (1e-9 to 6e-6 EIU under CV-METZGER-T-TO-EIU); the pact starts at 1e-3 EIU. The g sweep 0.07 to 0.69 is the bounded scenario in use; Metzger's 0.65 sits near its top."
    evidence: {status: source_model_output, ref: "metzger/RECHECK.md"}
    coupled: false
    used_by: []
  - id: CV-LOCAL-CHIPS-TO-CHI0
    from: QTY-LOCAL-CHIP-SHARE
    to: QTY-CHI0
    class: unidentified
    form: linear
    factor: {unit: "1"}
    mechanism: "Crude local chips might keep growth near full speed (Metzger), raising chi0 toward 1."
    delay: {kind: unknown, note: "time to build crude fabs"}
    constraints: "The toy shows a supply limit does not act as a constant multiplier at all (results/coupling_toy.md); chi0 stays a swept project assumption."
    evidence: {status: source_model_assumption, ref: "EV-METZGER-2013 p. 8-9"}
    coupled: false
    used_by: []
  # ---- forbidden: the stopping rule of #11 ----------------------------------------------------------------------
  - id: CV-NO-GENSPACING-AS-DOUBLING
    from: QTY-METZGER-GEN-SPACING
    to: QTY-DOUBLING-TIME
    class: forbidden
    reason: "Same unit, different meaning: mass grows about 3.65x per 2-year generation in Metzger's max case. This was the g citation error (AS-GCITE)."
    coupled: false
  - id: CV-NO-HORIZON-TO-STRIKE-ODDS
    from: QTY-METR-HORIZON
    to: QTY-STRIKE-ODDS
    class: forbidden
    reason: "Task capability on a suite is not the odds of seizing control from defended states (#11 stopping rule; AD-METR unsupported extrapolation)."
    coupled: false
  - id: CV-NO-BENCHMARK-TO-STRIKE-ODDS
    from: QTY-BENCH-SCORE
    to: QTY-STRIKE-ODDS
    class: forbidden
    reason: "#11 stopping rule: seizure odds are not calibrated from coding benchmark scores."
    coupled: false
  - id: CV-NO-HORIZON-TO-DENIAL
    from: QTY-METR-HORIZON
    to: QTY-DENIAL-Q
    class: forbidden
    reason: "Capability says nothing about whether humans can fire a denial reserve (mode contract: capability alone does not establish sovereignty)."
    coupled: false
  - id: CV-NO-BENCHMARK-TO-CLOSURE
    from: QTY-BENCH-SCORE
    to: QTY-LE-CLOSURE-THRESHOLD
    class: forbidden
    reason: "#11 stopping rule: industrial closure is not calibrated from coding benchmarks; it is a bill-of-materials question."
    coupled: false
  - id: CV-NO-HORIZON-TO-AIFM-PROGRESS
    from: QTY-METR-HORIZON-P80
    to: QTY-AIFM-PROGRESS
    class: forbidden
    reason: "AIFM's present horizon level is fitted to METR's TH1.1 p80 (fitted_to of EV-AIFM-REFERENCE-TRAJECTORY: EV-METR-TH11-2026-03-03 to -05-08; #45). Feeding METR values back into AIFM's progress, or scoring AIFM against the same values, counts one observation twice. METR values published after AIFM's fit date can serve as held-out targets under the #8 protocol (a #14 follow-up), never as an input to its progress."
    coupled: false
  - id: CV-NO-MILESTONE-TO-CLOSURE
    from: QTY-AIFM-MILESTONE
    to: QTY-LE-CLOSURE-THRESHOLD
    class: forbidden
    reason: "A capability milestone date is not a date of supply-chain closure (AD-AIFM unsupported extrapolation)."
    coupled: false
  - id: CV-NO-BASIC-CHIPS-AS-LEADING-EDGE
    from: QTY-LOCAL-CHIP-SHARE
    to: QTY-LE-CLOSURE-THRESHOLD
    class: forbidden
    reason: "Basic chip production (CL-BASIC-CHIPS) is not leading-edge fab independence (CL-LEADING-EDGE-FAB); they differ by about 6e4 in scale in the docking."
    coupled: false
  - id: CV-NO-OWNERSHIP-AS-INDEPENDENCE
    from: QTY-RESOURCE-HOLDING-SHARE
    to: QTY-LE-FAB-LEVEL-F
    class: forbidden
    reason: "Holding resources (CL-RESOURCE-OWNERSHIP) does not remove dependence on withheld chips (CL-LEADING-EDGE-FAB)."
    coupled: false
  - id: CV-NO-CAPACITY-AS-CAPABILITY
    from: QTY-PACT-A
    to: QTY-METR-HORIZON
    class: forbidden
    reason: "AD-PACT unsupported extrapolation: industrial capacity A is not AI capability."
    coupled: false
  - id: CV-NO-EXPERIMENT-AS-INFERENCE
    from: QTY-EXPERIMENT-COMPUTE-RATE
    to: QTY-INFERENCE-COMPUTE-RATE
    class: forbidden
    reason: "Same unit, different ledger (#47): inference compute powers agent labor in AIFM, experiment compute enters research effort directly. Reading one as the other counts agent labor that does not exist."
    coupled: false
  - id: CV-NO-EXPERIMENT-AS-TRAINING
    from: QTY-EXPERIMENT-COMPUTE-RATE
    to: QTY-TRAINING-COMPUTE-RATE
    class: forbidden
    reason: "Same unit, different ledger (#47): experiment compute does not train the released model, and AIFM takes both series as separate inputs."
    coupled: false
