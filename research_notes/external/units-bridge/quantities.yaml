# Quantity dictionary for the bridge from AI research progress to industrial growth and chip autonomy (issue #11).
#
# Status: proposed. [[ai gen]] Written 2026-10-25. Nothing here is human_validated or empirically validated.
# Read with README.md (this folder). Shape: schema/units-bridge.schema.json. Rules: tools/units_tool.py
# (`make units-check`, part of `make check`).
#
# What the checker enforces on this file:
#   1. every unit string parses into the declared base dimensions;
#   2. every category the issue names has at least one quantity;
#   3. every mode-contract reference (accounting id, dimension, mode, adapter quantity) exists in systems/modes.yaml,
#      and the adapter quantity's unit is the one declared here (normalized spelling compared by dimension);
#   4. every pact parameter named exists in equilibrium_model.PARAMS;
#   5. the four closure and sovereignty concepts are distinct, map to different contract elements, and none is
#      reachable from another through a coupled conversion;
#   6. (#39) each normalized dimension has exactly one definition, as a stock with the readings it rejects; the
#      definition's equations and conversions exist and its output rate is a normalization from a stock to a flow;
#   7. (#39) stocks and flows stay apart: a stock is never booked to a flow accounting quantity of the contract nor a
#      flow to a stock; in a normalized unit a flow carries 1/time and a stock does not; an adapter quantity linked
#      here declares the same kind, and an adapter output rate equals the dictionary's output-rate conversion.
#
# Evidence status (per quantity, about the values this repository uses, not about the concept):
#   normalization      a unit definition; needs no evidence and carries none
#   observed_primary   a measured value read in primary form in this project (with a dated evidence record)
#   observed_secondary a measured value cited here from a secondary summary; primary not read in this project
#   source_model_output a published model's output (not an observation)
#   source_model_assumption a published model's input
#   project_assumption a value chosen in this project
#   external_pending   an observable whose source is being pinned and replicated elsewhere (#12, #13, #14)
#   not_collected      an observable is defined, but no data are in the repository
#   scenario           a bounded scenario value (the coupling toy)

schema_version: 0.1.0
status: proposed

# Base dimensions. Two of them are normalizations, not physical dimensions: earth_industry (the pact solver's
# unit, H = 1; defined in DEF-EIU below) and le_capacity (world leading-edge chip capacity, F = 1; DEF-LEC). Converting
# either to a physical unit needs an empirical scale estimate (conversions.yaml), never a definition.
dimensions:
  physical: [time, energy, mass, money, operation, person, agent, task]
  normalized: [earth_industry, le_capacity]

units:
  "1": {factor: 1, dims: {}}
  s: {factor: 1, dims: {time: 1}}
  h: {factor: 3600, dims: {time: 1}}
  yr: {factor: 31557600, dims: {time: 1}, note: "Julian year"}
  J: {factor: 1, dims: {energy: 1}}
  EJ: {factor: 1.0e+18, dims: {energy: 1}}
  W: {factor: 1, dims: {energy: 1, time: -1}}
  MW: {factor: 1.0e+6, dims: {energy: 1, time: -1}}
  TW: {factor: 1.0e+12, dims: {energy: 1, time: -1}}
  kg: {factor: 1, dims: {mass: 1}}
  t: {factor: 1000, dims: {mass: 1}, note: "metric ton (Metzger's MT)"}
  USD: {factor: 1, dims: {money: 1}, note: "price year to be stated by the source adapter"}
  FLOP: {factor: 1, dims: {operation: 1}}
  person: {factor: 1, dims: {person: 1}}
  agent: {factor: 1, dims: {agent: 1}, note: "one running agent instance"}
  task: {factor: 1, dims: {task: 1}}
  EIU: {factor: 1, dims: {earth_industry: 1}, note: "Earth-industry unit, a stock: the world economy's productive capacity in the reference year; the pact solver's H = 1 (DEF-EIU)"}
  LEC: {factor: 1, dims: {le_capacity: 1}, note: "world leading-edge chip-making capacity in the reference year, a stock; the pact solver's F = 1 (DEF-LEC)"}

# Unit definitions (issue #39). Each normalized dimension has exactly one definition. A definition says what one unit
# is, that it is a stock, the output rate that turns it into a flow (when any quantity uses the flow), which equations
# of the solver read it as a stock and which as a flow, which conversions measure it, and the readings it rejects.
# tools/units_tool.py checks the links and the stock/flow rules (README "What the checker enforces").
definitions:
  - id: DEF-EIU
    unit: EIU
    dimension: earth_industry
    kind: stock
    definition: >-
      One Earth-industry unit (EIU) is the productive capacity of the whole world economy in the reference year: the
      capital, energy supply, compute, labour and organisation that together produce that year's gross world output.
      It is a stock. Its output rate is fixed by convention at one EIU of output per year per EIU of capacity, so one
      EIU/yr is the reference year's gross world output, as a real quantity. The pact solver's H = 1 is one EIU, and A,
      A0, A_close, Kmax, D and the rival's s_R are stocks in this unit.
    reference_year: >-
      The solver's 'today' is undated. Measured scales take 2024, the middle of the years the repository's other
      readings use (primary energy 2023 and 2024; GATE's start of 2025), and carry 2023 to 2025 in their bounds.
    flow_unit: EIU/yr
    output_rate:
      conversion: CV-CAPACITY-TO-OUTPUT
      note: >-
        1/yr. The solver never writes it because dt = 1 yr and the rate is 1; equations PACT-AI-FLOW, PACT-HUMAN-FLOW
        and PACT-TRADE do not balance without it. It is a normalization (the definition of the flow unit), not a
        capital-output ratio: today's measured capital-output ratio is not 1 yr and plays no role here.
    basis:
      - {equation: PACT-GROWTH, role: stock, reading: "A compounds and is capped by a resource pool Kmax: capacity that builds more capacity."}
      - {equation: PACT-PRIZE, role: stock, reading: "A seizure adds (1 - c_w) H to A: Earth's capacity changes hands; destruction c_w is a share of it."}
      - {equation: PACT-REINVEST, role: stock, reading: "Trade goods reinvested (reinv = 1) add sigma T dt to the stock."}
      - {equation: PACT-AI-FLOW, role: flow, reading: "The AI's utility each year is over rho A plus its trade share: the stock's yearly output."}
      - {equation: PACT-HUMAN-FLOW, role: flow, reading: "Human welfare each year is rho H = 1 plus trade: the whole economy's yearly output, the unit in which B_R is 'years of welfare'."}
      - {equation: PACT-TRADE, role: flow, reading: "The trade surplus is a share gam of the smaller partner's economy, per year."}
    measured_by: [CV-GWP-TO-EIU-OUTPUT, CV-EIU-TO-PRIMARY-POWER]
    rejects:
      - reading: "Industry: the industrial sector (manufacturing, mining, utilities, construction), as the solver's comments ('Earth's industry') suggest."
        reason: >-
          The solver's equations treat H as the whole economy: human welfare per year is rho H (PACT-HUMAN-FLOW), the
          trade surplus is a share of 'the smaller partner's economy' (PACT-TRADE), and the denial reserve kills a share
          d of 'Earth capacity'. Industry is about a quarter of world value added (25.4% in 2024, World Bank
          NV.IND.TOTL.ZS; data/world_gdp_wdi.json), so this reading would make three quarters of human welfare
          disappear from the model. The word 'industry' stays in the unit's name only.
      - reading: "Primary energy: one EIU is today's world primary energy use (19.6 TW), as the Metzger docking reads it."
        reason: >-
          Primary energy is a flow (W), so it repeats the stock/flow confusion; no equation of the solver uses energy;
          and energy per unit of output differs between Earth and an off-Earth solar industry, so equal energy is not
          equal capacity. Where the model's text uses energy (the Metzger docking; Kmax '1e13 ~ Dyson-scale'), it relies
          on an energy-intensity estimate, not on the unit's definition.
        kept_as: CV-EIU-TO-PRIMARY-POWER
      - reading: "GDP: one EIU is gross world product in USD."
        reason: >-
          GDP is a flow measured in money at a price base. The solver's A and H are stocks (PACT-GROWTH, PACT-PRIZE) and
          the solver has no prices. GDP measures the unit's output rate in the reference year, not the unit, and a
          money index stops tracking capacity once relative prices move far (an automated economy).
        kept_as: CV-GWP-TO-EIU-OUTPUT
    note: >-
      Changing the definition changes no parameter value or result of the solver, which is homogeneous in this
      normalization; it changes only what the conversions to energy, mass and money mean.
  - id: DEF-LEC
    unit: LEC
    dimension: le_capacity
    kind: stock
    definition: >-
      One leading-edge capacity unit (LEC) is the world's leading-edge chip-making capacity in the reference year:
      the fabs at the leading node and their supply chains. A stock. The solver's F = 1 is one LEC; f_fab (one fab's
      share) and the covert-fab count n_cf are in this unit. No quantity uses an LEC flow, so no output rate is defined.
    basis:
      - {equation: PACT-FAB-DISMANTLE, role: stock, reading: "F falls by dt / T_dis per year of dismantling and rises by dt / T_rebuild: a level of installed capacity, not wafer output."}
    measured_by: []
    rejects:
      - reading: "Leading-edge wafer output per year."
        reason: "F is reduced by dismantling and restored by rebuilding over years, and covert fabs add n_cf f_fab to it: it is installed capacity, a stock. Output would need a utilization rate the solver does not have."

categories: [capability_metric, research_labor, research_output, software_efficiency, compute_training, compute_inference,
             compute_experiment, energy, physical_capital, physical_output, supply_chain_closure, external_control]

quantities:
  # ---- capability metrics -------------------------------------------------------------------------------------
  - id: QTY-METR-HORIZON
    name: "METR 50% (or 80%) task time horizon"
    category: capability_metric
    unit: h
    kind: state
    semantic: "human completion time of tasks a model finishes with the stated success rate on a stated task suite and scaffold"
    observable: "METR task-suite runs; logistic fit of success against human task time"
    models: [AD-METR]
    contract: {adapter_quantity: {adapter: AD-METR, name: "50% task time horizon"}, dimension: rd_capability}
    evidence: {status: external_pending, ref: "#12 pins the source and replicates it under research_notes/external/"}
    note: "A time, but not a duration of anything the model does in the world. Never converted to calendar time, research labor or strategic odds here."
  - id: QTY-BENCH-SCORE
    name: "Benchmark score (e.g. RE-Bench normalized score)"
    category: capability_metric
    unit: "1"
    kind: share
    semantic: "score on a fixed task suite, normalized by the source"
    observable: "benchmark runs with a stated scaffold and budget"
    models: [AD-METR]
    contract: {dimension: rd_capability}
    evidence: {status: external_pending, ref: "#12"}
  - id: QTY-AIFM-MILESTONE
    name: "AI Futures capability milestone date (AC, SC, SAR, SIAR, TED-AI, ASI)"
    category: capability_metric
    unit: yr
    kind: date
    semantic: "calendar date at which a threshold on the effective-compute scale is crossed"
    observable: "none directly; a model output"
    models: [AD-AIFM]
    contract: {adapter_quantity: {adapter: AD-AIFM, name: "capability milestones AC, AI2027-SC, SAR, SIAR, TED-AI, ASI (latent thresholds)"}, dimension: rd_capability}
    evidence: {status: external_pending, ref: "#14"}
  # ---- research labor -----------------------------------------------------------------------------------------
  - id: QTY-HUMAN-RESEARCH-LABOR
    name: "Human research labor"
    category: research_labor
    unit: person*h/yr
    kind: flow
    semantic: "hours of human research and engineering work per year"
    observable: "headcount times hours, from lab reports or surveys"
    models: [AD-AIFM, AD-GATE]
    contract: {accounting: human_labor}
    evidence: {status: not_collected, ref: "no data in the repository"}
  - id: QTY-AGENT-LABOR
    name: "Agent research labor"
    category: research_labor
    unit: agent*h/yr
    kind: flow
    semantic: "hours of agent work per year; a use of inference compute"
    observable: "deployment logs: agent instances times hours"
    models: [AD-AIFM]
    contract: {accounting: agent_labor}
    evidence: {status: not_collected, ref: "no data in the repository"}
    note: "Derived from compute_inference in the mode contract. A production function takes this or inference compute as input, never both."
  - id: QTY-DEV-TIME-RATIO
    name: "Realized developer task time ratio (with AI / without)"
    category: research_labor
    unit: "1"
    kind: ratio
    semantic: "measured change in human developer task time from AI assistance"
    observable: "randomized developer-productivity studies"
    models: [AD-METR]
    contract: {adapter_quantity: {adapter: AD-METR, name: "realized developer task time ratio"}, accounting: human_labor}
    evidence: {status: external_pending, ref: "#12"}
    note: "The only measured link between AI capability and research labor in scope. It is about coding tasks, not about building factories."
  # ---- research output ----------------------------------------------------------------------------------------
  - id: QTY-RESEARCH-OUTPUT
    name: "Research output as software-efficiency growth"
    category: research_output
    unit: 1/yr
    kind: rate
    semantic: "growth rate (ln per year) of the software-efficiency multiplier"
    observable: "algorithmic-progress estimates (compute needed for fixed performance over time)"
    models: [AD-AIFM]
    contract: {accounting: research_output}
    evidence: {status: external_pending, ref: "#14"}
  # ---- software efficiency ------------------------------------------------------------------------------------
  - id: QTY-SOFTWARE-EFFICIENCY
    name: "Software efficiency"
    category: software_efficiency
    unit: "1"
    kind: state
    semantic: "multiplier: effective FLOP per physical FLOP, relative to a stated reference year"
    observable: "compute-equivalent gains at fixed benchmark performance"
    models: [AD-AIFM]
    contract: {adapter_quantity: {adapter: AD-AIFM, name: "software efficiency"}, accounting: research_output}
    evidence: {status: external_pending, ref: "#14"}
  - id: QTY-AIFM-ECI
    name: "Cumulative effective compute (AI Futures)"
    category: software_efficiency
    unit: "1"
    kind: index
    semantic: "log10 of effective training FLOP relative to a stated reference (orders of magnitude)"
    observable: "none directly; a model state"
    models: [AD-AIFM]
    contract: {adapter_quantity: {adapter: AD-AIFM, name: "progress: log10 cumulative effective compute (latent)"}, dimension: rd_capability}
    evidence: {status: external_pending, ref: "#14"}
    note: "A log of a dimensional quantity, so it is meaningful only with its reference FLOP (conversion CV-OOM-TO-FLOP)."
  # ---- compute ------------------------------------------------------------------------------------------------
  - id: QTY-TRAINING-COMPUTE
    name: "Training compute"
    category: compute_training
    unit: FLOP
    kind: stock
    semantic: "physical floating-point operations used to train one set of weights"
    observable: "lab disclosures, Epoch estimates"
    models: [AD-GATE, AD-AIFM]
    contract: {accounting: compute_training}
    evidence: {status: external_pending, ref: "#13, #14"}
  - id: QTY-EFFECTIVE-COMPUTE
    name: "Effective compute"
    category: compute_training
    unit: FLOP
    kind: stock
    semantic: "physical training FLOP times software efficiency (same dimension as FLOP, different meaning); each model's eFLOP is relative to its own software-efficiency base"
    observable: "not observed; physical FLOP times an efficiency estimate"
    models: [AD-GATE, AD-AIFM]
    contract: {adapter_quantity: {adapter: AD-GATE, name: "largest training run C_T"}, accounting: capability}
    evidence: {status: external_pending, ref: "#13 (GATE, S(start of 2025) = 1; epoch-gate/INTERFACES.md), #14"}
    note: "GATE's and AI Futures' eFLOP must be re-based to one software-efficiency path before they are compared (epoch-gate/INTERFACES.md item 2)."
  - id: QTY-TRAINING-COMPUTE-RATE
    name: "Compute allocated to training"
    category: compute_training
    unit: FLOP/s
    kind: stock
    semantic: "installed FLOP/s assigned to training"
    observable: "cluster inventories and schedules"
    models: [AD-AIFM]
    contract: {accounting: compute_training}
    evidence: {status: not_collected, ref: "no data in the repository"}
  - id: QTY-INFERENCE-COMPUTE-RATE
    name: "Compute allocated to inference"
    category: compute_inference
    unit: FLOP/s
    kind: stock
    semantic: "installed FLOP/s assigned to running agents and products"
    observable: "cluster inventories and schedules"
    models: [AD-AIFM]
    contract: {accounting: compute_inference}
    evidence: {status: not_collected, ref: "no data in the repository"}
  - id: QTY-EXPERIMENT-COMPUTE-RATE
    name: "Compute allocated to research experiments"
    category: compute_experiment
    unit: FLOP/s
    kind: stock
    semantic: "installed FLOP/s assigned to research experiments: neither training a released model nor running agents"
    observable: "cluster inventories and schedules; AIFM reads it as the input series experiment_H100e"
    models: [AD-AIFM]
    contract: {accounting: compute_experiment}
    evidence: {status: not_collected, ref: "no data in the repository; AIFM's series is a source_model_assumption (#14)"}
    note: "Added for #47. AIFM's series is in H100-equivalents (10x inference compute in its default series); converting it to FLOP/s needs a per-H100e rate, which this dictionary does not state. Never also counted as inference or training compute (CV-NO-EXPERIMENT-AS-INFERENCE, CV-NO-EXPERIMENT-AS-TRAINING)."
  # ---- energy -------------------------------------------------------------------------------------------------
  - id: QTY-WORLD-PRIMARY-POWER
    name: "World primary energy use (as mean power)"
    category: energy
    unit: W
    kind: flow
    semantic: "world primary energy per year divided by the length of a year"
    observable: "Energy Institute Statistical Review"
    models: [AD-PACT]
    contract: {}
    evidence: {status: observed_secondary, ref: "620 EJ in 2023 = 19.6 TW (EI Review 2024 via DieselNet, decision_model.md); 592 EJ in 2024 = 18.8 TW (EI Review 2025, new 'total energy supply' method, physics_economics.md). Primary not read."}
  - id: QTY-METZGER-GEN5-ENERGY
    name: "Energy use of Metzger's Gen 5.0 lunar industry"
    category: energy
    unit: J/yr
    kind: flow
    semantic: "annual energy use of the modelled lunar industry at Gen 5.0, 70% solar duty cycle"
    observable: "none; a model output"
    models: [Metzger]
    contract: {}
    evidence: {status: source_model_output, ref: "EV-METZGER-2013, arXiv v1 p. 16: 'Figure 3 shows Gen. 5.0 (at 70% duty cycle) using 10^15 J of energy per year'"}
  # ---- physical capital ---------------------------------------------------------------------------------------
  - id: QTY-PACT-A
    name: "AI capacity A (pact solver)"
    category: physical_capital
    unit: EIU
    kind: stock
    semantic: "the AI's off-Earth productive capacity, in EIU (DEF-EIU)"
    observable: "none directly; its output through CV-CAPACITY-TO-OUTPUT, then GWP-equivalent (CV-GWP-TO-EIU-OUTPUT) or energy (CV-EIU-TO-PRIMARY-POWER)"
    models: [AD-PACT]
    contract: {adapter_quantity: {adapter: AD-PACT, name: "AI capacity A"}, accounting: industrial_capacity}
    pact_params: [A0, A_close, Kmax]
    evidence: {status: project_assumption, ref: "assumptions.yaml AS-A0, AS-ACLOSE, AS-SCALE"}
    note: "A stock. Booked to industrial_capacity in the contract, with output rate 1/yr to industrial_output (CV-CAPACITY-TO-OUTPUT); until #39 it was booked to industrial_output, a flow (README finding F2, resolved)."
  - id: QTY-EARTH-INDUSTRY-H
    name: "Earth's industry H"
    category: physical_capital
    unit: EIU
    kind: stock
    semantic: "the world economy's productive capacity in the reference year, frozen in the pact; the unit itself (DEF-EIU)"
    observable: "none; a definition. Its yearly output is measured as gross world product (CV-GWP-TO-EIU-OUTPUT)"
    models: [AD-PACT]
    contract: {}
    pact_params: [H]
    evidence: {status: normalization, ref: "PARAMS H = 1 ('Normalisation')"}
  - id: QTY-METZGER-ASSET-MASS
    name: "Mass of lunar industrial assets (Metzger)"
    category: physical_capital
    unit: t
    kind: stock
    semantic: "mass of hardware brought from Earth and built on the Moon, per generation"
    observable: "none; a model output"
    models: [Metzger]
    contract: {}
    evidence: {status: source_model_output, ref: "EV-METZGER-2013 Fig. 2, re-digitized in metzger/fig2_digitized.json"}
  # ---- physical output and growth -----------------------------------------------------------------------------
  - id: QTY-INDUSTRIAL-OUTPUT
    name: "Industrial output (pact units)"
    category: physical_output
    unit: EIU/yr
    kind: flow
    semantic: "output per year; one EIU/yr is the reference year's gross world output, as a real quantity (DEF-EIU)"
    observable: "gross world product in the reference year at market exchange rates (CV-GWP-TO-EIU-OUTPUT)"
    models: [AD-PACT, AD-GATE, toy]
    contract: {accounting: industrial_output}
    evidence: {status: normalization, ref: "defined through CV-CAPACITY-TO-OUTPUT"}
  - id: QTY-GWP
    name: "Gross world product"
    category: physical_output
    unit: USD/yr
    kind: flow
    semantic: "world output at market or PPP prices (adapter to state which)"
    observable: "national accounts"
    models: [AD-GATE]
    contract: {adapter_quantity: {adapter: AD-GATE, name: "gross world product Y"}, accounting: industrial_output}
    evidence: {status: external_pending, ref: "#13: 'real USD', price base not stated (epoch-gate/INTERFACES.md); GATE's Y(0) = 1.10e14 USD/yr (data/baseline_target.json gwp_init) matches measured GWP at market exchange rates, not PPP (EV-WB-WDI-GDP-2026)"}
  - id: QTY-GATE-COMPUTE-STOCK
    name: "GATE physical compute stock Q"
    category: compute_training
    unit: FLOP/yr
    kind: stock
    semantic: "installed compute capacity, shared by training and runtime"
    observable: "installed accelerator FLOP/s times seconds per year"
    models: [AD-GATE]
    contract: {accounting: compute_training}
    evidence: {status: external_pending, ref: "#13 (epoch-gate/INTERFACES.md); split resolved in #35 (E7): D + R = g(Q) at the start of each step"}
    note: "Not booked by AD-GATE itself: its allocations QTY-GATE-TRAINING-COMPUTE and QTY-GATE-RUNTIME-COMPUTE exhaust usable capacity, so booking Q too would count it twice."
  - id: QTY-GATE-TRAINING-COMPUTE
    name: "GATE training compute D"
    category: compute_training
    unit: FLOP/yr
    kind: stock
    semantic: "the training share of usable capacity g(Q) at the start of a one-year step, in physical FLOP/year; the FLOP performed over that step accumulates into the physical training run"
    observable: "none directly; a model output (training_compute)"
    models: [AD-GATE]
    contract: {adapter_quantity: {adapter: AD-GATE, name: "training compute D"}, accounting: compute_training}
    evidence: {status: source_model_output, ref: "#13 baseline target; identity checked in epoch-gate/coupling_example.py (#35)"}
  - id: QTY-GATE-RUNTIME-COMPUTE
    name: "GATE runtime compute R"
    category: compute_inference
    unit: FLOP/yr
    kind: stock
    semantic: "the runtime share of usable capacity g(Q) at the start of a one-year step, in physical FLOP/year; it runs GATE's digital workers in production"
    observable: "none directly; a model output (runtime_compute)"
    models: [AD-GATE]
    contract: {adapter_quantity: {adapter: AD-GATE, name: "runtime compute (all automated tasks)"}, accounting: compute_inference}
    evidence: {status: source_model_output, ref: "#13 baseline target; identity checked in epoch-gate/coupling_example.py (#35)"}
    note: "Never passed to another model's inference compute: GATE already turns it into digital workers (systems/modes.yaml couplings, #35)."
  - id: QTY-GROWTH-RATE-G
    name: "Off-Earth growth rate g (pact solver)"
    category: physical_output
    unit: 1/yr
    kind: rate
    semantic: "continuous growth rate of A with full chip access, below the cap"
    observable: "none; a project assumption"
    models: [AD-PACT]
    contract: {}
    pact_params: [g]
    evidence: {status: project_assumption, ref: "Not a Metzger value: about half his max-rate fit, at a scale 1e2 to 1e5 times larger than he models (metzger/RECHECK.md)"}
  - id: QTY-METZGER-GROWTH-RATE
    name: "Growth rate of Metzger's max-rate case"
    category: physical_output
    unit: 1/yr
    kind: rate
    semantic: "log-linear fit to asset mass against time, Gen 1.0 to 6.0"
    observable: "none; fitted to a model output"
    models: [Metzger]
    contract: {}
    evidence: {status: source_model_output, ref: "fit to metzger/fig2_digitized.json: 0.647/yr (0.707 for Gen 4.0 to 6.0)"}
  - id: QTY-METZGER-GEN-SPACING
    name: "Generation spacing (Metzger)"
    category: physical_output
    unit: yr
    kind: interval
    semantic: "time between successive hardware generations"
    observable: "none; a model input"
    models: [Metzger]
    contract: {}
    evidence: {status: source_model_assumption, ref: "EV-METZGER-2013 Fig. 2 caption: 'generations in 2-year intervals'"}
    note: "Not a doubling time; mass grows about 3.65x per generation in the max case (CV-GENSPACING-TO-DOUBLING is forbidden)."
  - id: QTY-DOUBLING-TIME
    name: "Doubling time"
    category: physical_output
    unit: yr
    kind: interval
    semantic: "time for a growing stock to double at a constant continuous rate"
    observable: "derived from a rate"
    models: [AD-PACT, Metzger]
    contract: {}
    evidence: {status: normalization, ref: "identity ln 2 / rate (CV-RATE-TO-DOUBLING)"}
  # ---- supply-chain closure -----------------------------------------------------------------------------------
  - id: QTY-LE-CLOSURE-THRESHOLD
    name: "Leading-edge closure threshold A_close"
    category: supply_chain_closure
    unit: EIU
    kind: threshold
    semantic: "off-Earth base at which the AI makes leading-edge chips without Earth"
