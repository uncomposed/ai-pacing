# Sources for the Hugging Face incident reconstruction (issue #15).
# Every source is pinned by URL, access date and a SHA-256 of the bytes retrieved, or by a git blob where
# one exists. Nothing is vendored: the reconstruction cites sections and paraphrases, with short quotes only.
# Licences: none of the pages states a licence; that is recorded as such rather than guessed.
#
# `read` says whether the content was read for this milestone. A source that could not be read is listed with
# the reason and is never used as evidence. `deliberately_unread` marks a source kept unread on purpose as the
# held-out portion described in heldout.yaml.
#
# IDs are the dated evidence records in evidence/records.yaml (issue #8 contract), which carry kind, reading status,
# observation and availability dates and allowed uses. This file adds local pins and revision history. The one source
# without a record (the Black Hat talk) is known only second-hand and is never cited.

accessed: "2026-10-25"

sources:
  - id: EV-METR-HF-2026
    title: "Brief independent investigation of agents' behavior, reasoning and collaboration in the OpenAI / Hugging Face hacking incident"
    publisher: METR (with a Redwood Research contractor)
    url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
    publication_date: "2026-08-26"
    revision: "page edited 2026-09-13 to add conflict-of-interest footnotes (stated on the page)"
    accessed: "2026-10-25"
    sha256: bc636278546176af83fb61a039aa1277b45136edd15f59405b64be1152daacf2
    also: {url: https://metr.org/hugging-face-incident-report-aug-2026.pdf, sha256: f7e87133833363da6eee661df0c86926ef852f8b202ad87695ea6596b92d3c73, note: "PDF of the same report; checked to carry the same core takeaways"}
    licence: not stated
    read: full text, including footnotes and methodology appendix
    scope: "Agent behaviour, reasoning and collaboration, June 26 to July 13 (OpenAI-defined). Out of scope: extent of the security compromise, effectiveness of safeguards, OpenAI's investigation and remediation, events after July 13."
    provenance_limits:
      - "Investigators worked on OpenAI premises with OpenAI-selected datasets; OpenAI could redact non-public information and gave editorial feedback (stated on the page)."
      - "Raw chain-of-thought quotes limited to thirty by OpenAI; others paraphrased."
      - "Analysis heavily delegated to AI agents that the authors call often unreliable; timestamps are reconstructed (median error ~12 s, up to hours in sparse regions)."
      - "Datasets estimated to capture a bit over 90% of message-board activity; ~7% of transcripts contain agent-spoofed tool calls."
    used_for: [events, topology, explanations, timeline, institutional_response, mode_trace]

