  IN-HOLDS-PREDICATE: {role: project_assumption, note: "Normative outcome choice: STRIKE_TOL = 0.01 and a likely rival still counts as holding (AS-RIVAL-HOLDS)."}
  IN-SELECTION: {role: project_assumption, note: "Equilibrium selection and tie-breaking (AS-SELECTION)."}
  IN-N-STATES: {role: project_assumption, note: "N = 2 symmetric states (AS-STATES)."}
  IN-NUMERICS: {role: project_assumption, note: "Grid nA = 160, F interpolation, TIE_TOL; numerical settings, checked by robust_design --check."}
  IN-Q-RED: {role: policy_choice, note: "robust_design lever q_red (independent denial reserves)."}
  IN-D-MULT: {role: policy_choice, note: "robust_design lever D_mult (keep more of Earth's defences)."}
  IN-BR-MULT: {role: policy_choice, note: "robust_design modifier BR_mult (commitments that cut a state's gain from racing)."}
  IN-Q-EFFECTIVE: {role: derived, derived_from: [q, IN-Q-RED], note: "q -> 1 - (1 - q)^q_red in robust_design.apply_design."}
  IN-D-EFFECTIVE: {role: derived, derived_from: [D, IN-D-MULT], note: "D -> D * D_mult."}
  IN-BR-EFFECTIVE: {role: derived, derived_from: [B_R, B_Rc, IN-BR-MULT], note: "B_R and B_Rc times BR_mult."}

# ---------------------------------------------------------------- issue #8: parameter admission
# A PARAMS entry added after `effective` needs, under parameter_roles.<name>.admission:
#   basis            observable | external_model_mapping | consequential_omission
#   evidence_path    the evidence record, or the planned measurement or source mapping that would supply one
#   falsifier        what observation or comparison would show the parameter wrong or unnecessary
#   decision_impact  which claim or design ranking it can change, and the check that showed it
# The entries listed below predate the rule; they were not admitted under it.
admission_rule:
  effective: "2026-10-25"
  grandfathered: [seq, sigma, den, police, psi_div, g, chi0, chi_m, A0, A_close, Kmax, T_dis, T_reloc, T_rebuild, H, gam, reinv, p_s0, D, eps, c_w, c_A, L_f, kill_pre, d, q, q_er, q_ea, T_rot, q_up, L_dn, k_rat, pf_bel, noretry, dis, p_dis_s, m_hide, s_mild, c_cut, D_up, s_reach, h0, h_up, h_coop, a_cred, h_dep, preserve_w, dep_post, dep_coll, h_spill, mu, L_det, beta_bg, th_floor, s_R0, nu, rho_h, move_c, m_frac, n_cf, f_fab, p_block, A_hg, c_blk, rep, ell_inf, r_h, B_R, B_Rc, B_o, kap_coll, c_sanc, c_prog, zeta, c_den, c_dmg, w_seized, r, eta, omega, f_E, c_grav, h_frac]
